<!-- Pathway Pro 2026-11-21: a tracker for a professional review portfolio and CPD. One file, no install, no internet,
     no AI. Open in Microsoft Edge or Google Chrome. Source and licence notes: see "How to use Pathway Pro". -->
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --ink: #1d2330; --muted: #5f6b7a; --line: #dde1e7; --soft: #eef1f5;
  --accent: #1f5fae; --accent-ink: #ffffff; --accent-soft: #e3edf9;
  --good: #1e7b45; --good-soft: #def3e6; --part: #946200; --part-soft: #fff1cc; --bad: #b42323; --bad-soft: #fde2e2;
  --info: #4a5a70; --mark: #fff3a3;
  --radius: 8px; --shadow: 0 1px 2px rgba(20, 30, 50, .06), 0 2px 8px rgba(20, 30, 50, .05);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; font-size: 14.5px; color: var(--ink);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15181d; --panel: #1d2128; --ink: #e5e8ec; --muted: #9aa4b2; --line: #313844; --soft: #252a33;
    --accent: #6ea8f0; --accent-ink: #0d1520; --accent-soft: #1f3048;
    --good: #5fcf8c; --good-soft: #193a28; --part: #e6b94c; --part-soft: #3d3215; --bad: #f08080; --bad-soft: #452222;
    --info: #b5c0cf; --mark: #5a5220; --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); line-height: 1.45; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 1.45rem; margin: 0 0 .6rem; font-weight: 600; }
h2 { font-size: 1.15rem; margin: 1.3rem 0 .5rem; font-weight: 600; }
h3 { font-size: 1rem; margin: 1rem 0 .4rem; font-weight: 600; }
p { margin: .4rem 0; }
code, kbd { font-family: Consolas, "Cascadia Mono", monospace; font-size: .9em; }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 .3em; background: var(--panel); }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.good { color: var(--good); } .bad { color: var(--bad); } .part { color: var(--part); }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
.hidden { display: none !important; }

/* ---------- top bar ---------- */
header.top { position: sticky; top: 0; z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); }
header.top .bar { display: flex; align-items: center; gap: .25rem; padding: 0 24px; min-height: 48px; flex-wrap: wrap; }
header.top .brand { display: inline-block; padding: .55rem 0; min-height: 24px; font-weight: 700; margin-right: .8rem; color: var(--ink); white-space: nowrap; }
header.top .brand .logo { vertical-align: -5px; margin-right: .45rem; }
header.top .brand small { font-weight: 400; color: var(--muted); margin-left: .4rem; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: .6rem; }
.save-state { font-size: .82rem; color: var(--muted); white-space: nowrap; }
.save-state.bad { color: var(--bad); font-weight: 600; }
#search { width: 15rem; max-width: 40vw; }
.search-wrap { position: relative; }
#searchResults { position: absolute; right: 0; top: 2.4rem; width: min(34rem, 92vw); max-height: 70vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 30px rgba(0,0,0,.18); z-index: 40; }
#searchResults a { display: block; padding: .45rem .7rem; color: var(--ink); border-bottom: 1px solid var(--soft); }
#searchResults a:hover, #searchResults a.sel { background: var(--accent-soft); text-decoration: none; }
#searchResults .kind { display: inline-block; width: 5.5rem; color: var(--muted); font-size: .8rem; }

main { padding: 24px 24px 60px; max-width: 2600px; margin: 0 auto; }
.banner { padding: .6rem .9rem; border-radius: var(--radius); margin-bottom: .8rem; background: var(--part-soft); color: var(--ink); border: 1px solid var(--line); }
.banner.bad { background: var(--bad-soft); }
.banner.info { background: var(--accent-soft); }

/* ---------- building blocks ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); margin-bottom: 14px; }
.card > h2:first-child, .card > h3:first-child { margin-top: 0; }
.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(330px, 100%), 1fr)); align-items: start; }
.cols { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
.cols.wide-left { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
@media (max-width: 1000px) { .cols, .cols.wide-left { grid-template-columns: 1fr; } }
.row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.row.spread { justify-content: space-between; }
.stack > * + * { margin-top: .5rem; }

button, .btn { font: inherit; padding: .42rem .85rem; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: .35rem; white-space: nowrap; transition: background .12s, transform .05s; }
button:hover, .btn:hover { background: var(--soft); text-decoration: none; }
button:active, .btn:active { transform: translateY(1px); }
button.primary, .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.primary:hover { filter: brightness(1.08); }

button.small, .btn.small { padding: .2rem .55rem; font-size: .85rem; }
button:disabled { opacity: .55; cursor: default; }
button.busy { position: relative; color: transparent !important; }
button.busy::after { content: ""; position: absolute; left: calc(50% - .5em); top: calc(50% - .5em); width: 1em; height: 1em; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
button.done { outline: 2px solid var(--good); }

@keyframes spin { to { transform: rotate(360deg); } }
button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

input, select, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: .38rem .55rem; max-width: 100%; }

label { display: block; font-size: .85rem; color: var(--muted); margin: .55rem 0 .15rem; }
.form-grid { display: grid; gap: 0 14px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.form-grid .full { grid-column: 1 / -1; }
.form-grid input, .form-grid select { width: 100%; }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: .6rem .8rem; border-bottom: 1px solid var(--soft); vertical-align: top; }

/* Sticky headers only where nothing scrolls sideways and the top bar stays one line; elsewhere they overlapped the first row. */
@media (min-width: 1200px) { table:not(.table-wrap table) th { position: sticky; top: 49px; z-index: 1; } }
table.attr td:nth-child(2) { min-width: 18rem; }
table.attr td:nth-child(3) { white-space: nowrap; }
table.attr td:nth-child(4) { min-width: 8rem; overflow-wrap: anywhere; }
table.attr td, table.attr th { padding-top: .7rem; padding-bottom: .7rem; }
td.nowrap + td { padding-left: 1rem; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--accent-soft); }
.table-wrap { overflow-x: auto; }

.chip { display: inline-block; padding: .05rem .45rem; border-radius: 999px; font-size: .8rem; background: var(--soft); color: var(--ink); margin: 1px 2px 1px 0; white-space: nowrap; border: 1px solid transparent; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.part { background: var(--part-soft); color: var(--part); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.outline { background: transparent; border-color: var(--line); }

.bar-meter { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; min-width: 60px; }
.bar-meter > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar-meter.good > span { background: var(--good); }
.big-number { font-size: 2rem; font-weight: 700; line-height: 1.1; }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 14px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
.kpi .label { color: var(--muted); font-size: .85rem; }

/* K/E/A slots */
.slots { display: inline-flex; gap: 3px; vertical-align: middle; }
.slots .lvl { display: inline-flex; gap: 2px; padding-right: 4px; }
.slots i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; background: var(--soft); border: 1px solid var(--line); }
.slots i.on { background: var(--good); border-color: var(--good); }
.slots b { font-size: .7rem; color: var(--muted); margin-right: 1px; }

/* Mapping grid on an evidence page */
.map-grid { display: grid; gap: 4px 12px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.map-row { display: flex; align-items: center; gap: 4px; padding: 2px 0; }
.map-row .sid { width: 2.3rem; font-weight: 600; }
.map-row .stext { flex: 1; font-size: .82rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.map-row button { padding: .1rem .45rem; font-size: .8rem; min-width: 1.9rem; justify-content: center; }
.group-title { grid-column: 1 / -1; font-weight: 600; margin-top: .5rem; border-bottom: 1px solid var(--line); padding-bottom: 2px; }

.issue { font-size: .85rem; padding: .15rem 0; }
.issue::before { display: inline-block; width: 1.2rem; font-weight: 700; }
.issue.error { color: var(--bad); } .issue.error::before { content: "✕"; }
.issue.warn { color: var(--part); } .issue.warn::before { content: "!"; }
.issue.info { color: var(--info); } .issue.info::before { content: "i"; }

.quote { border-left: 3px solid var(--line); padding: .2rem .6rem; color: var(--muted); margin: .3rem 0; font-size: .9rem; }
.fb { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 10px; background: var(--panel); }
.fb.done { opacity: .72; }
.fb .meta { font-size: .82rem; color: var(--muted); }
.fb .text { margin: .35rem 0; white-space: pre-wrap; }
.reply { margin: .3rem 0 0 1rem; font-size: .9rem; }

/* transcript tagging */
.transcript { max-height: calc(100vh - 210px); overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
.tline { display: grid; grid-template-columns: 3.6rem 8rem 1fr auto; gap: 8px; padding: 5px 10px; border-bottom: 1px solid var(--soft); align-items: start; }
.tline.sel { background: var(--accent-soft); }

.tline.t-done { border-left: 4px solid var(--good); }
.tline.t-todo { border-left: 4px solid var(--part); }
.tline.t-teaching { border-left: 4px solid var(--accent); }
.item-kind-done { border-left: 4px solid var(--good); }
.item-kind-todo { border-left: 4px solid var(--part); }
.item-kind-teaching { border-left: 4px solid var(--accent); }
.mitem { padding: 6px 8px; margin-bottom: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.mitem textarea { min-height: 2.6rem; }

/* anything with the hidden attribute stays hidden, even when a rule below sets display */
[hidden] { display: none !important; }

/* preview drawer */
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(46vw, 900px); min-width: 320px; background: var(--panel); border-left: 1px solid var(--line); box-shadow: -6px 0 24px rgba(0,0,0,.18); z-index: 50; display: flex; flex-direction: column; }
#drawer header { display: flex; gap: .5rem; align-items: flex-start; padding: 10px 12px; border-bottom: 1px solid var(--line); }
#drawer header > div { flex: 1; min-width: 0; overflow-wrap: anywhere; }

iframe.preview, img.preview { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
img.preview { object-fit: contain; height: auto; max-height: 100%; }
.preview-inline { position: sticky; top: 60px; height: calc(100vh - 80px); min-height: 400px; border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; background: var(--panel); }
.docx-view { padding: 18px 24px; max-width: 60rem; }
.docx-view h1 { font-size: 1.4rem; } .docx-view h2 { font-size: 1.15rem; } .docx-view h3 { font-size: 1rem; }
.docx-view mark { background: var(--mark); color: inherit; }
.doc-comment { margin: .2rem 0 .6rem 1rem; padding: .3rem .6rem; border-left: 3px solid var(--part); background: var(--part-soft); font-size: .9rem; }
pre.text-view { white-space: pre-wrap; padding: 16px; margin: 0; font-size: .9rem; }

/* dialogs and toasts */
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); padding: 18px 20px; max-width: min(640px, 94vw); box-shadow: 0 12px 40px rgba(0,0,0,.25); }

.toast { background: var(--ink); color: var(--bg); padding: .55rem 1rem; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.25); transition: opacity .4s; max-width: 90vw; }
.toast.error { background: var(--bad); color: #fff; }
.toast.warn { background: var(--part); color: #fff; }
.toast.gone { opacity: 0; }

/* welcome */
.welcome { max-width: 920px; margin: 30px auto; }
.welcome .choices { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); margin: 18px 0; }
.welcome .choice { text-align: left; display: block; padding: 16px; white-space: normal; height: 100%; }
.welcome .choice b { display: block; font-size: 1.05rem; margin-bottom: .3rem; }

.sub-tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.sub-tabs a { padding: .35rem .8rem; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); background: var(--panel); }
.sub-tabs a.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.sub-tabs a:hover { text-decoration: none; }
.list-plain { list-style: none; padding: 0; margin: 0; }
.list-plain li { padding: .3rem 0; border-bottom: 1px solid var(--soft); }
.empty { padding: 1.4rem; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }

@media print {
  header.top, #drawer, #toasts, button, .no-print, #tabbar, #moreSheet { display: none !important; }
  body.has-tabbar { padding-bottom: 0; }

/* ---- polish: progressive tabs, start screen, get-started panel, skip link ---- */

/* ---------- bottom tab bar (21-tabbar.js): fixed at the bottom on every screen size, "More" opens a sheet above it ---------- */
:root { --tabbar-h: 60px; --tabbar-safe: env(safe-area-inset-bottom, 0px); --tabbar-space: calc(var(--tabbar-h) + var(--tabbar-safe)); }
body.has-tabbar { padding-bottom: var(--tabbar-space); }
html:has(body.has-tabbar) { scroll-padding-bottom: calc(var(--tabbar-space) + 8px); }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 45; background: var(--panel); border-top: 1px solid var(--line);
  box-shadow: 0 -2px 10px rgba(20, 30, 50, .08); padding-bottom: var(--tabbar-safe); }
.tabbar-in { display: flex; justify-content: center; max-width: 760px; margin: 0 auto; height: calc(var(--tabbar-h) - 1px); padding: 0 4px; }
.tabbar [role=tab] { position: relative; flex: 1 1 0; min-width: 0; max-width: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  padding: 6px 4px 5px; margin: 0; border: 0; border-top: 3px solid transparent; border-radius: 0; background: none; color: var(--muted); font: inherit; font-size: .8rem; line-height: 1.15;
  cursor: pointer; text-decoration: none; min-height: 44px; box-shadow: none; }
.tabbar [role=tab]:hover { color: var(--ink); background: var(--soft); text-decoration: none; }
.tabbar [role=tab].active { color: var(--accent); border-top-color: var(--accent); font-weight: 600; }
.tabbar [role=tab]:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; border-radius: 8px; }
.tabbar #moreBtn[aria-expanded=true] { color: var(--ink); background: var(--soft); }
.tabbar .tab-label { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tab-icon { flex: none; display: block; }
.tabbar .count, .more-sheet .count { display: inline-block; min-width: 1.4em; padding: 0 .35em; border-radius: 999px; background: var(--bad-soft); color: var(--bad); font-size: .72rem; font-weight: 600; text-align: center; line-height: 1.4; }
.tabbar .count { position: absolute; top: 3px; left: calc(50% + 6px); }

  max-height: calc(100vh - var(--tabbar-space) - 24px); max-height: calc(100dvh - var(--tabbar-space) - 24px); overflow: auto;
  background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 -4px 28px rgba(0, 0, 0, .22); padding: 10px 10px 8px; }

.more-sheet a { display: flex; align-items: center; gap: .6rem; min-height: 44px; padding: .5rem .7rem; border-radius: 8px; color: var(--ink); text-decoration: none; }
.more-sheet a:hover { background: var(--soft); text-decoration: none; }
.more-sheet a.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.more-sheet a .tab-icon { color: var(--muted); }

@media (prefers-reduced-motion: no-preference) { .more-sheet:not([hidden]) { animation: sheet-up .14s ease-out; } }
@keyframes sheet-up { from { opacity: 0; transform: translate(-50%, 10px); } to { opacity: 1; transform: translate(-50%, 0); } }
/* everything that sits at the bottom of the screen moves up above the bar */
body.has-tabbar #toasts { bottom: calc(var(--tabbar-space) + 12px); }
body.has-tabbar #drawer { bottom: var(--tabbar-space); }

/* ---------- guided tour (src/15-tour.js) ---------- */

function toast(message, kind = 'ok') {
  let box = $('#toasts');
  if (!box) { box = document.createElement('div'); box.id = 'toasts'; box.setAttribute('aria-live', 'polite'); document.body.append(box); }
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.textContent = message;
  box.append(t);
  setTimeout(() => t.classList.add('gone'), kind === 'error' ? 8000 : 3500);
  setTimeout(() => t.remove(), kind === 'error' ? 8500 : 4000);
}

// Run an action from a button: busy state while it runs, then a tick or a cross, and a message.
async function act(btn, fn, okMessage) {
  if (btn) { btn.classList.add('busy'); btn.disabled = true; }
  try {
    const result = await fn();
    if (btn) flash(btn, 'done');
    if (okMessage) toast(typeof okMessage === 'function' ? okMessage(result) : okMessage);
    return result;
  } catch (err) {
    console.error(err);
    if (btn) flash(btn, 'failed');
    toast('That did not work: ' + (err.message || err), 'error');
  } finally {
    if (btn) { btn.classList.remove('busy'); btn.disabled = false; }
  }
}

function flash(el, cls) {
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), 1600);
}

async function sha1(text) {
  const buf = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].slice(0, 8).map((b) => b.toString(16).padStart(2, '0')).join('');
}

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// "CA-00 to CA-18, CO-14" -> ['CA-00', ..., 'CA-18', 'CO-14']
const CODE_RE = /\b([A-Z]{2,3})-(\d{2,3})\b/g;
function expandCodes(text) {
  const out = [];
  const re = /\b([A-Z]{2,3})-(\d{2,3})\b(?:\s*(?:to|–|—|-)\s*(?:([A-Z]{2,3})-)?(\d{2,3})\b)?/g;
  let m;
  while ((m = re.exec(text))) {
    const [, prefix, from, prefix2, to] = m;
    if (to !== undefined && (!prefix2 || prefix2 === prefix) && +to >= +from && +to - +from < 200) {
      for (let n = +from; n <= +to; n++) out.push(`${prefix}-${String(n).padStart(from.length, '0')}`);
    } else {
      out.push(`${prefix}-${from}`);
    }
  }
  return [...new Set(out)];
}

// Natural sort: "CO-2" before "CO-10", "2b" before "10a".
const collator = new Intl.Collator('en', { numeric: true, sensitivity: 'base' });
const natural = (a, b) => collator.compare(a, b);

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

// Zip reading and writing with no library: Word and Excel files are zip packages of XML.
// Reading inflates with the browser's own DecompressionStream; writing stores files uncompressed,
// which Word and Excel open normally.

async function readZip(buffer) {
  const bytes = new Uint8Array(buffer);
  const view = new DataView(buffer);
  let eocd = -1;
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('not a zip file (is it an old .doc rather than .docx?)');
  const count = view.getUint16(eocd + 10, true);
  let p = view.getUint32(eocd + 16, true);
  const entries = {};
  const dec = new TextDecoder();
  for (let n = 0; n < count; n++) {
    if (view.getUint32(p, true) !== 0x02014b50) break;
    const method = view.getUint16(p + 10, true);
    const size = view.getUint32(p + 20, true);
    const nameLen = view.getUint16(p + 28, true);
    const extraLen = view.getUint16(p + 30, true);
    const commentLen = view.getUint16(p + 32, true);
    const local = view.getUint32(p + 42, true);
    const name = dec.decode(bytes.subarray(p + 46, p + 46 + nameLen));
    entries[name] = { method, size, local };
    p += 46 + nameLen + extraLen + commentLen;
  }
  const data = async (name) => {
    const e = entries[name];
    if (!e) return null;
    const start = e.local + 30 + view.getUint16(e.local + 26, true) + view.getUint16(e.local + 28, true);
    const raw = bytes.subarray(start, start + e.size);
    if (e.method === 0) return raw;
    if (e.method !== 8) throw new Error('unsupported zip compression in ' + name);
    const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  };
  return {
    names: Object.keys(entries),
    has: (name) => name in entries,
    bytes: data,
    text: async (name) => { const b = await data(name); return b ? dec.decode(b) : null; },
  };
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

// files: {path: string | Uint8Array} -> Blob
function writeZip(files, type = 'application/zip') {
  const enc = new TextEncoder();
  const parts = [];
  const central = [];
  let offset = 0;
  const d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const [path, content] of Object.entries(files)) {
    const name = enc.encode(path);
    const body = typeof content === 'string' ? enc.encode(content) : content;
    const crc = crc32(body);
    const head = new DataView(new ArrayBuffer(30));
    head.setUint32(0, 0x04034b50, true);
    head.setUint16(4, 20, true);
    head.setUint16(6, 0x0800, true); // UTF-8 names
    head.setUint16(8, 0, true);
    head.setUint16(10, time, true);
    head.setUint16(12, date, true);
    head.setUint32(14, crc, true);
    head.setUint32(18, body.length, true);
    head.setUint32(22, body.length, true);
    head.setUint16(26, name.length, true);
    parts.push(head, name, body);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true);
    cd.setUint16(6, 20, true);
    cd.setUint16(8, 0x0800, true);
    cd.setUint16(12, time, true);
    cd.setUint16(14, date, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, body.length, true);
    cd.setUint32(24, body.length, true);
    cd.setUint16(28, name.length, true);
    cd.setUint32(42, offset, true);
    central.push(cd, name);
    offset += 30 + name.length + body.length;
  }
  const cdSize = central.reduce((n, x) => n + (x.byteLength ?? x.length), 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, Object.keys(files).length, true);
  end.setUint16(10, Object.keys(files).length, true);
  end.setUint32(12, cdSize, true);
  end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end], { type });
}

// Word and Excel, with no library: read .docx (text, headings, comments, tracked changes) and write
// simple .docx and .xlsx files.

const xmlDoc = (text) => new DOMParser().parseFromString(text, 'application/xml');
const xmlEsc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
  .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '');
const attr = (el, name) => el.getAttribute('w:' + name);
const kids = (el, local) => [...el.children].filter((c) => c.localName === local);

// ---------- reading Word ----------
// -> { paragraphs: [{style, text, ins: [{author, date, text}], del: [...]}],
//      comments: [{id, author, date, text, anchor, para, parent, done}] }
async function parseDocx(buffer) {
  const zip = await readZip(buffer);
  const docXml = await zip.text('word/document.xml');
  if (!docXml) throw new Error('no word/document.xml: not a Word file');
  const styles = {};
  const stylesXml = await zip.text('word/styles.xml');
  if (stylesXml) {
    for (const s of xmlDoc(stylesXml).getElementsByTagName('w:style')) {
      const name = s.getElementsByTagName('w:name')[0];
      styles[attr(s, 'styleId')] = name ? attr(name, 'val') : attr(s, 'styleId');
    }
  }
  const paragraphs = [];
  const anchors = {};   // comment id -> {text, para}
  const open = new Set();
  let para = null;
  const change = [];    // stack of {kind, author, date}

  const add = (text, deleted) => {
    if (!para) return;
    const c = change[change.length - 1];
    if (!deleted) para.text += text;
    if (c) {
      const list = deleted || c.kind === 'del' ? para.del : para.ins;
      const last = list[list.length - 1];
      if (last && last.author === c.author) last.text += text; else list.push({ author: c.author, date: c.date, text });
    }
    if (!deleted) for (const id of open) anchors[id].text += text;
  };

  const walk = (node) => {
    for (const el of node.children) {
      switch (el.localName) {
        case 'p': {
          if (para) { walk(el); break; } // a paragraph inside a paragraph (text box): fold into the outer one
          const pStyle = el.getElementsByTagName('w:pStyle')[0];
          para = { style: pStyle ? (styles[attr(pStyle, 'val')] || attr(pStyle, 'val')) : '', text: '', ins: [], del: [] };
          walk(el);
          para.text = para.text.replace(/[ \t]+/g, ' ').trim();
          paragraphs.push(para);
          para = null;
          break;
        }
        case 'pPr': case 'rPr': case 'sectPr': case 'instrText': case 'fldChar': case 'drawing': case 'pict': case 'object':
          break;
        case 't': add(el.textContent); break;
        case 'delText': add(el.textContent, true); break;
        case 'tab': add('\t'); break;
        case 'br': case 'cr': add(' '); break;
        case 'noBreakHyphen': add('-'); break;
        case 'ins': case 'moveTo': case 'del': case 'moveFrom':
          change.push({ kind: el.localName === 'ins' || el.localName === 'moveTo' ? 'ins' : 'del', author: attr(el, 'author') || '', date: attr(el, 'date') || '' });
          walk(el);
          change.pop();
          break;
        case 'commentRangeStart': {
          const id = attr(el, 'id');
          anchors[id] = { text: '', para: paragraphs.length };
          open.add(id);
          break;
        }
        case 'commentRangeEnd': open.delete(attr(el, 'id')); break;
        case 'commentReference': {
          const id = attr(el, 'id');
          if (!anchors[id]) anchors[id] = { text: '', para: paragraphs.length };
          break;
        }
        case 'tc': walk(el); add('\t'); break;
        default: walk(el);
      }
    }
  };
  const body = xmlDoc(docXml).getElementsByTagName('w:body')[0];
  walk(body);

  const comments = [];
  const commentsXml = await zip.text('word/comments.xml');
  if (commentsXml) {
    const extended = {};
    const extXml = await zip.text('word/commentsExtended.xml');
    if (extXml) {
      for (const e of xmlDoc(extXml).getElementsByTagName('w15:commentEx')) {
        extended[e.getAttribute('w15:paraId')] = { parent: e.getAttribute('w15:paraIdParent'), done: e.getAttribute('w15:done') === '1' };
      }
    }
    const byPara = {};
    for (const c of xmlDoc(commentsXml).getElementsByTagName('w:comment')) {
      const ps = [...c.getElementsByTagName('w:p')];
      const text = ps.map((p) => [...p.getElementsByTagName('w:t')].map((t) => t.textContent).join('')).join('\n').trim();
      const paraId = ps.length ? ps[ps.length - 1].getAttribute('w14:paraId') : null;
      const id = attr(c, 'id');
      const item = {
        id, author: attr(c, 'author') || '', date: attr(c, 'date') || '', text,
        anchor: anchors[id] ? anchors[id].text.replace(/\s+/g, ' ').trim() : '',
        para: anchors[id] ? Math.min(anchors[id].para, paragraphs.length - 1) : null,
        paraId, parent: null, done: false,
      };
      if (paraId && extended[paraId]) item.done = extended[paraId].done;
      if (paraId) byPara[paraId] = item;
      comments.push(item);
    }
    for (const c of comments) {
      const parentPara = c.paraId && extended[c.paraId] && extended[c.paraId].parent;
      if (parentPara && byPara[parentPara]) {
        c.parent = byPara[parentPara].id;
        if (c.para === null) c.para = byPara[parentPara].para;
      }
    }
  }
  return { paragraphs, comments };
}

// Text of a Word file as simple HTML, for the preview panel.
async function docxPreviewHtml(buffer) {
  const { paragraphs, comments } = await parseDocx(buffer);
  const notes = {};
  for (const c of comments) if (c.para !== null && !c.parent) (notes[c.para] = notes[c.para] || []).push(c);
  return paragraphs.map((p, i) => {
    const s = p.style.toLowerCase();
    const tag = s === 'title' ? 'h1' : s.startsWith('heading 1') ? 'h2' : s.startsWith('heading') ? 'h3' : 'p';
    const text = esc(p.text).replace(/\{\s*([A-Z]{2,3}-\d{2,3})\s*\}/g, '<mark>{$1}</mark>');
    const cmt = (notes[i] || []).map((c) => `<div class="doc-comment"><b>${esc(c.author)}:</b> ${esc(c.text)}</div>`).join('');
    return p.text || cmt ? `<${tag}>${text}</${tag}>${cmt}` : '';
  }).join('');
}

// ---------- writing Word ----------
// blocks: [{type: 'title'|'h1'|'h2'|'p'|'small'|'table', text, rows: [[cell]], widths: [twips]}]
function makeDocx(blocks, opts = {}) {
  const run = (text, props = '') => String(text ?? '').split('\n').map((line, i) =>
    `${i ? '<w:r><w:br/></w:r>' : ''}<w:r>${props ? `<w:rPr>${props}</w:rPr>` : ''}<w:t xml:space="preserve">${xmlEsc(line)}</w:t></w:r>`).join('');
  const para = (text, style, props) => `<w:p>${style ? `<w:pPr><w:pStyle w:val="${style}"/></w:pPr>` : ''}${run(text, props)}</w:p>`;
  const body = blocks.map((b) => {
    if (b.type === 'title') return para(b.text, 'Title');
    if (b.type === 'h1') return para(b.text, 'Heading1');

  const W = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"';

// ---------- writing Excel ----------
// sheets: [{name, rows: [[value | {v, s}]], widths: [chars], freeze: {rows, cols}, filter: true}]
// Styles s: 'head', 'bold', 'good', 'part', 'none', 'wrap'.
const XLSX_STYLES = { plain: 0, head: 1, bold: 2, good: 3, part: 4, none: 5, wrap: 6 };
function makeXlsx(sheets) {
  const colName = (n) => { let s = ''; for (n++; n; n = Math.floor((n - 1) / 26)) s = String.fromCharCode(65 + ((n - 1) % 26)) + s; return s; };
  const safeName = (name, i) => (String(name).replace(/[\[\]:*?\/\\]/g, ' ').slice(0, 31) || 'Sheet' + (i + 1));
  const files = {};
  sheets.forEach((sheet, i) => {
    const rows = sheet.rows.map((row, r) => `<row r="${r + 1}">${row.map((cell, c) => {
      const v = cell !== null && typeof cell === 'object' ? cell.v : cell;
      const s = cell !== null && typeof cell === 'object' && cell.s ? ` s="${XLSX_STYLES[cell.s] || 0}"` : (r === 0 && sheet.header !== false ? ' s="1"' : '');
      const ref = colName(c) + (r + 1);
      if (v === null || v === undefined || v === '') return s ? `<c r="${ref}"${s}/>` : '';
      if (typeof v === 'number') return `<c r="${ref}"${s}><v>${v}</v></c>`;
      return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
    }).join('')}</row>`).join('');
    const cols = sheet.widths ? `<cols>${sheet.widths.map((w, c) => `<col min="${c + 1}" max="${c + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : '';
    const f = sheet.freeze;
    const pane = f ? `<sheetViews><sheetView workbookViewId="0"><pane${f.cols ? ` xSplit="${f.cols}"` : ''}${f.rows ? ` ySplit="${f.rows}"` : ''} topLeftCell="${colName(f.cols || 0)}${(f.rows || 0) + 1}" activePane="bottomRight" state="frozen"/></sheetView></sheetViews>` : '';
    const lastCol = colName(Math.max(1, ...sheet.rows.map((r) => r.length)) - 1);
    const filter = sheet.filter && sheet.rows.length > 1 ? `<autoFilter ref="A1:${lastCol}${sheet.rows.length}"/>` : '';
    files[`xl/worksheets/sheet${i + 1}.xml`] = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${pane}${cols}<sheetData>${rows}</sheetData>${filter}</worksheet>`;
  });
  const names = sheets.map((s, i) => safeName(s.name, i));
  files['[Content_Types].xml'] = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${
    sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`;
  files['_rels/.rels'] = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  files['xl/workbook.xml'] = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${
    names.map((n, i) => `<sheet name="${xmlEsc(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`;
  files['xl/_rels/workbook.xml.rels'] = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${
    sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')
  }<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const fill = (rgb) => `<fill><patternFill patternType="solid"><fgColor rgb="FF${rgb}"/><bgColor indexed="64"/></patternFill></fill>`;
  files['xl/styles.xml'] = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`
    + `<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>`
    + `<fills count="6"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>${fill('DCE6F2')}${fill('C6EFCE')}${fill('FFEB9C')}${fill('FFC7CE')}</fills>`
    + `<borders count="2"><border/><border><left style="thin"><color rgb="FFBFBFBF"/></left><right style="thin"><color rgb="FFBFBFBF"/></right><top style="thin"><color rgb="FFBFBFBF"/></top><bottom style="thin"><color rgb="FFBFBFBF"/></bottom></border></borders>`
    + `<cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="7">`
    + `<xf/>`
    + `<xf fontId="1" fillId="2" borderId="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf>`
    + `<xf fontId="1" applyFont="1"/>`
    + `<xf fillId="3" borderId="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center"/></xf>`
    + `<xf fillId="4" borderId="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center"/></xf>`
    + `<xf fillId="5" borderId="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center"/></xf>`
    + `<xf applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf>`
    + `</cellXfs></styleSheet>`;
  return writeZip(files, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

  '5 - Tools - MM', '6 - Deliverable Drawings - DD', '7 - Certificates - CE', '8 - Presentations - PR',
];
const categoryPrefix = (folder) => { const m = /(?:^|\/)[^/]*? - ([A-Z]{2,3})$/.exec(folder || ''); return m ? m[1] : ''; };
const IGNORE = /^(~\$|\.|desktop\.ini$|thumbs\.db$)/i;

const S = {
  own: null,          // FileSystemDirectoryHandle of my folder
  other: null,        // the other person's folder (mentor's for an apprentice, apprentice's for a mentor)

  otherData: null,    // their data, read only

// ---------- remembering folders (IndexedDB) ----------
// If the browser's database never answers (seen in some locked-down set-ups), carry on without it:
// the tool then just asks for the folder each time.
function idb() {
  return new Promise((resolve, reject) => {
    setTimeout(() => reject(new Error('browser storage did not answer')), 3000);
    const req = indexedDB.open('ice-tool', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function remember(key, value) {
  if (S.demo) return;
  let db;
  try { db = await idb(); } catch (_) { return; }
  await new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readwrite');
    if (value === null) tx.objectStore('handles').delete(key); else tx.objectStore('handles').put(value, key);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}
async function recall(key) {
  let db;
  try { db = await idb(); } catch (_) { return null; }
  return new Promise((resolve) => {
    const req = db.transaction('handles').objectStore('handles').get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => resolve(null);
  });
}

const supported = () => 'showDirectoryPicker' in window;

async function permission(handle, mode, ask) {
  if (!handle) return false;
  const opts = { mode };
  if ((await handle.queryPermission(opts)) === 'granted') return true;
  return ask ? (await handle.requestPermission(opts)) === 'granted' : false;
}

async function pickFolder(id, mode) {
  if (demoBlocked()) throw new Error('Not available with sample data');
  return window.showDirectoryPicker({ id, mode, startIn: 'documents' });
}

// ---------- reading and writing files ----------
async function subDir(dir, path, create = false) {
  for (const part of path.split('/').filter(Boolean)) dir = await dir.getDirectoryHandle(part, { create });
  return dir;
}
async function fileHandle(dir, path, create = false) {
  const parts = path.split('/');
  const name = parts.pop();
  return (await subDir(dir, parts.join('/'), create)).getFileHandle(name, { create });
}
async function exists(dir, path) {
  try { await fileHandle(dir, path); return true; } catch (_) { return false; }
}
async function readJson(dir, path) {
  const file = await (await fileHandle(dir, path)).getFile();
  return { json: JSON.parse(await file.text()), stamp: file.lastModified };
}
async function writeFile(dir, path, content) {
  if (S.demo) throw new Error('Not available with sample data');
  const h = await fileHandle(dir, path, true);
  const w = await h.createWritable();
  await w.write(content);
  await w.close();
  return (await h.getFile()).lastModified;
}
// Every file under a folder, depth first: [{path, name, size, mtime, handle}]
async function listFiles(dir, prefix = '') {
  const out = [];
  for await (const [name, h] of dir.entries()) {
    if (IGNORE.test(name)) continue;
    const path = prefix ? `${prefix}/${name}` : name;
    if (h.kind === 'directory') out.push(...await listFiles(h, path));
    else {
      try {
        const f = await h.getFile();
        out.push({ path, name, size: f.size, mtime: f.lastModified, handle: h });
      } catch (_) { out.push({ path, name, size: 0, mtime: 0, handle: h }); }
    }
  }
  return out;
}
async function listDir(dir, path) {
  try { return await listFiles(await subDir(dir, path)); } catch (_) { return []; }
}

// A file from a path such as "Evidence/1 - Knowledge/CO-14 Site visit.pdf" in my folder or, failing
// that, in the other person's folder (so a mentor can open the apprentice's evidence).
async function getFile(path, where) {
  const roots = where === 'own' ? [S.own] : where === 'other' ? [S.other] : [S.own, S.other];
  for (const root of roots.filter(Boolean)) {
    try { return await (await fileHandle(root, path)).getFile(); } catch (_) { /* try the next */ }
  }
  throw new Error('file not found: ' + path);
}

// ---------- my data ----------
const role = () => S.data && S.data.role;
const isMentor = () => role() === 'mentor';
const myDataPath = () => `${DATA_DIR}/${isMentor() ? FILES.mentor : FILES.apprentice}`;
// The apprentice's portfolio data, whoever is looking at it.

// The mentor's data, whoever is looking at it.

function newPortfolio(name, mode) {

// Fill in anything an older file lacks, so new features never meet undefined.
function upgrade(d) {
  if (d.role === 'mentor') {
    d.subs = d.subs || {}; d.evidence = d.evidence || {}; d.actions = d.actions || [];
    return d;
  }
  d.mode = d.mode || 'ice';
  d.framework = d.framework || null;   // null = the built-in ICE IEng framework
  d.profile = { jobRole: '', responsibilities: '', sector: '', ...(d.profile || {}) };
  d.settings = { goal: 3, cpdTarget: 30, cpdYearStart: 1, themes: [], ...(d.settings || {}) };
  d.evidence = d.evidence || {}; d.comments = d.comments || {}; d.meetings = d.meetings || [];
  d.cpd = d.cpd || { objectives: [], activities: [], reviews: [] };
  d.cpd.reviews = d.cpd.reviews || [];
  d.ksbRatings = d.ksbRatings || {};
  return d;
}

async function loadOwn() {
  for (const r of ['apprentice', 'mentor']) {
    if (await exists(S.own, `${DATA_DIR}/${FILES[r]}`)) {
      const { json, stamp } = await readJson(S.own, `${DATA_DIR}/${FILES[r]}`);
      S.data = upgrade(json);
      S.loadedStamp = stamp;
      return true;
    }
  }
  return false;
}

async function loadOther() {
  S.otherData = null;
  if (!S.other) return;
  if (!(await permission(S.other, 'read', false))) return;
  const name = isMentor() ? FILES.apprentice : FILES.mentor;
  try {
    S.otherData = upgrade((await readJson(S.other, `${DATA_DIR}/${name}`)).json);
  } catch (err) {
    S.warnings.push(`Could not read ${name} in the linked folder "${S.other.name}": ${err.message}`);
  }
}

async function scanEvidence() {
  if (S.demo) return;   // the sample files are made up and live only in S.files
  const root = portfolioRoot();
  S.files = root ? (await listDir(root, FOLDERS.evidence)).map((f) => ({ ...f, path: `${FOLDERS.evidence}/${f.path}` })) : [];
  S.files.sort((a, b) => natural(a.path, b.path));
}

// OneDrive makes "portfolio-LAPTOP.json" when two devices change the file while offline.
async function conflictCopies() {
  const out = [];
  try {
    const dir = await subDir(S.own, DATA_DIR);
    for await (const [name, h] of dir.entries()) {
      if (h.kind === 'file' && /\.json$/i.test(name) && !Object.values(FILES).includes(name)) out.push(name);
    }
  } catch (_) { /* no data folder yet */ }
  return out;
}

const saveSoon = debounce(() => save(), 700);
// Undo: one snapshot per burst of changes (changes less than 1.5 seconds apart count as one step), up to 25 steps.
const UNDO = { stack: [], redo: [], base: null, pending: false, timer: null, bytes: 0 };
function undoReset() { UNDO.stack = []; UNDO.redo = []; UNDO.pending = false; UNDO.base = S.data ? JSON.stringify(S.data) : null; refreshUndo(); }
function refreshUndo() {
  const u = $('#undoBtn'), r = $('#redoBtn');
  if (u) u.hidden = !UNDO.stack.length;
  if (r) r.hidden = !UNDO.redo.length;
}
function noteChange() {
  if (!UNDO.base) return;
  if (!UNDO.pending) {
    UNDO.stack.push(UNDO.base);
    UNDO.redo = [];
    UNDO.pending = true;
    UNDO.bytes += UNDO.base.length;
    while (UNDO.stack.length > 25 || (UNDO.bytes > 40e6 && UNDO.stack.length > 1)) UNDO.bytes -= UNDO.stack.shift().length;
  }
  clearTimeout(UNDO.timer);
  UNDO.timer = setTimeout(() => { UNDO.base = JSON.stringify(S.data); UNDO.pending = false; refreshUndo(); }, 1500);
  refreshUndo();
}
async function undoStep(redo = false) {
  const from = redo ? UNDO.redo : UNDO.stack, to = redo ? UNDO.stack : UNDO.redo;
  if (!from.length || !S.data) return;
  clearTimeout(UNDO.timer);
  UNDO.pending = false;
  const now = JSON.stringify(S.data);
  const snap = from.pop();
  to.push(now);
  S.data = upgrade(JSON.parse(snap));
  UNDO.base = snap;
  applyFramework(P() && P().framework);
  S.dirty = true;
  setSaveState('Saving…');
  saveSoon();
  await render();
  toast(redo ? 'Redone' : 'Undone');
}

function changed() {
  noteChange();
  S.dirty = true;
  setSaveState('Saving…');
  saveSoon();
}

async function save(force = false) {
  if (S.demo) { S.dirty = false; setSaveState('Not saved (sample)'); return; }
  if (!S.data || S.saving) { if (S.saving) saveSoon(); return; }
  S.saving = true;
  try {
    const path = myDataPath();
    if (!force && S.loadedStamp) {
      let current = 0;
      try { current = (await (await fileHandle(S.own, path)).getFile()).lastModified; } catch (_) { /* new file */ }
      if (current && current > S.loadedStamp + 1000) {
        setSaveState('Not saved', 'bad');
        showConflict();
        return;
      }
    }
    S.data.saved = nowIso();
    const text = JSON.stringify(S.data, null, 1);

// One copy a day in ice-data/backups, the newest 30 kept.
async function dailyBackup(text) {
  if (S.demo) return;
  const base = isMentor() ? 'mentor' : 'portfolio';
  const path = `${DATA_DIR}/backups/${base}-${today()}.json`;
  if (await exists(S.own, path)) return;
  await writeFile(S.own, path, text);
  const dir = await subDir(S.own, `${DATA_DIR}/backups`);
  const names = [];
  for await (const [name] of dir.entries()) if (name.startsWith(base + '-')) names.push(name);
  names.sort();
  for (const old of names.slice(0, Math.max(0, names.length - 30))) await dir.removeEntry(old);
}

  const title = Object.fromEntries(fw.groups.map((g) => [String(g.id), g.title]));
  SUBS = fw.attributes.map((a) => ({ id: a.id, group: String(a.group), group_title: title[String(a.group)] || String(a.group), text: a.text, min: a.min || '' }));
  SUB = Object.fromEntries(SUBS.map((a) => [a.id, a]));
  SUB_LC = Object.fromEntries(SUBS.map((a) => [a.id.toLowerCase(), a.id]));
  const used = new Set(SUBS.map((a) => a.group));
  GROUPS = fw.groups.filter((g) => used.has(String(g.id))).map((g) => ({ group: String(g.id), title: g.title }));

  const ids = SUBS.map((a) => a.id).sort((x, y) => y.length - x.length).map(escRe);
  HEADING_RE = ids.length ? new RegExp(`^\\s*(${ids.join('|')})\\s*[–—\\-:.)]\\s*(.*)$`, 'i') : /$^/;
  LABEL = { attr: (fw.labels && fw.labels.attr) || 'Attributes', ksb: (fw.labels && fw.labels.ksb) || 'KSBs', ...itemLabels(fw.labels) };
  Object.assign(FOLDERS, DEFAULT_FOLDERS, fw.folders || {}, (FOLDER_MAP && FOLDER_MAP.folders) || {});
  const ev = (FOLDER_MAP && FOLDER_MAP.evidence) || {};
  EVIDENCE_CATEGORIES = (fw.evidenceFolders || []).map((c) => ev[c] || c);
  S.prr = S.demo ? demoPrr() : {};   // parsed reports depend on the requirement ids: read them again

// ---------- using folders the person already has ----------
// Someone may have made their folders before using the tool, with slightly different names
// ("4 - Feedback Compliance and Status", "1 - Modelling Snaps - MO"). Rather than make a second set, the tool
// uses theirs: FOLDER_MAP (saved in the portfolio data as folderMap) maps a folder setting to the existing name.
// Words of a folder name compared loosely: no leading number, no punctuation, no plural s, no double letters.
const looseWords = (s) => String(s).toLowerCase().replace(/^\s*\d+\s*[-–—._)]*\s*/, '').split(/[^a-z0-9]+/).filter(Boolean)
  .map((w) => (w.length > 3 ? w.replace(/s$/, '') : w).replace(/(.)\1+/g, '$1'));
const loose = (s) => looseWords(s).join(' ');
const withoutCode = (s) => String(s).replace(/\s*-\s*[A-Z]{2,3}\s*$/, '');
const FOLDER_WORDS = { prr: ['report', 'prr'], matrix: ['matrix'], evidence: ['evidence'], feedback: ['feedback', 'compliance'], meetings: ['meeting', 'minutes'], cpd: ['cpd'], exports: ['export'] };

// Which existing name (of `names`) is the one meant by `want`, or '' if none or more than one fits.
// `byNumber`: last resort for a kind of evidence, the same leading number when both names end in a code.
function matchFolder(want, names, key, byNumber = false) {
  const one = (xs) => (xs.length === 1 ? xs[0] : '');
  const same = one(names.filter((n) => loose(n) === loose(want)));
  if (same) return same;
  if (key) {   // a top folder: by its keywords
    const kw = FOLDER_WORDS[key].map(loose);
    return one(names.filter((n) => {
      const w = looseWords(n);
      if (key === 'evidence' && w.includes('matrix')) return false;
      if (key === 'prr' && (w.includes('feedback') || w.includes('deliverable'))) return false;
      return w.some((x) => kw.some((k) => x.startsWith(k)));
    }));
  }
  const code = categoryPrefix(want);   // a kind of evidence: by its code, then by its name
  if (code) { const byCode = one(names.filter((n) => categoryPrefix(n) === code)); if (byCode) return byCode; }
  const name = loose(withoutCode(want));
  const byName = one(names.filter((n) => loose(withoutCode(n)) === name));
  if (byName) return byName;
  const first = looseWords(withoutCode(want))[0] || '';
  const byFirst = first.length >= 4 ? one(names.filter((n) => (looseWords(withoutCode(n))[0] || '') === first)) : '';
  if (byFirst || !byNumber || !code) return byFirst;
  const num = (s) => (/^\s*(\d+)\s*[-–—._)]/.exec(s) || [])[1];
  return num(want) ? one(names.filter((n) => num(n) === num(want) && categoryPrefix(n))) : '';
}

async function folderNames(dir) {
  const out = [];
  try { for await (const [name, h] of dir.entries()) if (h.kind === 'directory' && !IGNORE.test(name) && name !== DATA_DIR) out.push(name); } catch (_) { /* not there */ }
  return out;
}
async function hasFiles(dir) {
  for await (const [name, h] of dir.entries()) {
    if (IGNORE.test(name)) continue;
    if (h.kind === 'file' || await hasFiles(h)) return true;
  }
  return false;
}
async function emptyFolder(dir, path) {
  try { return !(await hasFiles(await subDir(dir, path))); } catch (_) { return true; }
}

// Point each folder setting at a folder the person already has, when the configured one is missing (or is an
// empty copy the tool made next to theirs). Returns lines like "Feedback → 4 - Feedback Compliance and Status".
async function adoptFolders(dir, mode) {
  if (S.demo || !dir || !canEdit() || !P()) return [];
  const map = { folders: { ...((FOLDER_MAP && FOLDER_MAP.folders) || {}) }, evidence: { ...((FOLDER_MAP && FOLDER_MAP.evidence) || {}) } };
  const changed = [];
  const pick = async (base, want, names, taken, key, byNumber) => {
    if (names.includes(want) && !(await emptyFolder(dir, base + want))) return '';
    const n = matchFolder(want, names.filter((x) => x !== want && !taken.has(x)), key, byNumber);
    if (!n || (names.includes(want) && await emptyFolder(dir, base + n))) return '';
    return n;
  };
  const top = await folderNames(dir);
  const keys = mode === 'cpd' ? ['cpd', 'exports'] : Object.keys(DEFAULT_FOLDERS);
  const takenTop = new Set(keys.map((k) => FOLDERS[k]).filter((f) => top.includes(f)));
  for (const k of keys) {
    const n = await pick('', FOLDERS[k], top, takenTop, k);
    if (n) { map.folders[k] = n; takenTop.add(n); changed.push(`${FOLDER_LABELS[k]} → ${n}`); FOLDERS[k] = n; }
  }
  if (mode !== 'cpd') {
    let sub = [];
    try { sub = await folderNames(await subDir(dir, FOLDERS.evidence)); } catch (_) { /* no evidence folder yet */ }
    const takenSub = new Set(EVIDENCE_CATEGORIES.filter((c) => sub.includes(c)));
    const base = (FRAMEWORK.evidenceFolders || []);
    for (const byNumber of [false, true]) {   // by code or name first, so a number match never takes a folder another kind fits better
      for (let i = 0; i < EVIDENCE_CATEGORIES.length; i++) {
        if (sub.includes(EVIDENCE_CATEGORIES[i]) && takenSub.has(EVIDENCE_CATEGORIES[i]) && !(await emptyFolder(dir, `${FOLDERS.evidence}/${EVIDENCE_CATEGORIES[i]}`))) continue;
        const n = await pick(FOLDERS.evidence + '/', EVIDENCE_CATEGORIES[i], sub, takenSub, '', byNumber);
        if (n) { map.evidence[base[i] || EVIDENCE_CATEGORIES[i]] = n; takenSub.add(n); changed.push(`${EVIDENCE_CATEGORIES[i]} → ${n}`); EVIDENCE_CATEGORIES[i] = n; }
      }
    }
  }
  if (changed.length) { FOLDER_MAP = map; P().folderMap = map; }
  return changed;
}

// Make the folders in the person's OneDrive folder, including one per kind of evidence. Folders the person
// already has under a similar name are used instead of making new ones.
async function ensureFolders(dir, mode) {
  if (S.demo) return;
  const adopted = await adoptFolders(dir, mode);
  if (adopted.length) toast(`Using your existing folders: ${adopted.join('; ')}`);
  const names = mode === 'cpd' ? [FOLDERS.cpd, FOLDERS.exports] : Object.values(FOLDERS);
  for (const f of names) await subDir(dir, f, true);
  if (mode !== 'cpd') for (const c of EVIDENCE_CATEGORIES) await subDir(dir, `${FOLDERS.evidence}/${c}`, true);
}

      <div style="max-height:50vh;overflow:auto;padding-right:.4rem">${[...new Set(Object.values(PRESETS).map((p) => p.group))].map((g) => `<h3 style="margin:.9rem 0 .2rem">${esc(g)}</h3>` + Object.entries(PRESETS).filter(([, p]) => p.group === g).map(([k, p]) => `<label style="display:flex;gap:.6rem;align-items:flex-start;color:var(--ink);margin:.5rem 0"><input type="radio" name="preset" value="${k}" ${k === 'ice' ? 'checked' : ''}><span><b>${esc(p.name)}</b><br><span class="small muted">${esc(p.about)}</span></span></label>`).join('')).join('')}</div>
      <div class="row" style="justify-content:flex-end;margin-top:1rem"><button value="">Cancel</button><button class="primary" id="presetOk">Continue</button></div>`);
    let done = false;
    const finish = (v) => { if (!done) { done = true; resolve(v); } };
    $('button[value=""]', d).addEventListener('click', () => { finish(null); d.close(); });
    $('#presetOk', d).addEventListener('click', () => { finish($('input[name=preset]:checked', d).value); d.close(); });
    d.addEventListener('close', () => finish(null));
  });
}

// ---------- editing as text ----------
// One item per line, columns separated by " | " or a tab (so a table pasted from Excel or Word works).
const splitLine = (line) => line.split(/\t|\s*\|\s*/).map((s) => s.trim());
const lines = (text) => String(text || '').split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
const toLevelText = (fw) => fw.levels.map((l) => [l.short, l.name, l.help].join(' | ')).join('\n');
const toGroupText = (fw) => fw.groups.map((g) => [g.id, g.title].join(' | ')).join('\n');
const toAttrText = (fw) => fw.attributes.map((a) => { const lv = a.min && fw.levels.find((l) => l.id === a.min); return [a.id, a.group, a.text, ...(lv ? ['needs: ' + lv.short] : [])].join(' | '); }).join('\n');
const toKsbText = (fw) => (fw.ksbs || []).map((k) => [k.id, k.kind, k.text, (k.attributes || []).join(', ')].join(' | ')).join('\n');

// Turns the form text into a framework, or throws a message saying what is wrong.
function buildFramework(f, previous) {
  const levels = lines(f.levels).map((l) => {
    const [short, name, ...help] = splitLine(l);
    if (!short || !name) throw new Error(`Level line "${l}": write it as  K | Knowledge | what this level means`);
    const old = previous.levels.find((x) => x.short === short);
    return { id: old ? old.id : slug(name) || slug(short), short, name, help: help.join(' | ') };
  });
  if (!levels.length) throw new Error('Add at least one level.');
  if (new Set(levels.map((l) => l.id)).size !== levels.length || new Set(levels.map((l) => l.short)).size !== levels.length) throw new Error('Each level needs its own letters and name.');
  const groups = lines(f.groups).map((l) => {
    const [id, ...title] = splitLine(l);
    if (!id) throw new Error(`Group line "${l}": write it as  1 | Title of the group`);
    return { id, title: title.join(' | ') || id };
  });
  const attributes = lines(f.attributes).map((l) => {
    const parts = splitLine(l);
    const need = /^needs:\s*(.+)$/i.exec(parts[parts.length - 1] || '');
    if (need) parts.pop();
    const [id, group, ...text] = parts;
    if (!id || !group || !text.length) throw new Error(`Requirement line "${l}": write it as  2b | 2 | The text of the requirement`);
    let min = '';
    if (need) {
      const lv = levels.find((x) => x.short.toLowerCase() === need[1].trim().toLowerCase() || x.name.toLowerCase() === need[1].trim().toLowerCase());
      if (!lv) throw new Error(`Requirement ${id}: "needs: ${need[1]}" is not one of your levels`);
      min = lv.id;
    }
    return { id, group, text: text.join(' | '), min };
  });
  if (!attributes.length) throw new Error('Add at least one requirement.');
  const ids = attributes.map((a) => a.id);
  if (new Set(ids.map((x) => x.toLowerCase())).size !== ids.length) throw new Error('Two requirements have the same id.');
  for (const a of attributes) if (!groups.some((g) => String(g.id) === a.group)) groups.push({ id: a.group, title: a.group });
  const ksbs = lines(f.ksbs).map((l) => {
    const [id, kind, text, links] = splitLine(l);
    if (!id || !text) throw new Error(`Standard line "${l}": write it as  K1 | Knowledge | The text | 2a, 2b`);
    return { id, kind: kind || '', text, attributes: (links || '').split(/[,;\s]+/).filter((x) => ids.includes(x)) };
  });
  if (new Set(ksbs.map((k) => k.id)).size !== ksbs.length) throw new Error('Two standards have the same id.');
  const folders = {};
  for (const k of Object.keys(DEFAULT_FOLDERS)) {
    const v = String(f.folders[k] || '').trim().replace(/[\\/:*?"<>|]+/g, ' ').trim();
    folders[k] = v || DEFAULT_FOLDERS[k];
  }
  if (new Set(Object.values(folders)).size !== Object.keys(folders).length) throw new Error('Each folder needs a different name.');
  const evidenceFolders = lines(f.evidenceFolders).map((x) => x.replace(/[\\/:*?"<>|]+/g, ' ').trim()).filter(Boolean);
  return { name: f.name.trim() || 'My framework', goal: previous.goal, source: previous.source, labels: { attr: f.labelAttr.trim() || 'Attributes', ksb: f.labelKsb.trim() || 'KSBs', ...itemLabels({ attr: f.labelAttr, item: f.labelItem, items: f.labelItems }) }, levels, groups, attributes, ksbs, folders, evidenceFolders };
}


// What the views show, worked out from the data: evidence list, K/E/A coverage, PRR structure and checks,
// mentor feedback, completion and next steps. All plain code: nothing here guesses.

// LEVELS, LEVEL_SHORT, LEVEL_HELP, SUBS, SUB, GROUPS, KSBS, KSB come from the framework (05-framework.js).
const goal = () => (P() && P().settings.goal) || 3;

// ---------- evidence ----------
const codeFromName = (name) => { const m = /\b([A-Z]{2,3}-\d{2,3})\b/.exec(name); return m ? m[1] : ''; };
const titleFromName = (name) => name.replace(/\.[^.]+$/, '').replace(/^\s*[A-Z]{2,3}-\d{2,3}\s*[-–_.]?\s*/, '').trim() || name;

// Every evidence file joined with its record; records whose file has gone are listed as missing.
function evidenceItems() {
  const recs = (P() && P().evidence) || {};
  const seen = new Set();
  const items = S.files.map((f) => {
    seen.add(f.path);
    const rec = recs[f.path];
    return { path: f.path, file: f, rec, code: (rec && rec.code) || codeFromName(f.name), title: (rec && rec.title) || titleFromName(f.name), folder: f.path.split('/').slice(1, -1).join('/') };
  });
  for (const [path, rec] of Object.entries(recs)) {
    if (!seen.has(path)) items.push({ path, file: null, rec, code: rec.code || codeFromName(path.split('/').pop()), title: rec.title || titleFromName(path.split('/').pop()), folder: path.split('/').slice(1, -1).join('/'), missing: true });
  }
  return items;
}
function itemByCode(code) { return evidenceItems().find((i) => i.code === code); }
const label = (it) => it.code || it.title;

// For each sub-attribute and level: the evidence items mapped there.
function coverage() {
  const out = Object.fromEntries(SUBS.map((a) => [a.id, Object.assign(Object.fromEntries(LEVELS.map((l) => [l, []])), needLevels(a) ? { _need: needLevels(a) } : {})]));
  for (const it of evidenceItems()) {
    if (it.missing || !it.rec) continue;
    for (const m of it.rec.maps || []) {
      const cell = out[m.sub] && out[m.sub][m.level];
      if (cell && !cell.includes(it)) cell.push(it);
    }
  }
  return out;
}
// A requirement with a minimum level (IStructE objectives) needs `goal` items at that level or above, counted once;
// otherwise it needs `goal` items at every level.
const needLevels = (a) => (a.min && LEVELS.includes(a.min) ? LEVELS.slice(LEVELS.indexOf(a.min)) : null);
const distinctNeeded = (cell) => new Set(cell._need.flatMap((l) => cell[l])).size;
function slots(cell) { return cell._need ? Math.min(distinctNeeded(cell), goal()) : LEVELS.reduce((n, l) => n + Math.min(cell[l].length, goal()), 0); }
const slotMax = (cell) => (cell._need ? goal() : LEVELS.length * goal());
function slotStatus(cell) {
  const s = slots(cell);
  return s >= slotMax(cell) ? 'met' : s > 0 ? 'part' : 'none';
}
function ksbCoverage() {
  const out = Object.fromEntries(KSBS.map((k) => [k.id, { direct: new Set(), via: new Set() }]));
  for (const it of evidenceItems()) {
    if (it.missing || !it.rec) continue;
    for (const m of it.rec.maps || []) {
      for (const k of m.ksbs || []) if (out[k]) out[k].direct.add(it);
      for (const k of KSBS) if (k.attributes.includes(m.sub)) out[k.id].via.add(it);
    }
  }
  return out;
}

// ---------- PRRs (Word) ----------
// HEADING_RE is built from the framework's ids (05-framework.js).
const EVIDENCE_RE = /^\s*evidence\s*:\s*(.*)$/i;
const TAG_RE = /\{\s*([A-Z]{2,3}-\d{2,3})\s*\}/g;
const PLACEHOLDER_RE = /^(?:[\d\s.…]*|.*(?:…|\.\.\.)\s*(?:…|\.\.\.)?\s*|tbc|tbd|todo|xxx+|placeholder)$/i;
const DRAFT_WORDS = 40;
const PRR_STATE = { ready: ['ready', 'good'], draft: ['draft', 'part'], placeholder: ['placeholder', 'part'], empty: ['heading only', 'outline'], missing: ['not in PRR', 'outline'] };
const isPlaceholder = (t) => PLACEHOLDER_RE.test(t.trim());

S.prr = {}; // path -> {mtime, doc: {title, sections}, comments, edits, error}

function parsePrr(paragraphs) {
  let title = '';
  const sections = [];
  let cur = null;
  let block = null;
  paragraphs.forEach((p, i) => {
    const text = p.text;
    if (!text) return;
    const h = HEADING_RE.exec(text);
    const hid = h && subIdFromHeading(h[1]);
    if (h && hid && (/^heading/i.test(p.style) || text.length < 250)) {
      cur = { id: hid, heading: h[2].trim(), start: i, end: paragraphs.length, listed: [], listedText: '', general: [], blocks: [] };
      if (sections.length) sections[sections.length - 1].end = i;
      sections.push(cur);
      block = null;
      return;
    }
    if (!cur) { if (!title && (/^title$/i.test(p.style) || /attribute\s*\d|report|review/i.test(text))) title = text; return; }
    const e = EVIDENCE_RE.exec(text);
    if (e && !cur.blocks.length) { cur.listedText = e[1].trim(); cur.listed.push(...expandCodes(e[1])); return; }
    const tags = [...text.matchAll(TAG_RE)];
    if (!tags.length) { (block ? block.paragraphs : cur.general).push(text); return; }
    const before = text.slice(0, tags[0].index).trim();
    if (before) (block ? block.paragraphs : cur.general).push(before);
    tags.forEach((t, n) => {
      const end = n + 1 < tags.length ? tags[n + 1].index : text.length;
      block = { code: t[1], paragraphs: [] };
      const rest = text.slice(t.index + t[0].length, end).trim();
      if (rest) block.paragraphs.push(rest);
      cur.blocks.push(block);
    });
  });
  for (const s of sections) {
    const real = [...s.general, ...s.blocks.flatMap((b) => b.paragraphs)].filter((t) => !isPlaceholder(t));
    s.words = real.reduce((n, t) => n + words(t), 0);
    const anyText = s.general.join('') + s.blocks.map((b) => b.paragraphs.join('')).join('');
    s.state = s.words >= DRAFT_WORDS ? 'draft' : anyText.trim() || s.listed.length ? 'placeholder' : 'empty';
    for (const b of s.blocks) { b.words = b.paragraphs.filter((t) => !isPlaceholder(t)).reduce((n, t) => n + words(t), 0); b.thin = b.words < 15; }
    s.discussed = [...new Set(s.blocks.map((b) => b.code))].sort(natural);
    s.listed = [...new Set(s.listed)];
  }
  return { title, sections };
}

// Code checks for one section: [[level, message]].
function sectionChecks(s, codes, accepted) {
  const out = [];
  if (s.state === 'draft' && !s.listed.length && !s.discussed.length) out.push(['warn', 'no evidence referenced: add an "Evidence:" line and a {CODE} tag before each item you write about']);
  const unknown = [...new Set([...s.listed, ...s.discussed])].filter((c) => !codes.has(c));
  if (unknown.length) out.push(['error', 'not found in your evidence: ' + unknown.join(', ')]);
  const notDiscussed = s.listed.filter((c) => !s.discussed.includes(c) && codes.has(c));
  if (notDiscussed.length && s.state === 'draft') out.push(['warn', 'listed but not written about ({CODE} tag missing): ' + notDiscussed.join(', ')]);
  const notListed = s.discussed.filter((c) => !s.listed.includes(c));
  if (notListed.length && s.listed.length) out.push(['warn', 'written about but not in the Evidence line: ' + notListed.join(', ')]);
  const thin = s.blocks.filter((b) => b.thin).map((b) => b.code);
  if (thin.length && s.state === 'draft') out.push(['warn', 'placeholder or very short write-up for: ' + thin.join(', ')]);
  const unmapped = [...new Set([...s.listed, ...s.discussed])].filter((c) => codes.has(c) && !accepted.has(c + '|' + s.id));
  if (unmapped.length) out.push(['info', `not yet mapped to ${s.id} on the Evidence page: ` + unmapped.join(', ')]);
  return out;
}

async function loadReports() {
  if (S.demo) return;   // sample reports are made up in S.prr
  const root = portfolioRoot();
  if (!root) return;
  const files = (await listDir(root, FOLDERS.prr)).filter((f) => /\.docx$/i.test(f.name));
  const keep = new Set();
  for (const f of files) {
    const path = `${FOLDERS.prr}/${f.path}`;
    keep.add(path);
    if (S.prr[path] && S.prr[path].mtime === f.mtime) continue;
    try {
      const parsed = await parseDocx(await (await f.handle.getFile()).arrayBuffer());
      const doc = parsePrr(parsed.paragraphs);
      const sectionAt = (para) => doc.sections.find((s) => para !== null && para >= s.start && para < s.end);
      const comments = [];
      for (const c of parsed.comments.filter((x) => !x.parent)) {
        const s = sectionAt(c.para);
        comments.push({ kind: 'comment', key: await sha1(`${c.author}|${c.date}|${c.text}`), author: c.author, date: c.date, text: c.text, anchor: c.anchor,
          resolved: c.done, sub: s ? s.id : '', file: path, replies: parsed.comments.filter((r) => r.parent === c.id).map((r) => ({ author: r.author, date: r.date, text: r.text })) });
      }
      const edits = [];
      for (const [i, p] of parsed.paragraphs.entries()) {
        for (const [kind, list] of [['added', p.ins], ['removed', p.del]]) {
          for (const ch of list) {
            if (words(ch.text) < 4) continue;
            const s = sectionAt(i);
            edits.push({ kind: 'edit', change: kind, key: await sha1(`${ch.author}|${ch.date}|${kind}|${ch.text}`), author: ch.author, date: ch.date,
              text: ch.text.trim(), anchor: p.text.slice(0, 200), sub: s ? s.id : '', file: path, replies: [] });
          }
        }
      }
      S.prr[path] = { path, name: f.name, mtime: f.mtime, doc, comments, edits, error: null };
    } catch (err) {
      S.prr[path] = { path, name: f.name, mtime: f.mtime, doc: { title: '', sections: [] }, comments: [], edits: [], error: err.message };
    }
  }
  for (const path of Object.keys(S.prr)) if (!keep.has(path)) delete S.prr[path];
}

// Everything the PRRs say, per sub-attribute: {id: {sections: [{file, section, issues}], state}}
function prrBySub() {
  const items = evidenceItems();
  const codes = new Set(items.map((i) => i.code).filter(Boolean));
  const mapped = new Set(items.flatMap((i) => ((i.rec && i.rec.maps) || []).map((m) => i.code + '|' + m.sub)));
  const out = Object.fromEntries(SUBS.map((a) => [a.id, { sections: [], state: 'missing' }]));
  for (const r of Object.values(S.prr)) {
    for (const s of r.doc.sections) {
      const issues = sectionChecks(s, codes, mapped);
      const dup = r.doc.sections.filter((x) => x.id === s.id).length > 1;
      if (dup) issues.unshift(['error', `${s.id} appears more than once in ${r.name}`]);
      out[s.id].sections.push({ file: r.path, name: r.name, section: s, issues });
    }
  }
  for (const v of Object.values(out)) {
    const states = v.sections.map((x) => (x.section.state === 'draft' && !x.issues.some((i) => i[0] !== 'info') ? 'ready' : x.section.state));
    v.state = states.includes('ready') ? 'ready' : states.includes('draft') ? 'draft' : states.includes('placeholder') ? 'placeholder' : states.length ? 'empty' : 'missing';
  }
  return out;
}

// ---------- mentor feedback ----------
function feedbackItems() {
  const responses = (P() && P().comments) || {};
  const all = Object.values(S.prr).flatMap((r) => [...r.comments, ...r.edits]);
  return all.map((f) => {
    const resp = responses[f.key];
    const status = resp ? resp.status : f.resolved ? 'done' : 'open';
    return { ...f, status, response: resp ? resp.response : '', updated: resp ? resp.updated : '' };
  });
}

// ---------- completion ----------
// Evidence slots 50%, PRR sections 35% (half when drafted, all when ready), feedback 15% (a sub-attribute
// counts once its section is ready and every comment on it is answered).
function completion() {
  const cov = coverage();
  const prr = prrBySub();
  const fb = feedbackItems();
  let ev = 0, pr = 0, fe = 0;
  for (const a of SUBS) {
    ev += slots(cov[a.id]) / slotMax(cov[a.id]);
    const st = prr[a.id].state;
    pr += st === 'ready' ? 1 : st === 'draft' ? 0.5 : 0;
    if (st === 'ready' && !fb.some((f) => f.sub === a.id && f.status === 'open')) fe += 1;
  }
  const n = SUBS.length;
  const parts = { evidence: ev / n, prr: pr / n, feedback: fe / n };
  return { ...parts, total: 0.5 * parts.evidence + 0.35 * parts.prr + 0.15 * parts.feedback };
}

// The most useful things to do next, worst gaps first.
function nextSteps(limit = 8) {
  const out = [];
  const cov = coverage();
  const prr = prrBySub();
  const fb = feedbackItems().filter((f) => f.status === 'open');
  const unmapped = evidenceItems().filter((i) => !i.missing && !(i.rec && i.rec.maps && i.rec.maps.length));
  const missing = evidenceItems().filter((i) => i.missing);
  if (missing.length) out.push({ text: `${plural(missing.length, 'evidence record')} lost ${missing.length === 1 ? 'its file' : 'their files'} (moved or renamed): relink them`, href: '#evidence?show=missing' });
  if (fb.length) out.push({ text: `Answer ${plural(fb.length, 'open mentor comment')}`, href: '#feedback' });
  if (unmapped.length) out.push({ text: `Map ${plural(unmapped.length, 'evidence file')} to ${LABEL.items}`, href: '#evidence?show=unmapped' });
  const gaps = SUBS.map((a) => ({ a, s: slots(cov[a.id]) })).sort((x, y) => x.s - y.s);
  for (const { a, s } of gaps.slice(0, 4)) {
    if (s >= slotMax(cov[a.id])) break;
    const lacking = cov[a.id]._need ? [`${goal() - s} at ${LEVEL_NAME[cov[a.id]._need[0]]} or above`] : LEVELS.filter((l) => cov[a.id][l].length < goal()).map((l) => `${goal() - cov[a.id][l].length} ${l}`);
    out.push({ text: `${a.id}: needs ${lacking.join(', ')}`, href: '#sub/' + a.id });
  }
  for (const a of SUBS) {
    if (out.length >= limit) break;
    const st = prr[a.id].state;
    if (st === 'draft') out.push({ text: `${a.id}: PRR section drafted but has check warnings`, href: '#sub/' + a.id });
  }
  return out.slice(0, limit);
}

// ---------- meetings ----------
// Lines from a Teams transcript (.vtt, .docx or .txt): [{time, speaker, text}]
function parseTranscriptLines(lines, isVtt) {
  const out = [];
  const push = (time, speaker, text) => {
    text = text.replace(/<\/?v[^>]*>/g, '').replace(/\s+/g, ' ').trim();
    if (!text) return;
    const last = out[out.length - 1];
    // Teams cuts sentences across cues: join a cue to the last one only when that one stopped mid-sentence.
    if (last && last.speaker === speaker && !/[.!?…]$/.test(last.text) && (last.text.length + text.length) < 700) last.text += ' ' + text;
    else out.push({ time, speaker, text, tag: '' });
  };
  if (isVtt) {
    let time = '';
    for (const line of lines) {
      const t = /^(\d{1,2}:)?\d{1,2}:\d{2}[.,]\d{3}\s*-->/.exec(line);
      if (t) { time = line.split('-->')[0].trim().replace(/[.,]\d{3}$/, ''); continue; }
      if (!line.trim() || /^WEBVTT/.test(line) || /^NOTE\b/.test(line) || /^[0-9a-f-]{8,}(\/\d+-\d+)?$/i.test(line.trim()) || /^\d+$/.test(line.trim())) continue;
      const v = /<v\s+([^>]+)>(.*?)(<\/v>|$)/.exec(line);
      if (v) push(time, v[1].trim(), v[2]); else push(time, '', line);
    }
    return out;
  }
  let speaker = '', time = '';
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    let m = /^(.{2,60}?)\s+((?:\d{1,2}:)?\d{1,2}:\d{2})\s*$/.exec(line);
    if (m && !/[.!?]$/.test(m[1])) { speaker = m[1].trim(); time = m[2]; continue; }
    m = /^((?:\d{1,2}:)?\d{1,2}:\d{2}(?:\.\d+)?)\s+(.{2,60}?)\s*$/.exec(line);
    if (m && !/[.!?]$/.test(m[2]) && m[2].split(' ').length <= 5) { time = m[1]; speaker = m[2].trim(); continue; }
    m = /^\[?((?:\d{1,2}:)?\d{1,2}:\d{2})\]?\s+([^:]{2,40}):\s+(.+)$/.exec(line);
    if (m) { push(m[1], m[2].trim(), m[3]); continue; }
    m = /^([A-Z][^:]{1,39}):\s+(.+)$/.exec(line);
    if (m && m[1].split(' ').length <= 4) { push(time, m[1].trim(), m[2]); continue; }
    if (/started transcription|stopped transcription/i.test(line)) continue;
    push(time, speaker, line);
  }
  return out;
}

async function readTranscript(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith('.docx')) {
    const { paragraphs } = await parseDocx(await file.arrayBuffer());
    return parseTranscriptLines(paragraphs.map((p) => p.text), false);
  }
  const text = await file.text();
  return parseTranscriptLines(text.split(/\r?\n/), name.endsWith('.vtt') || /^WEBVTT/.test(text));
}

const ITEM_KINDS = { done: 'Done', todo: 'To do', teaching: 'Teaching' };
function allActions() {
  return ((P() && P().meetings) || []).flatMap((m) => m.items.filter((i) => i.kind === 'todo').map((i) => ({ ...i, meeting: m })));
}

// ---------- CPD ----------
function cpdYear(dateIso) {
  const start = (P() && P().settings.cpdYearStart) || 1;
  const d = new Date(dateIso);
  if (isNaN(d)) return null;

const cpdYearLabel = (y) => ((P() && P().settings.cpdYearStart) || 1) === 1 ? String(y) : `${y}/${String(y + 1).slice(2)}`;
function cpdWarnings(a) {
  const out = [];
  const days = a.dateTo && a.dateFrom ? Math.round((new Date(a.dateTo) - new Date(a.dateFrom)) / 864e5) + 1 : 1;
  if (+a.hours > 30) out.push('ICE advises claiming no more than 30 hours for one activity');
  if (+a.hours > 6 * Math.max(1, days)) out.push('more than 6 hours a day: ICE advises a day counts as 6 hours at most');
  if (!a.learning || !a.benefits) out.push('evaluation missing: key learning points and benefits');
  if (!a.objective) out.push('no development plan reference');
  return out;
}


// A plain yes/no list of what should be true before the portfolio goes in. Worked out from the data; nothing is guessed.
function readiness() {
  const cov = coverage();
  const prr = prrBySub();
  const items = evidenceItems();
  const full = SUBS.filter((a) => slotStatus(cov[a.id]) === 'met').length;
  const open = feedbackItems().filter((f) => f.status === 'open').length;
  const unmapped = items.filter((i) => !i.missing && !(i.rec && i.rec.maps && i.rec.maps.length)).length;
  const missing = items.filter((i) => i.missing).length;
  const notWritten = SUBS.filter((a) => ['missing', 'empty', 'placeholder'].includes(prr[a.id].state)).length;
  const warned = SUBS.filter((a) => prr[a.id].state === 'draft').length;
  const yr = cpdYear(today());
  const hours = P().cpd.activities.filter((a) => cpdYear(a.dateFrom) === yr).reduce((n, a) => n + (+a.hours || 0), 0);
  const target = P().settings.cpdTarget || 0;
  const list = [
    { ok: full === SUBS.length, text: `Every ${LABEL.item} has enough evidence (${full} of ${SUBS.length})`, href: '#attributes' },
    { ok: unmapped === 0 && missing === 0, text: unmapped || missing ? `${unmapped ? plural(unmapped, 'evidence file') + ' not mapped' : ''}${unmapped && missing ? ', ' : ''}${missing ? plural(missing, 'evidence record') + ' with a missing file' : ''}` : 'All evidence files are mapped and found', href: '#evidence?show=' + (missing ? 'missing' : 'unmapped') },
    { ok: notWritten === 0, text: notWritten ? `${notWritten} of ${SUBS.length} ${LABEL.items} not written up in a report yet` : `Every ${LABEL.item} is written up in a report`, href: '#reports' },
    { ok: warned === 0, text: warned ? `${plural(warned, 'report section')} with check warnings` : 'No report check warnings', href: '#reports' },
    { ok: open === 0, text: open ? `${plural(open, 'mentor comment')} still open` : 'No open mentor comments', href: '#feedback' },
    { ok: !target || hours >= target, text: `CPD this year: ${hours} of ${target} hours`, href: '#cpd' },
  ];
  return list;
}
