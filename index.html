// Every page that exists for this person (used for routing); the bottom tab bar (21-tabbar.js) shows some of them
// and puts the rest under "More".
function tabsFor() { return tabsAll().filter((t) => t[0] !== 'ksbs' || KSBS.length); }
// Progressive tabs: a new apprentice sees only Home, Evidence, CPD, Settings and Help. The others appear as soon as
// there is something for them to show (or always, with Settings -> "Show every tab"); the rest stay under "More".
function tabUnlocked(id) {
  if (isMentor() || !P() || P().mode === 'cpd' || (P().settings && P().settings.showAllTabs)) return true;
  const hasEvidence = evidenceItems().length > 0 || Object.values(P().evidence || {}).some((r) => r.maps && r.maps.length);
  switch (id) {
    case 'attributes': case 'ksbs': case 'reports': return hasEvidence || Object.keys(S.prr || {}).length > 0;
    case 'feedback': return feedbackItems().length > 0;
    case 'meetings': return (P().meetings || []).length > 0;
    case 'mentor': return !!S.other || !!S.otherData;
    default: return true;
  }
}
function tabsShown(active) {
  const all = tabsFor();
  const shown = all.filter((t) => tabUnlocked(t[0]) || t[0] === active);
  return { shown, more: all.filter((t) => !shown.includes(t)) };
}
function tabsAll() {
  if (!S.data) return [];
  if (isMentor()) return [['home', 'Home'], ['evidence', 'Evidence'], ['attributes', LABEL.attr], ['ksbs', LABEL.ksb], ['reports', 'Reports'], ['feedback', 'Feedback'], ['meetings', 'Meetings'], ['mentor', 'Assessment'], ['cpd', 'CPD'], ['settings', 'Settings'], ['help', 'Help']];
  if (P().mode === 'cpd') return [['cpd', 'CPD'], ['settings', 'Settings'], ['help', 'Help']];
  return [['home', 'Home'], ['evidence', 'Evidence'], ['attributes', LABEL.attr], ['ksbs', LABEL.ksb], ['reports', 'Reports'], ['feedback', 'Feedback'], ['meetings', 'Meetings'], ['cpd', 'CPD'], ['mentor', 'Mentor'], ['settings', 'Settings'], ['help', 'Help']];
}

  const who = S.data ? (isMentor() ? `Mentor: ${esc(S.data.name)} · apprentice: ${esc((P() && P().name) || S.data.apprentice || '?')}` : esc(S.data.name)) : '';
  const openFb = S.data && P() ? feedbackItems().filter((f) => f.status === 'open').length : 0;
  $('#top').innerHTML = `<div class="bar">

function parseHash() {

}

// Tie each <label> that has no "for" to the form control that follows it, so every field has an accessible name.
let autoLabelId = 0;
function autoLabel(root) {
  for (const l of $$('label:not([for])', root)) {
    if (l.querySelector('input,select,textarea')) continue;
    const next = l.nextElementSibling;
    const ctl = next && (next.matches('input,select,textarea') ? next : next.querySelector('input,select,textarea'));
    if (!ctl || (ctl.id && document.querySelector(`label[for="${ctl.id}"]`))) continue;
    if (!ctl.id) ctl.id = 'auto-' + (++autoLabelId);
    l.setAttribute('for', ctl.id);
  }
  // Any field still without a name takes the heading of the card it sits in (for example the framework text boxes).
  for (const ctl of $$('input:not([type=hidden]):not([type=file]),select,textarea', root)) {
    if (ctl.getAttribute('aria-label') || ctl.getAttribute('aria-labelledby') || ctl.closest('label') || (ctl.id && document.querySelector(`label[for="${ctl.id}"]`))) continue;
    const box = ctl.closest('.card, section');
    const h = box && box.querySelector('h2, h3');
    if (h) ctl.setAttribute('aria-label', h.textContent.trim());
  }
}

let previewUrl = null;
async function previewHtml(path) {
  if (S.demo) return demoPreviewHtml(path);
  const file = await getFile(path);
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  const ext = (path.split('.').pop() || '').toLowerCase();
  if (['pdf', 'png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'svg', 'txt', 'md', 'csv', 'htm', 'html', 'mp4', 'webm', 'mp3', 'm4a', 'wav'].includes(ext)) {
    const type = { pdf: 'application/pdf', svg: 'image/svg+xml', txt: 'text/plain;charset=utf-8', md: 'text/plain;charset=utf-8', csv: 'text/plain;charset=utf-8', htm: 'text/plain;charset=utf-8', html: 'text/plain;charset=utf-8' }[ext] || file.type;
    previewUrl = URL.createObjectURL(new Blob([file], { type }));
    if (/^(png|jpe?g|gif|webp|bmp|svg)$/.test(ext)) return `<img class="preview" src="${previewUrl}" alt="">`;
    if (/^(mp4|webm)$/.test(ext)) return `<video class="preview" src="${previewUrl}" controls></video>`;
    if (/^(mp3|m4a|wav)$/.test(ext)) return `<audio src="${previewUrl}" controls style="margin:20px"></audio>`;
    return `<iframe class="preview" src="${previewUrl}" title="preview"></iframe>`;
  }
  if (ext === 'docx') return `<div class="docx-view">${await docxPreviewHtml(await file.arrayBuffer())}</div>`;
  if (ext === 'vtt') return `<pre class="text-view">${esc(await file.text())}</pre>`;
  return `<div class="empty" style="margin:20px">This type of file (.${esc(ext)}, ${fmtSize(file.size)}) cannot be shown here.<br>Open it from your OneDrive folder:<br><code>${esc(path)}</code></div>`;
}

function bindSearch() {
  const input = $('#search');
  const box = $('#searchResults');
  let hits = [];
  let sel = 0;
  const show = () => {
    const q = input.value.trim().toLowerCase();
    if (!q) { box.hidden = true; return; }
    const terms = q.split(/\s+/);
    hits = searchIndex().filter((h) => terms.every((t) => h.text.toLowerCase().includes(t))).slice(0, 30);
    sel = 0;
    box.innerHTML = hits.length ? hits.map((h, i) => `<a href="${h.href}" class="${i === sel ? 'sel' : ''}"><span class="kind">${esc(h.kind)}</span>${esc(h.label.slice(0, 140))}</a>`).join('') : '<div class="muted" style="padding:.6rem">Nothing found</div>';
    box.hidden = false;
  };
  input.addEventListener('input', show);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % Math.max(1, hits.length);
      $$('a', box).forEach((a, i) => a.classList.toggle('sel', i === sel));
    } else if (e.key === 'Enter' && hits[sel]) { location.hash = hits[sel].href; box.hidden = true; input.blur(); }
    else if (e.key === 'Escape') { box.hidden = true; input.blur(); }
  });
  input.addEventListener('blur', () => setTimeout(() => { box.hidden = true; }, 200));
}
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' && $('#search')) { e.preventDefault(); $('#search').focus(); $('#search').select(); }
  if (e.key === 'Escape') closePreview();
  // Ctrl+Z / Ctrl+Y undo and redo changes to the portfolio, except while typing in a field (the field keeps its own undo).
  if ((e.ctrlKey || e.metaKey) && !e.altKey && S.data && !(e.target.closest && e.target.closest('input,textarea,select,[contenteditable],dialog'))) {
    const k = e.key.toLowerCase();
    if (k === 'z' && !e.shiftKey) { e.preventDefault(); undoStep(false); }
    else if (k === 'y' || (k === 'z' && e.shiftKey)) { e.preventDefault(); undoStep(true); }
  }
});

// ---------- dialogs ----------
function dialog(html, onOpen) {
  const d = document.createElement('dialog');
  d.innerHTML = html;
  document.body.append(d);
  d.addEventListener('close', () => d.remove());
  // Remove at once on close: the close event can arrive late, leaving a stale dialog in the page.
  const close = d.close.bind(d);
  d.close = (v) => { close(v); d.remove(); };
  d.showModal();
  if (onOpen) onOpen(d);
  return d;
}
function ask(question, okLabel = 'OK') {

  S.data = newPortfolio(name, mode);
  if (mode !== 'cpd') {
    const key = await choosePreset();
    if (!key) { S.data = null; return; }
    S.data.framework = key === 'ice' ? null : clone(PRESETS[key].fw);
    if (PRESETS[key].fw.goal) S.data.settings.goal = PRESETS[key].fw.goal;
  }
  FOLDER_MAP = null;
  applyFramework(S.data.framework);
  await ensureFolders(dir, mode);
  await subDir(dir, DATA_DIR, true);
  await save(true);
  await remember('own', dir);
  toast(`Set up in "${dir.name}"`);
  location.hash = mode === 'cpd' ? '#cpd' : '#home';
  await openAll();
}

async function setupMentor() {
  let dir;
  try { dir = await pickFolder('own', 'readwrite'); } catch (_) { return; }
  S.own = dir;
  if (await loadOwn()) { await remember('own', dir); return openAll(); }
  const name = await askText('Your name', 'Your name (the mentor)');
  if (!name) return;
  toast('Now pick the apprentice\'s shared portfolio folder');
  let other;
  try { other = await pickFolder('other', 'read'); } catch (_) { return; }
  let apprentice = '';
  try { apprentice = (await readJson(other, `${DATA_DIR}/${FILES.apprentice}`)).json.name; } catch (_) {
    toast('That folder has no ICE portfolio (ice-data/portfolio.json). Pick the apprentice\'s folder.', 'error');
    return;
  }
  S.data = newMentor(name, apprentice);
  await subDir(dir, DATA_DIR, true);
  await save(true);
  S.other = other;
  await remember('own', dir);
  await remember('other', other);
  await openAll();
}

function evidenceRecord(it) {
  const ev = P().evidence;
  if (!ev[it.path]) ev[it.path] = { code: it.code, title: it.title, date: '', project: '', notes: '', maps: [], size: it.file ? it.file.size : 0 };
  return ev[it.path];
}

async function numberFiles() {
  const items = evidenceItems().filter((i) => !i.missing && !i.code);
  if (!items.length) return toast('Every file already has a code');
  const byFolder = {};
  for (const i of items) (byFolder[i.folder] = byFolder[i.folder] || []).push(i);
  const used = new Set(evidenceItems().map((i) => i.code).filter(Boolean));
  const d = dialog(`<h2>Give codes to ${plural(items.length, 'file')}</h2>
    <p class="small muted">Pick a 2 or 3 letter prefix per folder (for example SV for site visits). Files are numbered in name order, skipping codes already used. Only the tracker changes: file names stay as they are.</p>
    <table><thead><tr><th>Folder</th><th>Files</th><th>Prefix</th></tr></thead><tbody>${Object.entries(byFolder).map(([f, list]) => `<tr><td>${esc(f || '(top level)')}</td><td>${list.length}</td>
      <td><input data-folder="${esc(f)}" size="4" maxlength="3" value="${esc(categoryPrefix(f) || (f.replace(/^[\d\s.\-–]+/, '').match(/[A-Za-z]/g) || ['E', 'V']).slice(0, 2).join('').toUpperCase())}"></td></tr>`).join('')}</tbody></table>
    <div class="row" style="justify-content:flex-end;margin-top:1rem"><button value="no">Cancel</button><button class="primary" id="doNumber">Give codes</button></div>`);
  $('button[value=no]', d).addEventListener('click', () => d.close());
  $('#doNumber', d).addEventListener('click', () => {
    for (const input of $$('input[data-folder]', d)) {
      const prefix = input.value.trim().toUpperCase();
      if (!/^[A-Z]{2,3}$/.test(prefix)) { toast('A prefix must be 2 or 3 letters', 'error'); return; }
      let n = 0;
      for (const it of byFolder[input.dataset.folder].sort((a, b) => natural(a.path, b.path))) {
        while (used.has(`${prefix}-${String(n).padStart(2, '0')}`)) n++;
        const code = `${prefix}-${String(n).padStart(2, '0')}`;
        used.add(code);
        evidenceRecord(it).code = code;
      }
    }
    changed();
    d.close();
    toast(`Codes given to ${plural(items.length, 'file')}`);
    render();
  });
}

    }));
    $$('.ksb-box').forEach((b) => b.addEventListener('change', () => {

    $$('.map-del').forEach((b) => b.addEventListener('click', () => { rec.maps.splice(+b.dataset.i, 1); changed(); render(); }));

};

function newPrrDialog() {
  const d = dialog(`<h2>New PRR from the template</h2>
    <p class="small muted">Makes a Word file in <code>${FOLDERS.prr}</code> with a heading and an Evidence line for each ${LABEL.item}. Existing files are never overwritten.</p>
    <label>${esc(LABEL.attr)}</label><select id="prrGroup">${GROUPS.map((g) => `<option value="${g.group}">${g.group}. ${esc(g.title)}</option>`).join('')}<option value="all">All in one file</option></select>
    <label><input type="checkbox" id="prrEvidence" checked> Fill the Evidence lines from what is already mapped</label>
    <div class="row" style="justify-content:flex-end;margin-top:1rem"><button value="no">Cancel</button><button class="primary" id="prrMake">Create</button></div>`);
  $('button[value=no]', d).addEventListener('click', () => d.close());
  $('#prrMake', d).addEventListener('click', (e) => act(e.currentTarget, async () => {
    const g = $('#prrGroup', d).value;
    const fill = $('#prrEvidence', d).checked;
    const cov = coverage();
    const groups = g === 'all' ? GROUPS : GROUPS.filter((x) => String(x.group) === g);
    const name = g === 'all' ? 'PRR - All attributes.docx' : `PRR - Attribute ${g}.docx`;
    if (await exists(S.own, `${FOLDERS.prr}/${name}`)) throw new Error(`${name} already exists`);
    const blocks = [{ type: 'title', text: g === 'all' ? `Professional Review Report – ${P().name}` : `Attribute ${g} – ${groups[0].title}` },
      { type: 'small', text: 'Under each heading: list the evidence on the Evidence line, then write about each item after its tag, e.g. {CO-14}.' }];
    for (const grp of groups) {
      if (g === 'all') blocks.push({ type: 'h1', text: `Attribute ${grp.group} – ${grp.title}` });
      for (const a of SUBS.filter((x) => x.group === grp.group)) {
        const codes = fill ? [...new Set(LEVELS.flatMap((l) => cov[a.id][l].map((i) => i.code)).filter(Boolean))].sort(natural) : [];
        blocks.push({ type: g === 'all' ? 'h2' : 'h1', text: `${a.id} – ${a.text}` }, { type: 'p', text: 'Evidence: ' + codes.join(', ') });
        for (const c of codes) blocks.push({ type: 'p', text: `{${c}} …` });
        if (!codes.length) blocks.push({ type: 'p', text: '…' });
      }
    }
    await writeFile(S.own, `${FOLDERS.prr}/${name}`, makeDocx(blocks));
    d.close();
    await loadReports();
    await render();
    return name;
  }, (name) => `Created ${FOLDERS.prr}/${name}: open it in Word from your OneDrive folder`));
}

// ---------- feedback ----------
VIEWS.feedback = async (arg, q) => {
  await loadReports();
  const all = feedbackItems();
  const status = q.get('status') || (q.get('key') ? 'all' : 'open');
  const sub = q.get('sub') || '';
  const file = q.get('file') || '';
  const focus = q.get('focus') === '1';
  let list = all.filter((f) => (status === 'all' || f.status === status) && (!sub || f.sub === sub) && (!file || f.file === file));
  if (q.get('key')) list = all.filter((f) => f.key === q.get('key'));
  list.sort((a, b) => natural(a.sub || 'zz', b.sub || 'zz') || natural(a.file, b.file));
  const qs = (patch) => '#feedback?' + new URLSearchParams({ status, sub, file, focus: focus ? '1' : '', ...patch }).toString();
  const count = (s) => all.filter((f) => s === 'all' || f.status === s).length;
  const subs = [...new Set(all.map((f) => f.sub).filter(Boolean))].sort(natural);
  const at = Math.min(+(q.get('i') || 0), Math.max(0, list.length - 1));
  const shown = focus ? list.slice(at, at + 1) : list;
  return `<div class="row spread"><h1>Mentor feedback</h1><div class="row">
      <button id="exportResp" class="primary">Export “Response to feedback” (Word)</button></div></div>
    <p class="muted small">Comments and tracked changes from the Word files in <code>${FOLDERS.prr}</code>, sorted by ${LABEL.item}. ${canEdit() ? 'Write what you changed under each one and mark it done: that becomes your response table for the mentor.' : 'The apprentice’s responses are shown under each comment.'}</p>
    <div class="sub-tabs">${['open', 'done', 'wont', 'all'].map((s) => `<a href="${qs({ status: s, i: 0 })}" class="${status === s ? 'active' : ''}">${s === 'all' ? 'All' : FB_STATUS[s]} (${count(s)})</a>`).join('')}
      <select id="fbSub" aria-label="${cap1(LABEL.item)}"><option value="">All ${LABEL.items}</option>${subs.map((s) => `<option ${s === sub ? 'selected' : ''}>${s}</option>`).join('')}</select>
      <a href="${qs({ focus: focus ? '' : '1', i: 0 })}" class="${focus ? 'active' : ''}" title="Show one comment at a time">One at a time</a></div>
    ${focus && list.length ? `<div class="row" style="margin-bottom:8px"><a class="btn small" href="${qs({ i: Math.max(0, at - 1) })}">‹ Previous</a><span>${at + 1} of ${list.length}</span><a class="btn small" href="${qs({ i: Math.min(list.length - 1, at + 1) })}">Next ›</a></div>` : ''}
    ${shown.length ? shown.map(fbCard).join('') : `<div class="empty">${all.length ? 'Nothing here.' : 'No comments found yet. When your mentor comments in your Word PRR, they appear here.'}</div>`}`;
};
function fbCard(f) {
  const ed = canEdit();
  return `<div class="fb ${f.status !== 'open' ? 'done' : ''}" data-key="${f.key}">
    <div class="row spread"><div class="meta">${f.sub ? `<b>${subLink(f.sub)}</b> · ` : ''}${esc(f.author)} · ${fmtDate(f.date)} · ${fileLink(f.file, f.file.split('/').pop())}
      ${f.kind === 'edit' ? ' · ' + chip(f.change === 'added' ? 'suggested text' : 'suggested deletion', 'accent') : ''}${f.resolved ? ' · ' + chip('resolved in Word', 'good') : ''}</div>
      <div class="row">${Object.entries(FB_STATUS).map(([k, v]) => `<button class="small fb-status ${f.status === k ? 'on' : ''}" data-status="${k}"${dis(ed)}>${v}</button>`).join('')}</div></div>
    ${f.anchor && f.kind === 'comment' ? `<div class="quote">“${esc(f.anchor.slice(0, 400))}”</div>` : ''}
    <div class="text">${f.kind === 'edit' ? `<span class="${f.change === 'added' ? 'good' : 'bad'}">${f.change === 'added' ? '+ ' : '− '}${esc(f.text)}</span><div class="small muted">in: ${esc(f.anchor.slice(0, 200))}</div>` : linkify(f.text)}</div>
    ${f.replies.map((r) => `<div class="reply"><b>${esc(r.author)}:</b> ${esc(r.text)}</div>`).join('')}
    ${ed ? `<textarea class="fb-resp" placeholder="Your response: what you changed, or why not">${esc(f.response)}</textarea>` : f.response ? `<div class="small"><b>Response:</b> ${esc(f.response)}</div>` : ''}
  </div>`;
}
VIEWS.feedback.after = (arg, q) => {
  $('#fbSub').addEventListener('change', (e) => { q.set('sub', e.target.value); q.set('i', 0); location.hash = '#feedback?' + q.toString(); });
  $('#exportResp').addEventListener('click', (e) => act(e.currentTarget, exportResponses, (p) => 'Saved ' + p));
  if (!canEdit()) return;
  const record = (key, f) => (P().comments[key] = P().comments[key] || { status: f ? f.status : 'open', response: '', updated: '' });
  $$('.fb').forEach((card) => {
    const key = card.dataset.key;
    const f = feedbackItems().find((x) => x.key === key);
    $$('.fb-status', card).forEach((b) => b.addEventListener('click', () => {
      const r = record(key, f);
      r.status = b.dataset.status;
      r.updated = nowIso();
      changed();
      $$('.fb-status', card).forEach((x) => x.classList.toggle('on', x === b));
      card.classList.toggle('done', r.status !== 'open');
      flash(b, 'done');
      renderHeader('feedback');
    }));
    const ta = $('.fb-resp', card);
    if (ta) ta.addEventListener('input', () => { const r = record(key, f); r.response = ta.value; r.updated = nowIso(); changed(); });
  });
};

async function exportResponses() {
  await loadReports();
  const items = feedbackItems().sort((a, b) => natural(a.sub || 'zz', b.sub || 'zz'));
  if (!items.length) throw new Error('there are no comments to export');
  const rows = [['#', 'Section', 'Comment', 'Response', 'Status']];
  items.forEach((f, i) => rows.push([String(i + 1), f.sub || '–', `${f.author}: ${f.kind === 'edit' ? (f.change === 'added' ? 'suggested adding: ' : 'suggested removing: ') : ''}${f.text}`, f.response || '', FB_STATUS[f.status]]));
  const blob = makeDocx([
    { type: 'title', text: 'Response to feedback' },
    { type: 'small', text: `${P().name} · ${fmtDate(today())} · ${items.filter((f) => f.status !== 'open').length} of ${items.length} answered` },
    { type: 'table', rows, widths: [500, 1100, 3700, 3700, 1100] },
  ]);
  const path = `${FOLDERS.feedback}/Response to feedback ${today()}.docx`;
  await writeFile(S.own, path, blob);
  return path;
}

async function importTranscript(file, path) {
  let lines;
  try { lines = await readTranscript(file); } catch (err) { return toast('Could not read the transcript: ' + err.message, 'error'); }
  if (!lines.length) return toast('No lines found in that file', 'error');
  const date = (/(\d{4})[-_.]?(\d{2})[-_.]?(\d{2})/.exec(file.name) || []).slice(1).join('-') || localIso(new Date(file.lastModified)).slice(0, 10);
  const speakers = [...new Set(lines.map((l) => l.speaker).filter(Boolean))];
  const m = { id: uid(), date, title: file.name.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').replace(/\d{4}[-_.]?\d{2}[-_.]?\d{2}/, '').replace(/^[\s\-–]+|[\s\-–]+$/g, '').slice(0, 80) || 'Mentor meeting', attendees: speakers.join(', '), source: path, lines, items: [] };
  P().meetings.push(m);
  changed();
  toast(`Imported ${plural(lines.length, 'line')}${speakers.length ? ' from ' + speakers.join(', ') : ''}`);
  location.hash = '#meeting/' + m.id;
}

let selLine = 0;

      <div>${Object.entries(ITEM_KINDS).map(([k, v]) => `<div class="card"><div class="row spread"><h2 style="margin:0">${v} <span class="small muted">${m.items.filter((i) => i.kind === k).length}</span></h2>

VIEWS.meeting.after = (id) => {
  const m = P().meetings.find((x) => x.id === id);
  if (!m) return;
  $('#writeNotes').addEventListener('click', (e) => act(e.currentTarget, () => writeMeetingNotes(m), (p) => 'Saved ' + p));
  if (!canEdit()) return;
  bindFields($('.card'), m);
  $('#delMeeting').addEventListener('click', async () => {
    if (!(await ask(`Delete “${esc(m.title)}” and its ${plural(m.items.length, 'item')}? The transcript file stays in your Meetings folder.`, 'Delete'))) return;
    P().meetings.splice(P().meetings.indexOf(m), 1);
    changed();
    location.hash = '#meetings';
  });
  const keep = () => { const t = $('#transcript'); const y = t ? t.scrollTop : 0; return () => { const t2 = $('#transcript'); if (t2) t2.scrollTop = y; }; };
  const rerender = () => { const restore = keep(); const wy = window.scrollY; render().then(() => { restore(); window.scrollTo(0, wy); }); };
  const tag = (n, kind) => {
    const line = m.lines[n];
    const existing = m.items.find((i) => i.line === n);
    if (!kind || line.tag === kind) {
      line.tag = '';
      if (existing) m.items.splice(m.items.indexOf(existing), 1);
    } else {
      line.tag = kind;
      if (existing) existing.kind = kind;
      else m.items.push({ id: uid(), kind, text: line.text, who: line.speaker, time: line.time, line: n, sub: '', due: '', status: 'open', evidence: '' });
      m.items.sort((a, b) => (a.line ?? 1e9) - (b.line ?? 1e9));
    }
    changed();
    rerender();
  };
  $$('.tline').forEach((row) => {
    row.addEventListener('click', (e) => {
      selLine = +row.dataset.n;
      $$('.tline.sel').forEach((x) => x.classList.remove('sel'));
      row.classList.add('sel');
      const b = e.target.closest('.tag-btn');
      if (b) tag(+row.dataset.n, b.dataset.kind);
    });
  });
  $$('.add-item').forEach((b) => b.addEventListener('click', () => {
    m.items.push({ id: uid(), kind: b.dataset.kind, text: '', who: '', time: '', line: null, sub: '', due: '', status: 'open', evidence: '' });
    changed();
    rerender();
    setTimeout(() => { const all = $$(`.item-kind-${b.dataset.kind} .it-text`); if (all.length) all[all.length - 1].focus(); }, 50);
  }));
  $$('.mitem').forEach((card) => {
    const it = m.items.find((i) => i.id === card.dataset.id);
    const on = (sel, ev, fn) => { const el = $(sel, card); if (el) el.addEventListener(ev, () => { fn(el); changed(); }); };
    on('.it-text', 'input', (el) => { it.text = el.value; });
    on('.it-sub', 'change', (el) => { it.sub = el.value; });
    on('.it-due', 'change', (el) => { it.due = el.value; });
    on('.it-status', 'change', (el) => { it.status = el.checked ? 'done' : 'open'; });
    on('.it-ev', 'input', (el) => { it.evidence = el.value.trim().toUpperCase(); });
    on('.it-kind', 'change', (el) => { it.kind = el.value; if (it.line !== null && m.lines[it.line]) m.lines[it.line].tag = el.value; rerender(); });
    const del = $('.it-del', card);
    if (del) del.addEventListener('click', () => {
      if (it.line !== null && m.lines[it.line]) m.lines[it.line].tag = '';
      m.items.splice(m.items.indexOf(it), 1);
      changed();
      rerender();
    });
  });
  VIEWS.meeting.tag = tag;
};
document.addEventListener('keydown', (e) => {
  const { name, arg } = parseHash();
  if (name !== 'meeting' || !canEdit() || (e.target.closest && e.target.closest('input, textarea, select')) || e.ctrlKey || e.metaKey || e.altKey) return;
  const m = P().meetings.find((x) => x.id === arg);
  if (!m || !m.lines.length) return;
  const k = e.key.toLowerCase();
  if (k === 'j' || k === 'k' || e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    selLine = Math.max(0, Math.min(m.lines.length - 1, selLine + (k === 'j' || e.key === 'ArrowDown' ? 1 : -1)));
    $$('.tline.sel').forEach((x) => x.classList.remove('sel'));
    const row = $(`.tline[data-n="${selLine}"]`);
    if (row) { row.classList.add('sel'); row.scrollIntoView({ block: 'nearest' }); }
  } else if (KIND_KEYS[k]) { e.preventDefault(); VIEWS.meeting.tag(selLine, KIND_KEYS[k]); }
  else if (k === 'x') { e.preventDefault(); VIEWS.meeting.tag(selLine, ''); }
});

async function writeMeetingNotes(m) {
  const by = (k) => m.items.filter((i) => i.kind === k && i.text.trim());
  const line = (i) => `${i.text.trim()}${i.who ? ` (${i.who})` : ''}${i.sub ? ` [${i.sub}]` : ''}${i.evidence ? ` – evidence ${i.evidence}` : ''}`;
  const blocks = [
    { type: 'title', text: `Meeting notes – ${m.title}` },
    { type: 'small', text: `${fmtDate(m.date)}${m.attendees ? ' · ' + m.attendees : ''}` },
    { type: 'h1', text: 'Completed' },
    ...(by('done').length ? by('done').map((i) => ({ type: 'p', text: '• ' + line(i) })) : [{ type: 'p', text: 'Nothing recorded.' }]),
    { type: 'h1', text: 'To do and new tasks' },
    by('todo').length ? { type: 'table', rows: [['Task', 'Sub-attribute', 'Due', 'Status'], ...by('todo').map((i) => [i.text.trim() + (i.who ? ` (${i.who})` : ''), i.sub || '', i.due ? fmtDate(i.due) : '', i.status === 'done' ? 'Done' : 'Open'])], widths: [5600, 1300, 1300, 1000] } : { type: 'p', text: 'Nothing recorded.' },
    { type: 'h1', text: 'Teaching from my mentor' },
    ...(by('teaching').length ? by('teaching').map((i) => ({ type: 'p', text: '• ' + line(i) })) : [{ type: 'p', text: 'Nothing recorded.' }]),
  ];
  const safe = `${m.date} ${m.title}`.replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 100);
  const path = `${FOLDERS.meetings}/${safe} - notes.docx`;
  await writeFile(S.own, path, makeDocx(blocks));
  return path;
}

// CPD, following ICE's CPD guidance: a Development Action Plan (objectives with reference codes, after a
// review of learning needs) and a Personal Development Record (activities with effective learning time and
// an evaluation). Exports to Word in the layout of ICE's Appendix A and B templates.

const CPD_TYPES = ['Learning on the job', 'Peer guidance and discussion', 'Employer training or presentation', 'Course', 'Conference, seminar or workshop',
  'ICE or regional event', 'Structured reading', 'Self-study (textbooks, study packs)', 'Online learning or webinar', 'Podcast or video', 'Work shadowing',
  'Site visit', 'Secondment', 'Writing reports or for publication', 'Giving a presentation or lecture', 'Coaching or mentoring others',
  'STEM outreach (schools, careers events)', 'ICE volunteering (reviewer, committee)', 'Research', 'Trade exhibition', 'Qualification (not your academic base)', 'Other'];
const OBJ_STATUS = { active: 'Active', complete: 'Complete', archived: 'Archived' };

const cpd = () => P().cpd;
const objectiveOf = (a) => cpd().objectives.find((o) => o.id === a.objective);
const themes = () => (P().settings.themes || []).map((t) => ({ name: t.replace(/^\*\s*/, '').trim(), mandatory: /^\*/.test(t) })).filter((t) => t.name);

function cpdYears() {
  const ys = new Set(cpd().activities.map((a) => cpdYear(a.dateFrom)).filter((y) => y !== null));
  ys.add(cpdYear(today()));
  return [...ys].sort((a, b) => b - a);
}

VIEWS.cpd = async (arg, q) => {
  const [page, id] = (arg || 'overview').split('/');
  const tabs = [['overview', 'Overview'], ['plan', 'Development plan'], ['record', 'Development record'], ['export', 'Export']];
  const head = `<div class="row spread"><h1>CPD</h1>${canEdit() ? `<div class="row"><button id="addAct" class="primary">+ Record an activity</button></div>` : ''}</div>
    <div class="sub-tabs">${tabs.map(([k, v]) => `<a href="#cpd/${k}" class="${page === k || (page === 'activity' && k === 'record') || (page === 'objective' && k === 'plan') ? 'active' : ''}">${v}</a>`).join('')}</div>`;
  const body = { overview: cpdOverview, plan: cpdPlan, record: cpdRecord, activity: cpdActivity, objective: cpdObjective, export: cpdExport }[page] || cpdOverview;
  return head + body(id, q);
};
VIEWS.cpd.after = (arg, q) => {
  const [page, id] = (arg || 'overview').split('/');
  if ($('#addAct')) $('#addAct').addEventListener('click', () => {
    const a = { id: uid(), ref: '', objective: (cpd().objectives.find((o) => o.ref === 'UNP') || {}).id || '', details: '', theme: '', type: '', dateFrom: today(), dateTo: today(), hours: '',
      learning: '', benefits: '', helped: '', future: '', dap: '', documents: [], subs: [] };
    cpd().activities.push(a);
    changed();
    location.hash = '#cpd/activity/' + a.id;
  });
  ({ activity: afterActivity, objective: afterObjective, plan: afterPlan, export: afterExport, record: afterRecord }[page] || (() => {}))(id, q);
};

function cpdOverview() {
  const years = cpdYears();
  const target = +P().settings.cpdTarget || 30;
  const yr = years[0];
  const acts = cpd().activities.filter((a) => cpdYear(a.dateFrom) === yr);
  const hours = acts.reduce((n, a) => n + (+a.hours || 0), 0);
  const sum = (list, key) => { const out = {}; for (const a of list) { const k = key(a) || '(none)'; out[k] = (out[k] || 0) + (+a.hours || 0); } return Object.entries(out).sort((x, y) => y[1] - x[1]); };
  const warnings = cpd().activities.map((a) => ({ a, w: cpdWarnings(a) })).filter((x) => x.w.length);
  const recent = years.slice(0, 3);
  const mandatory = themes().filter((t) => t.mandatory);
  const covered = (t) => cpd().activities.some((a) => a.theme === t.name && recent.includes(cpdYear(a.dateFrom)));
  const table = (rows) => rows.length ? `<table><tbody>${rows.map(([k, h]) => `<tr><td>${esc(k)}</td><td class="right nowrap">${h} h</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Nothing yet.</p>';
  return `<div class="kpis">${years.slice(0, 4).map((y) => {
      const h = cpd().activities.filter((a) => cpdYear(a.dateFrom) === y).reduce((n, a) => n + (+a.hours || 0), 0);
      return `<div class="kpi"><div class="label">CPD year ${cpdYearLabel(y)}</div><div class="big-number">${h}<small style="font-size:1rem"> / ${target} h</small></div>${meter(h / target, h >= target ? 'good' : '')}</div>`;
    }).join('')}
    <div class="kpi"><div class="label">Objectives</div><div class="big-number">${cpd().objectives.filter((o) => o.status === 'active').length}</div><div class="small muted">active · ${cpd().objectives.filter((o) => o.status === 'complete').length} complete</div></div></div>
    <p class="small muted">ICE asks for at least ${target} hours of effective learning a year up to the Professional Review. Effective learning time is the time you actually learned for, not how long the activity lasted: no more than 6 hours for a day and 30 hours for one activity.</p>
    <div class="grid">
      <div class="card"><h2>${cpdYearLabel(yr)} by objective</h2>${table(sum(acts, (a) => { const o = objectiveOf(a); return o ? `${o.ref} ${o.title || o.area}` : ''; }))}</div>
      <div class="card"><h2>${cpdYearLabel(yr)} by type</h2>${table(sum(acts, (a) => a.type))}</div>
      <div class="card"><h2>${cpdYearLabel(yr)} by CPD Framework theme</h2>${table(sum(acts.filter((a) => a.theme), (a) => a.theme))}
        ${mandatory.length ? `<h3>Mandatory themes, last 3 years</h3>${mandatory.map((t) => `<div>${covered(t) ? '<span class="good">✓</span>' : '<span class="bad">✕</span>'} ${esc(t.name)}</div>`).join('')}` : `<p class="small muted">Add ICE's CPD Framework themes in <a href="#settings">Settings</a> to track them (mark the mandatory ones with *).</p>`}</div>
      <div class="card"><h2>To tidy up</h2>${warnings.length ? `<ul class="list-plain">${warnings.slice(0, 15).map(({ a, w }) => `<li><a href="#cpd/activity/${a.id}">${esc(a.details || '(no details)')}</a><div class="small part">${w.map(esc).join(' · ')}</div></li>`).join('')}</ul>` : '<p class="good">All activities are complete.</p>'}</div>
    </div>`;
}

        ${ed ? '<label class="btn small" style="margin-top:.5rem;color:var(--ink)">Attach a file…<input type="file" id="attach" hidden multiple></label>' : ''}</div>
      ${P().mode !== 'cpd' ? `<div class="card"><h2>${cap1(LABEL.items)}</h2><p class="small muted">Optional: which ${LABEL.items} this learning supports (as Knowledge). To count it as evidence, save the certificate into the Evidence folder and map it there.</p>
        <div>${SUBS.map((s) => `<label style="display:inline;margin:0 .5rem 0 0;color:var(--ink)" title="${esc(s.text)}"><input type="checkbox" class="act-sub" value="${s.id}" ${(a.subs || []).includes(s.id) ? 'checked' : ''}${dis(ed)}> ${s.id}</label>`).join('')}</div></div>` : ''}
      ${ed ? '<button class="danger" id="delAct">Delete this activity</button>' : ''}

}
function afterActivity(id) {
  const a = cpd().activities.find((x) => x.id === id);
  if (!a) return;
  const warn = () => { const w = cpdWarnings(a); $('#actWarn').innerHTML = w.length ? w.map((x) => `<div class="issue warn">${esc(x)}</div>`).join('') : '<p class="good">Complete.</p>'; };
  warn();
  if (!canEdit()) return;
  // A one-day activity keeps To equal to From when From changes.
  let lastFrom = a.dateFrom;
  bindFields($('#main'), a, (key) => {
    if (key === 'dateFrom') {
      if (!a.dateTo || a.dateTo === lastFrom || a.dateTo < a.dateFrom) { a.dateTo = a.dateFrom; $('[data-field=dateTo]').value = a.dateTo; changed(); }
      lastFrom = a.dateFrom;
    }
    warn();
  });
  $$('.act-sub').forEach((b) => b.addEventListener('change', () => { a.subs = $$('.act-sub:checked').map((x) => x.value); changed(); }));
  $$('.doc-del').forEach((b) => b.addEventListener('click', () => { a.documents.splice(+b.dataset.i, 1); changed(); render(); }));
  $('#attach').addEventListener('change', async (e) => {
    const y = cpdYear(a.dateFrom) || new Date().getFullYear();
    for (const file of e.target.files) {
      let path = `${FOLDERS.cpd}/${cpdYearLabel(y).replace('/', '-')}/${file.name}`;
      if (await exists(S.own, path)) path = path.replace(/(\.[^.]+)?$/, ` (${uid().slice(-4)})$1`);
      await writeFile(S.own, path, file);
      a.documents = [...(a.documents || []), path];
    }
    changed();
    toast(`Attached ${plural(e.target.files.length, 'file')}`);
    render();
  });
  $('#delAct').addEventListener('click', async () => {
    if (!(await ask('Delete this activity? Attached files stay in the CPD folder.', 'Delete'))) return;
    cpd().activities.splice(cpd().activities.indexOf(a), 1);
    changed();
    location.hash = '#cpd/record';
  });
}

          ${['strengths', 'weaknesses', 'opportunities', 'threats'].map((k) => `<label>${k[0].toUpperCase() + k.slice(1)}</label><textarea class="rv" data-k="${k}"${dis(ed)}>${esc(r[k] || '')}</textarea>`).join('')}

function afterPlan() {

    changed();
    location.hash = '#cpd/objective/' + o.id;
  });

function afterObjective(id) {

function cpdSelection(year) {
  const acts = cpd().activities.filter((a) => year === 'all' || String(cpdYear(a.dateFrom)) === year).sort((a, b) => (a.dateFrom || '').localeCompare(b.dateFrom || ''));
  const used = new Set(acts.map((a) => a.objective));
  const objs = cpd().objectives.filter((o) => used.has(o.id) || o.status === 'active');
  return { acts, objs, label: year === 'all' ? 'all years' : cpdYearLabel(+year) };
}

async function exportCpdWord(year) {
  const { acts, objs, label } = cpdSelection(year);
  const pr = P().profile;
  const who = [{ type: 'p', text: `Name: ${P().name}` }, { type: 'p', text: `Job role, responsibilities, and engineering sector: ${[pr.jobRole, pr.responsibilities, pr.sector].filter(Boolean).join('; ')}` }];
  const reviews = cpd().reviews.filter((r) => year === 'all' || String(cpdYear(r.date)) === year);
  const blocks = [
    { type: 'title', text: `CPD development action plan (${label})` }, ...who,
    { type: 'h1', text: 'Review of learning needs' },
    ...(reviews.length ? reviews.flatMap((r) => [{ type: 'small', text: fmtDate(r.date) }, ...['strengths', 'weaknesses', 'opportunities', 'threats', 'notes'].filter((k) => r[k]).map((k) => ({ type: 'p', text: `${k === 'notes' ? 'Conclusions' : k[0].toUpperCase() + k.slice(1)}: ${r[k]}` }))]) : [{ type: 'p', text: '' }]),
    { type: 'h1', text: 'Development plan' },
    { type: 'table', widths: [1300, 1100, 2050, 2050, 2050, 2050, 2050, 1400], rows: [['Date', 'Ref', 'In what area do I need to improve my performance?', 'What do I need to learn in order to achieve this?', 'What will I do to achieve this?', 'What are the likely resources and support that I will need?', 'How will I evaluate a successful outcome?', 'What are my deadlines for meeting this target?'],
      ...objs.map((o) => [fmtDate(o.date), o.ref, o.area || o.title, o.learn, o.action, o.resources, o.evaluate, fmtDate(o.deadline)])] },
    { type: 'title', text: `CPD personal development record (${label})` }, ...who,
    { type: 'table', widths: [2400, 1500, 1100, 900, 1700, 1700, 1700, 1700, 1700], rows: [['Details of CPD activity (and ICE CPD Framework theme)', 'Dates', 'Effective learning time', 'Dev. plan ref.', 'Key learning points', 'Key benefits / value added', 'How has this learning activity helped you?', 'How will the learning be used in the future?', 'How will this influence my DAP next year?'],
      ...acts.map((a) => [a.details + (a.theme ? `\nTheme: ${a.theme}` : '') + (a.type ? `\n(${a.type})` : ''), fmtDate(a.dateFrom) + (a.dateTo && a.dateTo !== a.dateFrom ? ' – ' + fmtDate(a.dateTo) : ''), a.hours ? a.hours + ' h' : '', (objectiveOf(a) || {}).ref || '', a.learning, a.benefits, a.helped, a.future, a.dap])] },
    { type: 'small', text: `Total effective learning time: ${acts.reduce((n, a) => n + (+a.hours || 0), 0)} hours.` },
  ];
  const path = `${FOLDERS.exports}/CPD record ${label.replace('/', '-')} ${today()}.docx`;
  await writeFile(S.own, path, makeDocx(blocks, { landscape: true }));
  return path;
}

async function exportCpdExcel(year) {
  const path = `${FOLDERS.exports}/CPD record ${(year === 'all' ? 'all years' : cpdYearLabel(+year)).replace('/', '-')} ${today()}.xlsx`;
  await writeFile(S.own, path, makeXlsx(cpdSheets(year)));

function cpdSheets(year) {

  const w = (s) => ({ v: s, s: 'wrap' });
  return [
    { name: 'Development plan', freeze: { rows: 1 }, filter: true, widths: [12, 8, 30, 30, 30, 30, 30, 12, 10],

      rows: [['From', 'To', 'Details of CPD activity', 'Type', 'CPD Framework theme', 'Hours', 'Plan ref.', 'Key learning points', 'Key benefits', 'How it helped', 'Future use', 'Influence on DAP'],
        ...acts.map((a) => [a.dateFrom, a.dateTo, w(a.details), a.type, a.theme, +a.hours || 0, (objectiveOf(a) || {}).ref || '', w(a.learning), w(a.benefits), w(a.helped), w(a.future), w(a.dap)])] },
  ];
}

// ---------- Excel matrix ----------
async function exportMatrix() {
  await scanEvidence();
  await loadReports();
  const items = evidenceItems().filter((i) => !i.missing).sort((a, b) => natural(a.code || 'zz' + a.title, b.code || 'zz' + b.title));
  const cov = coverage();
  const prr = prrBySub();
  const fb = feedbackItems();
  const levelCell = (it, sub) => { const ls = ((it.rec && it.rec.maps) || []).filter((m) => m.sub === sub).map((m) => LEVEL_SHORT[m.level]); return ls.length ? { v: ls.sort().join(''), s: 'good' } : ''; };
  const g = goal();
  const status = (n) => ({ v: `${n}/${g}`, s: n >= g ? 'good' : n ? 'part' : 'none' });
  const sheets = [
    { name: 'Evidence Matrix', freeze: { rows: 1, cols: 2 }, filter: true, widths: [9, 40, 22, 11, ...SUBS.map(() => 5), 18, 40],
      rows: [['Code', 'Title', 'Project', 'Date', ...SUBS.map((a) => a.id), 'KSBs', 'File'],
        ...items.map((it) => [it.code, it.title, (it.rec && it.rec.project) || '', (it.rec && it.rec.date) || '', ...SUBS.map((a) => levelCell(it, a.id)),
          [...new Set(((it.rec && it.rec.maps) || []).flatMap((m) => m.ksbs || []))].sort(natural).join(', '), it.path])] },
    { name: 'Summary', freeze: { rows: 1 }, filter: true, widths: [6, 30, 6, 60, ...LEVELS.map(() => 7), 10, 12, 10, 14, 40],
      rows: [['Attr.', 'Attribute', 'Sub', cap1(LABEL.item), ...LEVELS.map((l) => LEVEL_SHORT[l]), 'Slots', 'PRR', 'Open comments', 'Mentor', 'Evidence'],
        ...SUBS.map((a) => [a.group, a.group_title, a.id, { v: a.text, s: 'wrap' }, ...LEVELS.map((l) => status(cov[a.id][l].length)),
          `${slots(cov[a.id])}/${slotMax(cov[a.id])}`, prr[a.id].state, fb.filter((f) => f.sub === a.id && f.status === 'open').length, M() ? MENTOR_STATUS[(M().subs[a.id] || {}).status || ''] : '',
          [...new Set(LEVELS.flatMap((l) => cov[a.id][l].map(label)))].sort(natural).join(', ')])] },
    { name: 'KSBs', freeze: { rows: 1 }, widths: [6, 80, 16, 30, 22], rows: [['KSB', 'Description', cap1(LABEL.items), 'Evidence (ticked)', 'My rating'],
      ...KSBS.map((k) => { const c = ksbCoverage()[k.id]; return [k.id, { v: k.text, s: 'wrap' }, k.attributes.join(', '), [...c.direct].map(label).join(', '), ratingText(k.id)]; })] },
    { name: 'Mentor feedback', freeze: { rows: 1 }, filter: true, widths: [6, 16, 12, 60, 60, 12, 30], rows: [['Sub', 'From', 'Date', 'Comment', 'Response', 'Status', 'File'],
      ...fb.map((f) => [f.sub, f.author, (f.date || '').slice(0, 10), { v: f.text, s: 'wrap' }, { v: f.response, s: 'wrap' }, FB_STATUS[f.status], f.file])] },
    { name: 'Actions', freeze: { rows: 1 }, filter: true, widths: [12, 30, 70, 6, 12, 8], rows: [['Meeting', 'Title', 'Action', 'Sub', 'Due', 'Status'],
      ...allActions().map((a) => [a.meeting.date, a.meeting.title, { v: a.text, s: 'wrap' }, a.sub, a.due, a.status === 'done' ? 'Done' : 'Open'])] },
    ...cpdSheets('all'),
  ];
  const path = `${FOLDERS.matrix}/ICE evidence matrix ${today()}.xlsx`;
  await writeFile(S.own, path, makeXlsx(sheets));
  return path;
}

// Give back an earlier daily copy from ice-data/backups. The current data is saved beside the backups first.
async function restoreFromBackup() {
  if (demoBlocked()) return;
  const base = isMentor() ? 'mentor' : 'portfolio';
  const names = [];
  try {
    const dir = await subDir(S.own, `${DATA_DIR}/backups`);
    for await (const [name, h] of dir.entries()) if (h.kind === 'file' && name.startsWith(base + '-') && name.endsWith('.json')) names.push(name);
  } catch (_) { /* no folder yet */ }
  names.sort().reverse();
  if (!names.length) { toast('There are no backups yet. One is made the first time you save each day.'); return; }
  const nice = (n) => n.replace(base + '-', '').replace('.json', '');
  const rows = [];
  for (const n of names.slice(0, 30)) {
    let info = '';
    try {
      const { json } = await readJson(S.own, `${DATA_DIR}/backups/${n}`);
      const d = upgrade(json);
      const cpd = ((d.cpd && d.cpd.activities) || []).length;
      info = d.mode === 'cpd' ? `${cpd} CPD activities` : `${Object.keys(d.evidence).length} evidence records, ${(d.meetings || []).length} meetings, ${cpd} CPD activities`;
    } catch (_) { info = 'cannot be read'; }
    rows.push(`<li><b>${esc(nice(n))}</b> <span class="small muted">${esc(info)}</span> <button data-restore="${esc(n)}">Restore this one</button></li>`);
  }
  const d = dialog(`<h2>Restore from a backup</h2><p class="small muted">A copy is made the first time you save each day, and the last 30 are kept. Pick the day you want to go back to.</p>
    <ul class="list-plain restore-list">${rows.join('')}</ul><div class="row" style="justify-content:flex-end;margin-top:1rem"><button value="" id="restoreClose">Close</button></div>`);
  $$('button', d).forEach((b) => b.addEventListener('click', async () => {
    if (!b.dataset.restore) { d.close(); return; }
    if (!(await ask(`Go back to the copy from <b>${esc(nice(b.dataset.restore))}</b>? Anything you changed since then is replaced. A copy of your current data is kept first.`, 'Restore'))) return;
    try {
      const { json } = await readJson(S.own, `${DATA_DIR}/backups/${b.dataset.restore}`);
      const restored = upgrade(json);
      const stamp = new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-');
      await writeFile(S.own, `${DATA_DIR}/backups/${base}-${stamp}-before-restore.json`, JSON.stringify(S.data, null, 1));
      S.data = restored;
      applyFramework(P() && P().framework);
      await save(true);
      await scanEvidence();
      await loadReports();
      d.close();
      await render();
      toast('Restored. Your previous data is kept in the backups folder.');
    } catch (err) { toast('Could not restore: ' + err.message, 'error'); }
  }));
}

  const val = (id) => $(id).value;

    $('#fwName').value = fw.name; $('#fwLabelAttr').value = (fw.labels || {}).attr || 'Attributes'; $('#fwLabelKsb').value = (fw.labels || {}).ksb || 'KSBs';
    { const il = itemLabels(fw.labels); $('#fwLabelItem').value = il.item; $('#fwLabelItems').value = il.items; }

  };
  const read = () => {
    const folders = {};
    for (const i of $$('[data-folder]')) folders[i.dataset.folder] = i.value;
    return buildFramework({ name: val('#fwName'), labelAttr: val('#fwLabelAttr'), labelKsb: val('#fwLabelKsb'), labelItem: val('#fwLabelItem'), labelItems: val('#fwLabelItems'), levels: val('#fwLevels'), groups: val('#fwGroups'), attributes: val('#fwAttrs'), ksbs: val('#fwKsbs'), evidenceFolders: val('#fwEvFolders'), folders }, FRAMEWORK);

    a.href = URL.createObjectURL(new Blob([JSON.stringify({ format: 'ice-tool/framework-1', ...fw }, null, 1)], { type: 'application/json' }));
    a.download = `${slug(fw.name) || 'framework'}.json`;
    a.click();

  });
  if ($('#fwImport')) {
    $('#fwImport').addEventListener('click', () => $('#fwFile').click());

      try {
        const fw = JSON.parse(await e.target.files[0].text());

      } catch (err) { toast(err.message, 'error'); }
      e.target.value = '';
    });
  }

    const fw = read();
    P().framework = fw;
    delete P().folderMap;   // the boxes showed the folder names in use, so they are now part of the framework
    FOLDER_MAP = null;
    applyFramework(fw);
    await ensureFolders(S.own, P().mode);
    changed();
    await save();
    await scanEvidence();
    await loadReports();
    await render();
  }, 'Framework saved'));
};

// ---------- engine ----------
let T = null;                 // the running tour, or null
let tourRenderTick = 0, tourLastMut = 0;
const tval = (x) => (typeof x === 'function' ? x() : x);
const tsleep = (ms) => new Promise((r) => setTimeout(r, ms));
const tourHashName = () => { try { return parseHash().name; } catch (_) { return ''; } };

function tourFindTarget(step) {
  for (const s of step.sel || []) { const el = typeof s === 'function' ? s() : tq(s); if (el && tourVisible(el)) return el; }
  return null;
}
async function tourWaitTarget(step, ms = 2200) {
  const end = Date.now() + ms;
  for (;;) {
    const el = tourFindTarget(step);
    if (el) return el;
    if (Date.now() > end || !T) return null;
    await tsleep(80);
  }
}
async function tourGoPage(page) {
  if (tourHashName() === page) return;
  const tick = tourRenderTick;
  const t = T;
  if (!t) return;
  t.nav = true;
  location.hash = '#' + page;
  const end = Date.now() + 3000;
  while (Date.now() < end && !(tourRenderTick > tick && Date.now() - tourLastMut > 150)) await tsleep(50);
  t.nav = false;
}

function tourBuild() {
  const hole = document.createElement('div'); hole.className = 'tour-hole none'; hole.setAttribute('aria-hidden', 'true');
  const pop = document.createElement('div'); pop.className = 'tour-pop'; pop.setAttribute('role', 'dialog'); pop.setAttribute('aria-modal', 'false');
  pop.setAttribute('aria-labelledby', 'tourTitle'); pop.setAttribute('aria-describedby', 'tourText'); pop.tabIndex = -1;
  pop.innerHTML = '<h2 id="tourTitle"></h2><p id="tourText"></p><div class="tour-foot"><span class="tour-count" id="tourCount"></span>'
    + '<button type="button" id="tourBack">Back</button><button type="button" class="primary" id="tourNext">Next</button>'
    + '<button type="button" id="tourAction" hidden></button><button type="button" class="tour-skip" id="tourSkip">Skip tour</button></div>';
  let live = $('#tourLive');
  if (!live) { live = document.createElement('div'); live.id = 'tourLive'; live.className = 'tour-live'; live.setAttribute('role', 'status'); live.setAttribute('aria-live', 'polite'); document.body.append(live); }
  document.body.append(hole, pop);
  $('#tourBack', pop).addEventListener('click', () => tourStep(-1));
  $('#tourNext', pop).addEventListener('click', () => tourStep(1));
  $('#tourSkip', pop).addEventListener('click', () => tourStop('skipped'));
  $('#tourAction', pop).addEventListener('click', async () => {
    const a = T && T.steps[T.idx].action;
    if (a) { T.nav = true; go(a.hash); T.nav = false; }
    tourStep(1);
  });
  return { hole, pop, live };
}

function tourPlace() {
  if (!T || !T.pop) return;
  const { hole, pop } = T;
  const vw = innerWidth, vh = innerHeight, narrow = vw <= 640;
  let el = T.target;
  if (el && !tourVisible(el)) { el = T.target = tourFindTarget(T.steps[T.idx]); }
  if (!el) {
    hole.className = 'tour-hole none'; hole.removeAttribute('style');
    if (!narrow) { pop.style.left = Math.max(8, (vw - pop.offsetWidth) / 2) + 'px'; pop.style.top = Math.max(8, (vh - pop.offsetHeight) / 3) + 'px'; }
    return;
  }
  const r = el.getBoundingClientRect(), pad = 4;
  hole.className = 'tour-hole';
  Object.assign(hole.style, { left: r.left - pad + 'px', top: r.top - pad + 'px', width: r.width + pad * 2 + 'px', height: r.height + pad * 2 + 'px' });
  if (narrow) return;
  const w = pop.offsetWidth, h = pop.offsetHeight, gap = 14;
  let top, left = Math.min(Math.max(r.left, 8), vw - w - 8);
  if (r.bottom + pad + gap + h <= vh - 8) top = r.bottom + pad + gap;
  else if (r.top - pad - gap - h >= 8) top = r.top - pad - gap - h;
  else if (r.right + pad + gap + w <= vw - 8) { left = r.right + pad + gap; top = Math.min(Math.max(r.top, 8), vh - h - 8); }
  else if (r.left - pad - gap - w >= 8) { left = r.left - pad - gap - w; top = Math.min(Math.max(r.top, 8), vh - h - 8); }
  else top = Math.max(8, vh - h - 8);
  pop.style.left = left + 'px'; pop.style.top = top + 'px';
}
let tourRaf = 0;
const tourSchedule = () => { if (!tourRaf) tourRaf = requestAnimationFrame(() => { tourRaf = 0; tourPlace(); }); };

// Show step i (moving in direction dir), skipping steps whose target is missing.
async function tourShow(i, dir) {
  const my = ++T.token;
  const stepsN = T.steps.length;
  for (; i >= 0 && i < stepsN; i += dir) {
    const step = T.steps[i];
    if (step.page) { await tourGoPage(step.page); if (!T || T.token !== my) return; }
    let el = null;
    if (step.sel) { el = await tourWaitTarget(step); if (!T || T.token !== my) return; if (!el) continue; }
    T.idx = i; T.target = el;
    tourRender(step, el);
    return;
  }
  if (dir > 0) tourStop('done');
  else if (T.idx < 0 || T.idx >= stepsN) tourStop('done');   // nothing earlier: stay on the current step
}

function tourRender(step, el) {
  const { pop, live } = T;
  const title = tval(step.title), text = tval(step.text), n = T.idx + 1, total = T.steps.length;
  $('#tourTitle', pop).textContent = title;
  $('#tourText', pop).textContent = text;
  $('#tourCount', pop).textContent = `Step ${n} of ${total}`;
  $('#tourBack', pop).hidden = n === 1;
  $('#tourNext', pop).textContent = n === total ? 'Finish' : 'Next';
  const act = $('#tourAction', pop);
  act.hidden = !step.action; act.textContent = step.action ? step.action.label : '';
  live.textContent = '';
  setTimeout(() => { if (T) live.textContent = `Step ${n} of ${total}: ${title}`; }, 30);
  if (T.key === 'main') tourWrite((s) => { s.main = n; });
  if (el && !el.closest('#top')) {
    const tall = el.getBoundingClientRect().height > innerHeight * 0.6;
    try { el.scrollIntoView({ block: innerWidth <= 640 || tall ? 'start' : 'center', behavior: 'instant' }); } catch (_) { el.scrollIntoView(); }
  }
  tourPlace();
  pop.focus({ preventScroll: true });
  tourSchedule();
}

function tourStep(dir) { if (T) tourShow(T.idx + dir, dir); }

function tourStop(how) {
  if (!T) return;
  const t = T; T = null;
  t.token++;
  document.removeEventListener('keydown', tourKeys, true);
  window.removeEventListener('resize', tourSchedule);
  window.removeEventListener('scroll', tourSchedule, true);
  window.removeEventListener('hashchange', tourHash);
  if (t.hole) t.hole.remove();
  if (t.pop) t.pop.remove();
  if (how === 'done' || how === 'skipped') {
    tourWrite((s) => { if (t.key === 'main') s.main = how; else s.pages[t.key] = how; });
  }
  let back = t.launcher && t.launcher.isConnected ? t.launcher : null;
  if (!back) back = $('#tourBtn');
  if (!back) { const h = $('#main h1'); if (h) { h.tabIndex = -1; back = h; } }
  if (back) back.focus({ preventScroll: true });
  const live = $('#tourLive');
  if (live) live.textContent = how === 'done' ? 'Tour finished' : 'Tour closed';
  tourDecorate();
}

async function tourStart(key = 'main', from = 0, launcher) {
  if (!S.data) return false;
  if (!TOURS[key]) return false;
  if (T) tourStop('closed');
  const steps = TOURS[key].steps;
  T = { key, steps, idx: -1, token: 0, nav: false, target: null, launcher: launcher || (document.activeElement !== document.body ? document.activeElement : null) };
  Object.assign(T, tourBuild());
  document.addEventListener('keydown', tourKeys, true);
  window.addEventListener('resize', tourSchedule);
  window.addEventListener('scroll', tourSchedule, true);
  window.addEventListener('hashchange', tourHash);
  const offer = $('.tour-offer'); if (offer) offer.remove();
  await tourShow(Math.max(0, Math.min(from, steps.length - 1)), 1);
  return true;
}

function tourKeys(e) {
  if (!T) return;
  const pop = T.pop, inPop = pop.contains(document.activeElement);
  if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); tourStop('closed'); return; }
  if (e.key === 'Tab' && inPop) {
    const f = $$('button', pop).filter((b) => !b.hidden && !b.disabled);
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (document.activeElement === pop) { e.preventDefault(); (e.shiftKey ? last : first).focus(); }
    else if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    return;
  }
  if ((e.key === 'Enter' || e.key === ' ') && document.activeElement === pop) { e.preventDefault(); tourStep(1); return; }
  const t = e.target;
  const typing = t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
  if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && !typing && !e.ctrlKey && !e.metaKey && !e.altKey && !e.shiftKey) {
    e.preventDefault(); tourStep(e.key === 'ArrowRight' ? 1 : -1);
  }
}

// The user moved to another page by themselves: carry on if it is where the next step lives, otherwise pause the tour.
function tourHash() {
  if (!T || T.nav) return;
  const name = tourHashName(), cur = T.steps[T.idx], next = T.steps[T.idx + 1];
  if (cur && (!cur.page || cur.page === name)) return;
  if (next && next.page === name) tourStep(1);
  else tourStop('closed');
}

// ---------- entry points, injected after every render ----------
function tourStatus() { const s = tourRead(); return { main: s.main, resume: typeof s.main === 'number' && s.main > 1 && s.main <= TOURS.main.steps.length ? s.main : 0 }; }

function tourDecorate() {
  const main = $('#main');
  if (!main || !S.data || !P() || $('.tour-link', main) || $('.tour-offer', main)) return;

  const h1 = $('h1', main);

  if (top.parentElement !== main) return;

    const card = document.createElement('div');

    card.innerHTML = resume

      : '<p><b>Want a two-minute walk-through?</b> It shows the first things to do, and you can stop at any time.</p><div class="row"><button type="button" class="primary" data-tour-start="main">Show me around</button><button type="button" data-tour-dismiss>Not now</button></div>';

    top.after(p);
  } else if (TOUR_PAGES.includes(name) && TOURS[name]) {

}

// Add evidence files from the Evidence page: pick files (or drop them on the page), choose the kind of evidence,
// and the tool copies them into the right folder of your own OneDrive folder, with the next free code in the name.

async function addEvidenceFiles(fileList) {
  const files = [...fileList].filter((f) => f && f.size !== undefined && f.name);
  if (!files.length) return;
  if (!canEdit() || demoBlocked()) return;
  const cats = EVIDENCE_CATEGORIES.length ? EVIDENCE_CATEGORIES : [''];
  const needCode = files.some((f) => !codeFromName(f.name));
  const d = dialog(`<h2>Add ${plural(files.length, 'file')} to your evidence</h2>
    <p class="small muted">The files are copied into your evidence folder in OneDrive. The originals are not moved or changed.</p>
    <ul class="list-plain add-list">${files.slice(0, 12).map((f) => `<li>${esc(f.name)} <span class="small muted">${esc(fmtSize(f.size))}</span></li>`).join('')}${files.length > 12 ? `<li class="muted">and ${files.length - 12} more</li>` : ''}</ul>
    <label for="addKind">What kind of evidence is this?</label>
    <select id="addKind">${cats.map((c) => `<option value="${esc(c)}">${esc(c || '(top level)')}</option>`).join('')}</select>
    ${needCode ? '<label class="check"><input type="checkbox" id="addCode" checked> Put the next free code at the start of each file name (for example CO-15)</label>' : ''}
    <div class="row" style="justify-content:flex-end;margin-top:1rem"><button value="no" id="addCancel">Cancel</button><button class="primary" id="addGo">Add</button></div>`);
  $('#addCancel', d).addEventListener('click', () => d.close());
  $('#addGo', d).addEventListener('click', async () => {
    const kind = $('#addKind', d).value;
    const withCode = !!($('#addCode', d) && $('#addCode', d).checked);
    const goBtn = $('#addGo', d);
    goBtn.disabled = true;
    goBtn.textContent = 'Adding…';
    try {
      const prefix = categoryPrefix(kind) || 'EV';
      const used = evidenceItems().map((i) => i.code).filter((c) => c && c.startsWith(prefix + '-')).map((c) => +c.split('-')[1]);
      let next = used.length ? Math.max(...used) + 1 : 0;
      let added = 0;
      for (const f of files) {
        let name = f.name.replace(/[\\/:*?"<>|]/g, '_');
        if (withCode && !codeFromName(name)) name = `${prefix}-${String(next++).padStart(2, '0')} ${name}`;
        const base = `${FOLDERS.evidence}${kind ? '/' + kind : ''}`;
        let path = `${base}/${name}`;
        for (let n = 2; await exists(S.own, path); n++) path = `${base}/${name.replace(/(\.[^.]*)?$/, ` (${n})$1`)}`;
        await writeFile(S.own, path, f);
        added++;
      }
      d.close();
      await scanEvidence();
      await render();
      toast(`${plural(added, 'file')} added to your evidence`);
    } catch (err) {
      goBtn.disabled = false;
      goBtn.textContent = 'Add';
      toast('Could not add the files: ' + err.message, 'error');
    }
  });
}

function pickEvidenceFiles() {
  const input = document.createElement('input');
  input.type = 'file';
  input.multiple = true;
  input.addEventListener('change', () => { if (input.files.length) addEvidenceFiles(input.files); });
  input.click();
}

// Drag files from Explorer onto the Evidence page.
(() => {
  const onEvidence = () => /^#evidence(\?|$)/.test(location.hash) && S.data && canEdit() && P() && P().mode !== 'cpd';
  const hasFiles = (e) => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
  document.addEventListener('dragover', (e) => { if (onEvidence() && hasFiles(e)) { e.preventDefault(); document.body.classList.add('dropping'); } });
  document.addEventListener('dragleave', (e) => { if (!e.relatedTarget) document.body.classList.remove('dropping'); });
  document.addEventListener('drop', (e) => {

    e.preventDefault();
    addEvidenceFiles(e.dataTransfer.files);
  });
})();

// Phone layout for tables: on a narrow screen each table row becomes a small card, with the column name shown beside
// each value. The column names are copied from the table header after every render, so no page needs changing.

function labelTableCells(root) {
  for (const table of $$('table', root)) {
    if (table.dataset.cards === 'off') continue;
    const heads = $$('thead th', table).map((th) => th.textContent.trim());
    if (!heads.length) continue;
    table.classList.add('cardable');
    for (const tr of $$('tbody tr', table)) {
      let i = 0;
      for (const td of tr.children) {
        if (td.tagName !== 'TD' && td.tagName !== 'TH') continue;
        if (!td.hasAttribute('data-label') && heads[i]) td.setAttribute('data-label', heads[i]);
        i += td.colSpan || 1;
      }
    }
  }
}

// Self-rating per KSB: P().ksbRatings = { "<ksb id>": [ { date, rating } ] }, rating 1-5, one entry per day.
const RATING_LABELS = ['', 'Not yet', 'Starting', 'Getting there', 'Confident', 'Could teach it'];
const ratingHist = (id) => (((P() || {}).ksbRatings || {})[id] || []).filter((r) => r && r.rating >= 1 && r.rating <= 5).sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0));
const ratingLatest = (id) => ratingHist(id).slice(-1)[0] || null;
function ratingTrend(id) {
  const h = ratingHist(id);
  if (h.length < 2) return '';
  const prev = h[h.length - 2];
  return `was ${prev.rating} on ${fmtDate(prev.date)}`;
}
function ratingText(id) {
  const r = ratingLatest(id);
  return r ? `${r.rating} ${RATING_LABELS[r.rating]} (${r.date})` : '';
}
function ratingCell(k) {
  const r = ratingLatest(k.id), tr = ratingTrend(k.id);
  const note = r ? `<div class="small muted">${esc(RATING_LABELS[r.rating])}, ${esc(fmtDate(r.date))}${tr ? ' · ' + esc(tr) : ''}</div>` : '<div class="small muted">Not rated</div>';
  if (isMentor()) return r ? `<b>${r.rating} of 5</b>${note}` : note;
  return `<select class="rate-sel" data-k="${esc(k.id)}" aria-label="My rating for ${esc(k.id)}"><option value="">Not rated</option>${[1, 2, 3, 4, 5].map((n) => `<option value="${n}" ${r && r.rating === n ? 'selected' : ''}>${n} – ${RATING_LABELS[n]}</option>`).join('')}</select>${note}`;
}
function ratingSummary() {
  if (!P() || !KSBS.length) return '';
  const link = (k) => `<a href="#ksbs?k=${encodeURIComponent(k.id)}">${esc(k.id)}</a>`;
  const rated = KSBS.filter((k) => ratingLatest(k.id));
  const unrated = KSBS.filter((k) => !ratingLatest(k.id));
  let t = `<b>Rated ${rated.length} of ${KSBS.length}.</b>`;
  if (rated.length) {
    const m = Math.min(...rated.map((k) => ratingLatest(k.id).rating));
    t += ` Lowest rated (${m} of 5): ${rated.filter((k) => ratingLatest(k.id).rating === m).slice(0, 5).map(link).join(', ')}.`;
  }
  if (unrated.length) t += ` Not rated yet: ${unrated.slice(0, 5).map(link).join(', ')}${unrated.length > 5 ? ' and ' + (unrated.length - 5) + ' more' : ''}.`;
  return `<p class="rate-summary" role="status">${t}</p>`;
}
function ratingAfter() {
  $$('.rate-sel').forEach((sel) => sel.addEventListener('change', () => {
    const id = sel.dataset.k, n = +sel.value, d = P();
    if (!d) return;
    d.ksbRatings = d.ksbRatings || {};
    const h = (d.ksbRatings[id] = d.ksbRatings[id] || []);
    const i = h.findIndex((r) => r.date === today());
    if (!n) { if (i >= 0) h.splice(i, 1); } else if (i >= 0) h[i].rating = n; else h.push({ date: today(), rating: n });
    if (!h.length) delete d.ksbRatings[id];
    changed();
    render().then(() => { const s = $(`.rate-sel[data-k="${CSS.escape(id)}"]`); if (s) s.focus(); });
  }));
}

// Bottom tab bar (phones first, desktop too): the most used pages sit in a bar fixed at the bottom of the screen,
// within thumb reach and clear of desktop notifications; every other page is in a "More" sheet that opens above the
// bar. ARIA: a tablist of link tabs (aria-selected, aria-current="page" on the open page), arrow keys / Home / End
// move between tabs, Space or Enter opens one. The sheet is a non-modal dialog: focus moves into it, Up/Down move
// between its links, Esc (or a click outside, or Tab past the end) closes it and focus goes back to "More".

let tabbarRefocus = false;   // a page was opened from the bar or sheet: focus the new page's tab after the re-render
const TABBAR_SLOTS = 4;   // pages in the bar itself; "More" makes the fifth
// Which pages earn a place in the bar, most used first (the bar then keeps the usual page order).
const TAB_PRIORITY = ['home', 'evidence', 'attributes', 'reports', 'cpd', 'feedback', 'meetings', 'mentor', 'ksbs', 'settings', 'help'];
const TAB_PRIORITY_MENTOR = ['home', 'evidence', 'mentor', 'reports', 'feedback', 'attributes', 'meetings', 'ksbs', 'cpd', 'settings', 'help'];

const TAB_ICONS = {
  home: '<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 9.5V20h5v-6h3v6h5V9.5"/>',
  evidence: '<path d="M3 6.5A1.5 1.5 0 0 1 4.5 5H9l2 2h8.5A1.5 1.5 0 0 1 21 8.5v10a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 18.5z"/>',
  attributes: '<path d="m4 7 2 2 3.5-3.5"/><path d="M12 7.5h8"/><path d="m4 15 2 2 3.5-3.5"/><path d="M12 15.5h8"/>',
  ksbs: '<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>',
  reports: '<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 17h7"/>',
  feedback: '<path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12.5h5"/>',
  meetings: '<rect x="3.5" y="5" width="17" height="15" rx="1.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  mentor: '<circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.6-5.5 7-5.5s6.2 1.9 7 5.5"/>',
  cpd: '<path d="M2.5 9 12 4.5 21.5 9 12 13.5z"/><path d="M6.5 11v5c1.5 1.6 3.4 2.4 5.5 2.4s4-.8 5.5-2.4v-5"/>',
  settings: '<path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/>',
  help: '<circle cx="12" cy="12" r="8.5"/><path d="M9.6 9.5a2.5 2.5 0 1 1 3.4 2.3c-.7.3-1 .8-1 1.5v.7"/><circle cx="12" cy="17" r=".6"/>',
  more: '<circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/>',
};
const tabIcon = (id) => `<svg class="tab-icon" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">${TAB_ICONS[id] || TAB_ICONS.more}</svg>`;

// Split the pages into the bar and the More sheet. The bar takes the highest-priority pages that are unlocked
// (see tabUnlocked), in the usual page order; everything else, locked pages included, goes under More.
function tabbarSplit(active) {
  const { shown } = tabsShown(active);
  const all = tabsFor();
  const order = isMentor() ? TAB_PRIORITY_MENTOR : TAB_PRIORITY;
  const rank = (id) => { const i = order.indexOf(id); return i < 0 ? 99 : i; };
  // When everything fits (CPD-only record: three pages) there is no More at all.
  if (all.length <= TABBAR_SLOTS + 1) return { bar: all, more: [] };
  const pick = new Set(shown.filter((t) => t[0] !== active || tabUnlocked(t[0])).slice().sort((a, b) => rank(a[0]) - rank(b[0])).slice(0, TABBAR_SLOTS).map((t) => t[0]));
  return { bar: all.filter((t) => pick.has(t[0])), more: all.filter((t) => !pick.has(t[0])) };
}

function renderTabbar(active, openFb = 0) {
  const nav = $('#tabbar'), sheet = $('#moreSheet');
  if (!nav || !sheet) return;
  // Keyboard users keep their place: if focus was in the bar or sheet, put it back on the open page's tab after.
  const hadFocus = tabbarRefocus || nav.contains(document.activeElement) || sheet.contains(document.activeElement);
  tabbarRefocus = false;
  closeMoreSheet(false);
  if (!S.data || !tabsFor().length) {
    nav.innerHTML = ''; sheet.innerHTML = ''; nav.hidden = true;
    document.body.classList.remove('has-tabbar');
    return;
  }
  const { bar, more } = tabbarSplit(active);
  const inMore = more.some((t) => t[0] === active);
  const count = (id) => (id === 'feedback' && openFb ? `<span class="count" title="open comments"><span class="sr-only">, </span>${openFb}<span class="sr-only"> open</span></span>` : '');
  const anyActive = bar.some((t) => t[0] === active) || inMore;
  const tab = ([id, name], i) => {
    const on = active === id || (!anyActive && i === 0);
    return `<a role="tab" href="#${id}" data-tab="${id}" class="${active === id ? 'active' : ''}" aria-selected="${active === id}"${active === id ? ' aria-current="page"' : ''} tabindex="${on ? 0 : -1}" title="${esc(name)}">${tabIcon(id)}<span class="tab-label">${esc(name)}</span>${count(id)}</a>`;
  };
  nav.hidden = false;
  nav.innerHTML = `<div class="tabbar-in" role="tablist" aria-label="Main pages" aria-orientation="horizontal">${bar.map(tab).join('')}${more.length
    ? `<button type="button" role="tab" id="moreBtn" class="${inMore ? 'active' : ''}" aria-selected="${inMore}" aria-haspopup="dialog" aria-expanded="false" aria-controls="moreSheet" tabindex="${inMore ? 0 : -1}">${tabIcon('more')}<span class="tab-label">More</span>${inMore ? `<span class="sr-only">, now on ${esc(more.find((t) => t[0] === active)[1])}</span>` : ''}${more.some((t) => t[0] === 'feedback') ? count('feedback') : ''}</button>`
    : ''}</div>`;
  sheet.innerHTML = more.length ? `<h2 id="moreTitle">More pages</h2><ul>${more.map(([id, name]) => `<li><a href="#${id}" data-tab="${id}" class="${active === id ? 'active' : ''}"${active === id ? ' aria-current="page"' : ''}>${tabIcon(id)}<span>${esc(name)}</span>${count(id)}</a></li>`).join('')}</ul>` : '';
  document.body.classList.add('has-tabbar');
  if (hadFocus) { const t = $('[role=tab][tabindex="0"]', nav); if (t) t.focus({ preventScroll: true }); }
}

function moreSheetOpen() { const s = $('#moreSheet'); return !!s && !s.hidden; }
function openMoreSheet() {
  const sheet = $('#moreSheet'), btn = $('#moreBtn');
  if (!sheet || !btn || !sheet.innerHTML) return;
  sheet.hidden = false;
  btn.setAttribute('aria-expanded', 'true');
  const first = $('a.active', sheet) || $('a', sheet);
  if (first) first.focus({ preventScroll: true });
}
function closeMoreSheet(refocus = true) {
  const sheet = $('#moreSheet'), btn = $('#moreBtn');
  if (!sheet || sheet.hidden) return;
  sheet.hidden = true;
  if (btn) { btn.setAttribute('aria-expanded', 'false'); if (refocus) btn.focus({ preventScroll: true }); }
}

document.addEventListener('click', (e) => {
  const t = e.target.closest ? e.target : null;
  if (!t) return;
  if (t.closest('#moreBtn')) { if (moreSheetOpen()) closeMoreSheet(); else openMoreSheet(); return; }
  if (t.closest('#tabbar a[role=tab]')) { tabbarRefocus = true; return; }
  const link = t.closest('#moreSheet a');
  if (link) {
    tabbarRefocus = true;
    closeMoreSheet(false);
    // Already on that page: the hash does not change, so just put focus back on More.
    if (location.hash === link.getAttribute('href')) { e.preventDefault(); tabbarRefocus = false; if ($('#moreBtn')) $('#moreBtn').focus(); }
    return;
  }
  if (moreSheetOpen() && !t.closest('#moreSheet')) closeMoreSheet(false);
});

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && moreSheetOpen()) { e.preventDefault(); e.stopPropagation(); closeMoreSheet(); return; }
  const tab = e.target.closest && e.target.closest('#tabbar [role=tab]');
  if (tab) {
    const tabs = $$('#tabbar [role=tab]');
    const i = tabs.indexOf(tab);
    let j = -1;
    if (e.key === 'ArrowRight') j = (i + 1) % tabs.length;
    else if (e.key === 'ArrowLeft') j = (i - 1 + tabs.length) % tabs.length;
    else if (e.key === 'Home') j = 0;
    else if (e.key === 'End') j = tabs.length - 1;
    else if (e.key === ' ' && tab.tagName === 'A') { e.preventDefault(); tab.click(); return; }
    else if (e.key === 'ArrowUp' && tab.id === 'moreBtn') { e.preventDefault(); openMoreSheet(); return; }
    if (j < 0) return;
    e.preventDefault();
    tabs.forEach((t, k) => { t.tabIndex = k === j ? 0 : -1; });
    tabs[j].focus();
    return;
  }
  const link = e.target.closest && e.target.closest('#moreSheet a');
  if (link && (e.key === 'ArrowDown' || e.key === 'ArrowUp' || e.key === 'Home' || e.key === 'End')) {
    const links = $$('#moreSheet a');
    const i = links.indexOf(link);
    const j = e.key === 'Home' ? 0 : e.key === 'End' ? links.length - 1 : e.key === 'ArrowDown' ? (i + 1) % links.length : (i - 1 + links.length) % links.length;
    e.preventDefault();
    links[j].focus();
  }
});

// Tabbing out of the sheet closes it (it is not modal), unless focus went back to the More button.
document.addEventListener('focusout', (e) => {
  const sheet = $('#moreSheet');
  if (!sheet || sheet.hidden || !sheet.contains(e.target)) return;
  const to = e.relatedTarget;
  if (to && (sheet.contains(to) || to.id === 'moreBtn')) return;
  if (!to) return;   // focus left the page (window switch, or a click on nothing): the click handler decides
  closeMoreSheet(false);
});

</script>
