// LEVELS, LEVEL_SHORT, LEVEL_HELP, SUBS, SUB, GROUPS, KSBS, KSB come from the framework (05-framework.js).
const goal = () => (P() && P().settings.goal) || 3;

// ---------- evidence ----------
const codeFromName = (name) => { const m = /\b([A-Z]{2,3}-\d{2,3})\b/.exec(name); return m ? m[1] : ''; };
const titleFromName = (name) => name.replace(/\.[^.]+$/, '').replace(/^\s*[A-Z]{2,3}-\d{2,3}\s*[-–_.]?\s*/, '').trim() || name;

// Every evidence file joined with its record; records whose file has gone are listed as missing.
function evidenceItems() {
  const recs = (P() && P().evidence) || {};
  const seen = new Set();
  const items = S.files.map((f) => {
    seen.add(f.path);
    const rec = recs[f.path];
    return { path: f.path, file: f, rec, code: (rec && rec.code) || codeFromName(f.name), title: (rec && rec.title) || titleFromName(f.name), folder: f.path.split('/').slice(1, -1).join('/') };
  });
  for (const [path, rec] of Object.entries(recs)) {
    if (!seen.has(path)) items.push({ path, file: null, rec, code: rec.code || codeFromName(path.split('/').pop()), title: rec.title || titleFromName(path.split('/').pop()), folder: path.split('/').slice(1, -1).join('/'), missing: true });
  }
  return items;
}
function itemByCode(code) { return evidenceItems().find((i) => i.code === code); }
const label = (it) => it.code || it.title;

// For each sub-attribute and level: the evidence items mapped there.
function coverage() {
  const out = Object.fromEntries(SUBS.map((a) => [a.id, Object.assign(Object.fromEntries(LEVELS.map((l) => [l, []])), needLevels(a) ? { _need: needLevels(a) } : {})]));
  for (const it of evidenceItems()) {
    if (it.missing || !it.rec) continue;
    for (const m of it.rec.maps || []) {
      const cell = out[m.sub] && out[m.sub][m.level];
      if (cell && !cell.includes(it)) cell.push(it);
    }
  }
  return out;
}
// A requirement with a minimum level (IStructE objectives) needs `goal` items at that level or above, counted once;
// otherwise it needs `goal` items at every level.
const needLevels = (a) => (a.min && LEVELS.includes(a.min) ? LEVELS.slice(LEVELS.indexOf(a.min)) : null);
const distinctNeeded = (cell) => new Set(cell._need.flatMap((l) => cell[l])).size;
function slots(cell) { return cell._need ? Math.min(distinctNeeded(cell), goal()) : LEVELS.reduce((n, l) => n + Math.min(cell[l].length, goal()), 0); }
const slotMax = (cell) => (cell._need ? goal() : LEVELS.length * goal());
function slotStatus(cell) {
  const s = slots(cell);
  return s >= slotMax(cell) ? 'met' : s > 0 ? 'part' : 'none';
}
function ksbCoverage() {
  const out = Object.fromEntries(KSBS.map((k) => [k.id, { direct: new Set(), via: new Set() }]));
  for (const it of evidenceItems()) {
    if (it.missing || !it.rec) continue;
    for (const m of it.rec.maps || []) {
      for (const k of m.ksbs || []) if (out[k]) out[k].direct.add(it);
      for (const k of KSBS) if (k.attributes.includes(m.sub)) out[k.id].via.add(it);
    }
  }
  return out;
}

// ---------- PRRs (Word) ----------
// HEADING_RE is built from the framework's ids (05-framework.js).
const EVIDENCE_RE = /^\s*evidence\s*:\s*(.*)$/i;
const TAG_RE = /\{\s*([A-Z]{2,3}-\d{2,3})\s*\}/g;
const PLACEHOLDER_RE = /^(?:[\d\s.…]*|.*(?:…|\.\.\.)\s*(?:…|\.\.\.)?\s*|tbc|tbd|todo|xxx+|placeholder)$/i;
const DRAFT_WORDS = 40;
const PRR_STATE = { ready: ['ready', 'good'], draft: ['draft', 'part'], placeholder: ['placeholder', 'part'], empty: ['heading only', 'outline'], missing: ['not in PRR', 'outline'] };
const isPlaceholder = (t) => PLACEHOLDER_RE.test(t.trim());

S.prr = {}; // path -> {mtime, doc: {title, sections}, comments, edits, error}

function parsePrr(paragraphs) {
  let title = '';
  const sections = [];
  let cur = null;
  let block = null;
  paragraphs.forEach((p, i) => {
    const text = p.text;
    if (!text) return;
    const h = HEADING_RE.exec(text);
    const hid = h && subIdFromHeading(h[1]);
    if (h && hid && (/^heading/i.test(p.style) || text.length < 250)) {
      cur = { id: hid, heading: h[2].trim(), start: i, end: paragraphs.length, listed: [], listedText: '', general: [], blocks: [] };
      if (sections.length) sections[sections.length - 1].end = i;
      sections.push(cur);
      block = null;
      return;
    }
    if (!cur) { if (!title && (/^title$/i.test(p.style) || /attribute\s*\d|report|review/i.test(text))) title = text; return; }
    const e = EVIDENCE_RE.exec(text);
    if (e && !cur.blocks.length) { cur.listedText = e[1].trim(); cur.listed.push(...expandCodes(e[1])); return; }
    const tags = [...text.matchAll(TAG_RE)];
    if (!tags.length) { (block ? block.paragraphs : cur.general).push(text); return; }
    const before = text.slice(0, tags[0].index).trim();
    if (before) (block ? block.paragraphs : cur.general).push(before);
    tags.forEach((t, n) => {
      const end = n + 1 < tags.length ? tags[n + 1].index : text.length;
      block = { code: t[1], paragraphs: [] };
      const rest = text.slice(t.index + t[0].length, end).trim();
      if (rest) block.paragraphs.push(rest);
      cur.blocks.push(block);
    });
  });
  for (const s of sections) {
    const real = [...s.general, ...s.blocks.flatMap((b) => b.paragraphs)].filter((t) => !isPlaceholder(t));
    s.words = real.reduce((n, t) => n + words(t), 0);
    const anyText = s.general.join('') + s.blocks.map((b) => b.paragraphs.join('')).join('');
    s.state = s.words >= DRAFT_WORDS ? 'draft' : anyText.trim() || s.listed.length ? 'placeholder' : 'empty';
    for (const b of s.blocks) { b.words = b.paragraphs.filter((t) => !isPlaceholder(t)).reduce((n, t) => n + words(t), 0); b.thin = b.words < 15; }
    s.discussed = [...new Set(s.blocks.map((b) => b.code))].sort(natural);
    s.listed = [...new Set(s.listed)];
  }
  return { title, sections };
}

// Code checks for one section: [[level, message]].
function sectionChecks(s, codes, accepted) {
  const out = [];
  if (s.state === 'draft' && !s.listed.length && !s.discussed.length) out.push(['warn', 'no evidence referenced: add an "Evidence:" line and a {CODE} tag before each item you write about']);
  const unknown = [...new Set([...s.listed, ...s.discussed])].filter((c) => !codes.has(c));
  if (unknown.length) out.push(['error', 'not found in your evidence: ' + unknown.join(', ')]);
  const notDiscussed = s.listed.filter((c) => !s.discussed.includes(c) && codes.has(c));
  if (notDiscussed.length && s.state === 'draft') out.push(['warn', 'listed but not written about ({CODE} tag missing): ' + notDiscussed.join(', ')]);
  const notListed = s.discussed.filter((c) => !s.listed.includes(c));
  if (notListed.length && s.listed.length) out.push(['warn', 'written about but not in the Evidence line: ' + notListed.join(', ')]);
  const thin = s.blocks.filter((b) => b.thin).map((b) => b.code);
  if (thin.length && s.state === 'draft') out.push(['warn', 'placeholder or very short write-up for: ' + thin.join(', ')]);
  const unmapped = [...new Set([...s.listed, ...s.discussed])].filter((c) => codes.has(c) && !accepted.has(c + '|' + s.id));
  if (unmapped.length) out.push(['info', `not yet mapped to ${s.id} on the Evidence page: ` + unmapped.join(', ')]);
  return out;
}

async function loadReports() {
  const root = portfolioRoot();
  if (!root) return;
  const files = (await listDir(root, FOLDERS.prr)).filter((f) => /\.docx$/i.test(f.name));
  const keep = new Set();
  for (const f of files) {
    const path = `${FOLDERS.prr}/${f.path}`;
    keep.add(path);
    if (S.prr[path] && S.prr[path].mtime === f.mtime) continue;
    try {
      const parsed = await parseDocx(await (await f.handle.getFile()).arrayBuffer());
      const doc = parsePrr(parsed.paragraphs);
      const sectionAt = (para) => doc.sections.find((s) => para !== null && para >= s.start && para < s.end);
      const comments = [];
      for (const c of parsed.comments.filter((x) => !x.parent)) {
        const s = sectionAt(c.para);
        comments.push({ kind: 'comment', key: await sha1(`${c.author}|${c.date}|${c.text}`), author: c.author, date: c.date, text: c.text, anchor: c.anchor,
          resolved: c.done, sub: s ? s.id : '', file: path, replies: parsed.comments.filter((r) => r.parent === c.id).map((r) => ({ author: r.author, date: r.date, text: r.text })) });
      }
      const edits = [];
      for (const [i, p] of parsed.paragraphs.entries()) {
        for (const [kind, list] of [['added', p.ins], ['removed', p.del]]) {
          for (const ch of list) {
            if (words(ch.text) < 4) continue;
            const s = sectionAt(i);
            edits.push({ kind: 'edit', change: kind, key: await sha1(`${ch.author}|${ch.date}|${kind}|${ch.text}`), author: ch.author, date: ch.date,
              text: ch.text.trim(), anchor: p.text.slice(0, 200), sub: s ? s.id : '', file: path, replies: [] });
          }
        }
      }
      S.prr[path] = { path, name: f.name, mtime: f.mtime, doc, comments, edits, error: null };
    } catch (err) {
      S.prr[path] = { path, name: f.name, mtime: f.mtime, doc: { title: '', sections: [] }, comments: [], edits: [], error: err.message };
    }
  }
  for (const path of Object.keys(S.prr)) if (!keep.has(path)) delete S.prr[path];
}

// Everything the PRRs say, per sub-attribute: {id: {sections: [{file, section, issues}], state}}
function prrBySub() {
  const items = evidenceItems();
  const codes = new Set(items.map((i) => i.code).filter(Boolean));
  const mapped = new Set(items.flatMap((i) => ((i.rec && i.rec.maps) || []).map((m) => i.code + '|' + m.sub)));
  const out = Object.fromEntries(SUBS.map((a) => [a.id, { sections: [], state: 'missing' }]));
  for (const r of Object.values(S.prr)) {
    for (const s of r.doc.sections) {
      const issues = sectionChecks(s, codes, mapped);
      const dup = r.doc.sections.filter((x) => x.id === s.id).length > 1;
      if (dup) issues.unshift(['error', `${s.id} appears more than once in ${r.name}`]);
      out[s.id].sections.push({ file: r.path, name: r.name, section: s, issues });
    }
  }
  for (const v of Object.values(out)) {
    const states = v.sections.map((x) => (x.section.state === 'draft' && !x.issues.some((i) => i[0] !== 'info') ? 'ready' : x.section.state));
    v.state = states.includes('ready') ? 'ready' : states.includes('draft') ? 'draft' : states.includes('placeholder') ? 'placeholder' : states.length ? 'empty' : 'missing';
  }
  return out;
}

// ---------- mentor feedback ----------
function feedbackItems() {
  const responses = (P() && P().comments) || {};
  const all = Object.values(S.prr).flatMap((r) => [...r.comments, ...r.edits]);
  return all.map((f) => {
    const resp = responses[f.key];
    const status = resp ? resp.status : f.resolved ? 'done' : 'open';
    return { ...f, status, response: resp ? resp.response : '', updated: resp ? resp.updated : '' };
  });
}

// ---------- completion ----------
// Evidence slots 50%, PRR sections 35% (half when drafted, all when ready), feedback 15% (a sub-attribute
// counts once its section is ready and every comment on it is answered).
function completion() {
  const cov = coverage();
  const prr = prrBySub();
  const fb = feedbackItems();
  let ev = 0, pr = 0, fe = 0;
  for (const a of SUBS) {
    ev += slots(cov[a.id]) / slotMax(cov[a.id]);
    const st = prr[a.id].state;
    pr += st === 'ready' ? 1 : st === 'draft' ? 0.5 : 0;
    if (st === 'ready' && !fb.some((f) => f.sub === a.id && f.status === 'open')) fe += 1;
  }
  const n = SUBS.length;
  const parts = { evidence: ev / n, prr: pr / n, feedback: fe / n };
  return { ...parts, total: 0.5 * parts.evidence + 0.35 * parts.prr + 0.15 * parts.feedback };
}

// The most useful things to do next, worst gaps first.
function nextSteps(limit = 8) {
  const out = [];
  const cov = coverage();
  const prr = prrBySub();
  const fb = feedbackItems().filter((f) => f.status === 'open');
  const unmapped = evidenceItems().filter((i) => !i.missing && !(i.rec && i.rec.maps && i.rec.maps.length));
  const missing = evidenceItems().filter((i) => i.missing);
  if (missing.length) out.push({ text: `${plural(missing.length, 'evidence record')} lost ${missing.length === 1 ? 'its file' : 'their files'} (moved or renamed): relink them`, href: '#evidence?show=missing' });
  if (fb.length) out.push({ text: `Answer ${plural(fb.length, 'open mentor comment')}`, href: '#feedback' });
  if (unmapped.length) out.push({ text: `Map ${plural(unmapped.length, 'evidence file')} to sub-attributes`, href: '#evidence?show=unmapped' });
  const gaps = SUBS.map((a) => ({ a, s: slots(cov[a.id]) })).sort((x, y) => x.s - y.s);
  for (const { a, s } of gaps.slice(0, 4)) {
    if (s >= slotMax(cov[a.id])) break;
    const lacking = cov[a.id]._need ? [`${goal() - s} at ${LEVEL_NAME[cov[a.id]._need[0]]} or above`] : LEVELS.filter((l) => cov[a.id][l].length < goal()).map((l) => `${goal() - cov[a.id][l].length} ${l}`);
    out.push({ text: `${a.id}: needs ${lacking.join(', ')}`, href: '#sub/' + a.id });
  }
  for (const a of SUBS) {
    if (out.length >= limit) break;
    const st = prr[a.id].state;
    if (st === 'draft') out.push({ text: `${a.id}: PRR section drafted but has check warnings`, href: '#sub/' + a.id });
  }
  return out.slice(0, limit);
}

// ---------- meetings ----------
// Lines from a Teams transcript (.vtt, .docx or .txt): [{time, speaker, text}]
function parseTranscriptLines(lines, isVtt) {
  const out = [];
  const push = (time, speaker, text) => {
    text = text.replace(/<\/?v[^>]*>/g, '').replace(/\s+/g, ' ').trim();
    if (!text) return;
    const last = out[out.length - 1];
    // Teams cuts sentences across cues: join a cue to the last one only when that one stopped mid-sentence.
    if (last && last.speaker === speaker && !/[.!?…]$/.test(last.text) && (last.text.length + text.length) < 700) last.text += ' ' + text;
    else out.push({ time, speaker, text, tag: '' });
  };
  if (isVtt) {
    let time = '';
    for (const line of lines) {
      const t = /^(\d{1,2}:)?\d{1,2}:\d{2}[.,]\d{3}\s*-->/.exec(line);
      if (t) { time = line.split('-->')[0].trim().replace(/[.,]\d{3}$/, ''); continue; }
      if (!line.trim() || /^WEBVTT/.test(line) || /^NOTE\b/.test(line) || /^[0-9a-f-]{8,}(\/\d+-\d+)?$/i.test(line.trim()) || /^\d+$/.test(line.trim())) continue;
      const v = /<v\s+([^>]+)>(.*?)(<\/v>|$)/.exec(line);
      if (v) push(time, v[1].trim(), v[2]); else push(time, '', line);
    }
    return out;
  }
  let speaker = '', time = '';
  for (const raw of lines) {
    const line = raw.trim();
    if (!line) continue;
    let m = /^(.{2,60}?)\s+((?:\d{1,2}:)?\d{1,2}:\d{2})\s*$/.exec(line);
    if (m && !/[.!?]$/.test(m[1])) { speaker = m[1].trim(); time = m[2]; continue; }
    m = /^((?:\d{1,2}:)?\d{1,2}:\d{2}(?:\.\d+)?)\s+(.{2,60}?)\s*$/.exec(line);
    if (m && !/[.!?]$/.test(m[2]) && m[2].split(' ').length <= 5) { time = m[1]; speaker = m[2].trim(); continue; }
    m = /^\[?((?:\d{1,2}:)?\d{1,2}:\d{2})\]?\s+([^:]{2,40}):\s+(.+)$/.exec(line);
    if (m) { push(m[1], m[2].trim(), m[3]); continue; }
    m = /^([A-Z][^:]{1,39}):\s+(.+)$/.exec(line);
    if (m && m[1].split(' ').length <= 4) { push(time, m[1].trim(), m[2]); continue; }
    if (/started transcription|stopped transcription/i.test(line)) continue;
    push(time, speaker, line);
  }
  return out;
}

async function readTranscript(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith('.docx')) {
    const { paragraphs } = await parseDocx(await file.arrayBuffer());
    return parseTranscriptLines(paragraphs.map((p) => p.text), false);
  }
  const text = await file.text();
  return parseTranscriptLines(text.split(/\r?\n/), name.endsWith('.vtt') || /^WEBVTT/.test(text));
}

// ---------- CPD ----------
function cpdYear(dateIso) {
  const start = (P() && P().settings.cpdYearStart) || 1;
  const d = new Date(dateIso);
  if (isNaN(d)) return null;
  return d.getMonth() + 1 >= start ? d.getFullYear() : d.getFullYear() - 1;
}
const cpdYearLabel = (y) => ((P() && P().settings.cpdYearStart) || 1) === 1 ? String(y) : `${y}/${String(y + 1).slice(2)}`;
function cpdWarnings(a) {
  const out = [];
  const days = a.dateTo && a.dateFrom ? Math.round((new Date(a.dateTo) - new Date(a.dateFrom)) / 864e5) + 1 : 1;
  if (+a.hours > 30) out.push('ICE advises claiming no more than 30 hours for one activity');
  if (+a.hours > 6 * Math.max(1, days)) out.push('more than 6 hours a day: ICE advises a day counts as 6 hours at most');
  if (!a.learning || !a.benefits) out.push('evaluation missing: key learning points and benefits');
  if (!a.objective) out.push('no development plan reference');
  return out;
}

}

let previewUrl = null;
async function previewHtml(path) {
  const file = await getFile(path);
  if (previewUrl) URL.revokeObjectURL(previewUrl);
  const ext = (path.split('.').pop() || '').toLowerCase();
  if (['pdf', 'png', 'jpg', 'jpeg', 'gif', 'webp', 'bmp', 'svg', 'txt', 'md', 'csv', 'htm', 'html', 'mp4', 'webm', 'mp3', 'm4a', 'wav'].includes(ext)) {
    const type = { pdf: 'application/pdf', svg: 'image/svg+xml', txt: 'text/plain;charset=utf-8', md: 'text/plain;charset=utf-8', csv: 'text/plain;charset=utf-8', htm: 'text/plain;charset=utf-8', html: 'text/plain;charset=utf-8' }[ext] || file.type;
    previewUrl = URL.createObjectURL(new Blob([file], { type }));
    if (/^(png|jpe?g|gif|webp|bmp|svg)$/.test(ext)) return `<img class="preview" src="${previewUrl}" alt="">`;
    if (/^(mp4|webm)$/.test(ext)) return `<video class="preview" src="${previewUrl}" controls></video>`;
    if (/^(mp3|m4a|wav)$/.test(ext)) return `<audio src="${previewUrl}" controls style="margin:20px"></audio>`;
    return `<iframe class="preview" src="${previewUrl}" title="preview"></iframe>`;
  }
  if (ext === 'docx') return `<div class="docx-view">${await docxPreviewHtml(await file.arrayBuffer())}</div>`;
  if (ext === 'vtt') return `<pre class="text-view">${esc(await file.text())}</pre>`;
  return `<div class="empty" style="margin:20px">This type of file (.${esc(ext)}, ${fmtSize(file.size)}) cannot be shown here.<br>Open it from your OneDrive folder:<br><code>${esc(path)}</code></div>`;
}

    for (const o of P().cpd.objectives) out.push({ kind: 'Objective', text: `${o.ref} ${o.title} ${o.area}`, label: `${o.ref} · ${o.title || o.area}`, href: '#cpd/plan' });
  }

}
function bindSearch() {
  const input = $('#search');
  const box = $('#searchResults');
  let hits = [];
  let sel = 0;
  const show = () => {
    const q = input.value.trim().toLowerCase();
    if (!q) { box.hidden = true; return; }
    const terms = q.split(/\s+/);
    hits = searchIndex().filter((h) => terms.every((t) => h.text.toLowerCase().includes(t))).slice(0, 30);
    sel = 0;
    box.innerHTML = hits.length ? hits.map((h, i) => `<a href="${h.href}" class="${i === sel ? 'sel' : ''}"><span class="kind">${esc(h.kind)}</span>${esc(h.label.slice(0, 140))}</a>`).join('') : '<div class="muted" style="padding:.6rem">Nothing found</div>';
    box.hidden = false;
  };
  input.addEventListener('input', show);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + hits.length) % Math.max(1, hits.length);
      $$('a', box).forEach((a, i) => a.classList.toggle('sel', i === sel));
    } else if (e.key === 'Enter' && hits[sel]) { location.hash = hits[sel].href; box.hidden = true; input.blur(); }
    else if (e.key === 'Escape') { box.hidden = true; input.blur(); }
  });
  input.addEventListener('blur', () => setTimeout(() => { box.hidden = true; }, 200));
}
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k' && $('#search')) { e.preventDefault(); $('#search').focus(); $('#search').select(); }
  if (e.key === 'Escape') closePreview();
});

// ---------- dialogs ----------
function dialog(html, onOpen) {
  const d = document.createElement('dialog');
  d.innerHTML = html;
  document.body.append(d);
  d.addEventListener('close', () => d.remove());
  // Remove at once on close: the close event can arrive late, leaving a stale dialog in the page.
  const close = d.close.bind(d);
  d.close = (v) => { close(v); d.remove(); };
  d.showModal();
  if (onOpen) onOpen(d);
  return d;
}
function ask(question, okLabel = 'OK') {
  return new Promise((resolve) => {
    const d = dialog(`<p>${question}</p><div class="row" style="justify-content:flex-end;margin-top:1rem"><button value="no">Cancel</button><button class="primary" value="yes">${esc(okLabel)}</button></div>`);
    $$('button', d).forEach((b) => b.addEventListener('click', () => { resolve(b.value === 'yes'); d.close(); }));
    d.addEventListener('cancel', () => resolve(false));
  });
}

function showConflict() {
  const d = dialog(`<h2>Changed somewhere else</h2>

    <div class="row" style="justify-content:flex-end;margin-top:1rem"><button id="cKeep">Keep mine</button><button class="primary" id="cLoad">Load the newer file</button></div>`);

async function openAll() {
  S.warnings = [];

  await loadOther();

  if (isMentor() && S.other && !S.otherData) S.warnings.push('The apprentice\'s folder needs permission again: open Settings and press Reconnect.');

  if (copies.length) S.warnings.push(`OneDrive made conflict copies of the data file (${copies.join(', ')}). The tool uses the main file; check whether anything in a copy is missing, then delete the copy.`);

async function numberFiles() {
  const items = evidenceItems().filter((i) => !i.missing && !i.code);
  if (!items.length) return toast('Every file already has a code');
  const byFolder = {};
  for (const i of items) (byFolder[i.folder] = byFolder[i.folder] || []).push(i);
  const used = new Set(evidenceItems().map((i) => i.code).filter(Boolean));
  const d = dialog(`<h2>Give codes to ${plural(items.length, 'file')}</h2>
    <p class="small muted">Pick a 2 or 3 letter prefix per folder (for example SV for site visits). Files are numbered in name order, skipping codes already used. Only the tracker changes: file names stay as they are.</p>
    <table><thead><tr><th>Folder</th><th>Files</th><th>Prefix</th></tr></thead><tbody>${Object.entries(byFolder).map(([f, list]) => `<tr><td>${esc(f || '(top level)')}</td><td>${list.length}</td>
      <td><input data-folder="${esc(f)}" size="4" maxlength="3" value="${esc(categoryPrefix(f) || (f.replace(/^[\d\s.\-–]+/, '').match(/[A-Za-z]/g) || ['E', 'V']).slice(0, 2).join('').toUpperCase())}"></td></tr>`).join('')}</tbody></table>
    <div class="row" style="justify-content:flex-end;margin-top:1rem"><button value="no">Cancel</button><button class="primary" id="doNumber">Give codes</button></div>`);
  $('button[value=no]', d).addEventListener('click', () => d.close());
  $('#doNumber', d).addEventListener('click', () => {
    for (const input of $$('input[data-folder]', d)) {
      const prefix = input.value.trim().toUpperCase();
      if (!/^[A-Z]{2,3}$/.test(prefix)) { toast('A prefix must be 2 or 3 letters', 'error'); return; }
      let n = 0;
      for (const it of byFolder[input.dataset.folder].sort((a, b) => natural(a.path, b.path))) {
        while (used.has(`${prefix}-${String(n).padStart(2, '0')}`)) n++;
        const code = `${prefix}-${String(n).padStart(2, '0')}`;
        used.add(code);
        evidenceRecord(it).code = code;
      }
    }
    changed();
    d.close();
    toast(`Codes given to ${plural(items.length, 'file')}`);
    render();
  });
}

VIEWS.item.after = async (arg) => {
  const it = evidenceItems().find((i) => i.path === arg);
  if (!it) return;
  const rec = canEdit() ? evidenceRecord(it) : (it.rec || {});
  if (canEdit()) {
    bindFields($('#main'), rec);
    $$('.lvl-btn').forEach((b) => b.addEventListener('click', () => {
      const { sub, level } = b.dataset;
      const i = rec.maps.findIndex((m) => m.sub === sub && m.level === level);
      if (i >= 0) rec.maps.splice(i, 1); else rec.maps.push({ sub, level, ksbs: [], note: '' });
      changed();
      const y = window.scrollY;
      render().then(() => window.scrollTo(0, y));
    }));
    $$('.ksb-box').forEach((b) => b.addEventListener('change', () => {
      const m = rec.maps[+b.dataset.i];
      m.ksbs = $$(`.ksb-box[data-i="${b.dataset.i}"]:checked`).map((x) => x.value);
      changed();
    }));
    $$('.map-note').forEach((inp) => inp.addEventListener('input', () => { rec.maps[+inp.dataset.i].note = inp.value; changed(); }));
    $$('.map-del').forEach((b) => b.addEventListener('click', () => { rec.maps.splice(+b.dataset.i, 1); changed(); render(); }));
    $$('.relink').forEach((b) => b.addEventListener('click', () => {
      P().evidence[b.dataset.path] = rec;
      delete P().evidence[it.path];
      changed();
      location.hash = '#item/' + encodeURIComponent(b.dataset.path);
    }));
    if ($('#dropRec')) $('#dropRec').addEventListener('click', async () => {
      if (!(await ask('Remove this record and its mappings? The file itself is already gone.', 'Remove'))) return;
      delete P().evidence[it.path];
      changed();
      location.hash = '#evidence';
    });
  }
  if (isMentor() && $('#mentorNote') && it.code) {
    $('#mentorNote').addEventListener('input', (e) => { S.data.evidence[it.code] = { comment: e.target.value, date: today() }; changed(); });
  }
  if ($('#inlinePreview')) {
    try { $('#inlinePreview').innerHTML = await previewHtml(it.path); } catch (err) { $('#inlinePreview').innerHTML = `<p class="bad" style="padding:16px">${esc(err.message)}</p>`; }
  }
};
document.addEventListener('keydown', (e) => {

function newPrrDialog() {
  const d = dialog(`<h2>New PRR from the template</h2>
    <p class="small muted">Makes a Word file in <code>${FOLDERS.prr}</code> with a heading and an Evidence line for each sub-attribute. Existing files are never overwritten.</p>
    <label>Attribute</label><select id="prrGroup">${GROUPS.map((g) => `<option value="${g.group}">${g.group}. ${esc(g.title)}</option>`).join('')}<option value="all">All in one file</option></select>
    <label><input type="checkbox" id="prrEvidence" checked> Fill the Evidence lines from what is already mapped</label>
    <div class="row" style="justify-content:flex-end;margin-top:1rem"><button value="no">Cancel</button><button class="primary" id="prrMake">Create</button></div>`);
  $('button[value=no]', d).addEventListener('click', () => d.close());
  $('#prrMake', d).addEventListener('click', (e) => act(e.currentTarget, async () => {
    const g = $('#prrGroup', d).value;
    const fill = $('#prrEvidence', d).checked;
    const cov = coverage();
    const groups = g === 'all' ? GROUPS : GROUPS.filter((x) => String(x.group) === g);
    const name = g === 'all' ? 'PRR - All attributes.docx' : `PRR - Attribute ${g}.docx`;
    if (await exists(S.own, `${FOLDERS.prr}/${name}`)) throw new Error(`${name} already exists`);
    const blocks = [{ type: 'title', text: g === 'all' ? `Professional Review Report – ${P().name}` : `Attribute ${g} – ${groups[0].title}` },
      { type: 'small', text: 'Under each heading: list the evidence on the Evidence line, then write about each item after its tag, e.g. {CO-14}.' }];
    for (const grp of groups) {
      if (g === 'all') blocks.push({ type: 'h1', text: `Attribute ${grp.group} – ${grp.title}` });
      for (const a of SUBS.filter((x) => x.group === grp.group)) {
        const codes = fill ? [...new Set(LEVELS.flatMap((l) => cov[a.id][l].map((i) => i.code)).filter(Boolean))].sort(natural) : [];
        blocks.push({ type: g === 'all' ? 'h2' : 'h1', text: `${a.id} – ${a.text}` }, { type: 'p', text: 'Evidence: ' + codes.join(', ') });
        for (const c of codes) blocks.push({ type: 'p', text: `{${c}} …` });
        if (!codes.length) blocks.push({ type: 'p', text: '…' });
      }
    }
    await writeFile(S.own, `${FOLDERS.prr}/${name}`, makeDocx(blocks));
    d.close();
    await loadReports();
    await render();
    return name;
  }, (name) => `Created ${FOLDERS.prr}/${name}: open it in Word from your OneDrive folder`));
}

VIEWS.feedback = async (arg, q) => {
  await loadReports();
  const all = feedbackItems();
  const status = q.get('status') || (q.get('key') ? 'all' : 'open');
  const sub = q.get('sub') || '';
  const file = q.get('file') || '';
  const focus = q.get('focus') === '1';
  let list = all.filter((f) => (status === 'all' || f.status === status) && (!sub || f.sub === sub) && (!file || f.file === file));
  if (q.get('key')) list = all.filter((f) => f.key === q.get('key'));
  list.sort((a, b) => natural(a.sub || 'zz', b.sub || 'zz') || natural(a.file, b.file));
  const qs = (patch) => '#feedback?' + new URLSearchParams({ status, sub, file, focus: focus ? '1' : '', ...patch }).toString();
  const count = (s) => all.filter((f) => s === 'all' || f.status === s).length;
  const subs = [...new Set(all.map((f) => f.sub).filter(Boolean))].sort(natural);

async function importTranscript(file, path) {
  let lines;
  try { lines = await readTranscript(file); } catch (err) { return toast('Could not read the transcript: ' + err.message, 'error'); }
  if (!lines.length) return toast('No lines found in that file', 'error');
  const date = (/(\d{4})[-_.]?(\d{2})[-_.]?(\d{2})/.exec(file.name) || []).slice(1).join('-') || localIso(new Date(file.lastModified)).slice(0, 10);
  const speakers = [...new Set(lines.map((l) => l.speaker).filter(Boolean))];
  const m = { id: uid(), date, title: file.name.replace(/\.[^.]+$/, '').replace(/[_]+/g, ' ').replace(/\d{4}[-_.]?\d{2}[-_.]?\d{2}/, '').replace(/^[\s\-–]+|[\s\-–]+$/g, '').slice(0, 80) || 'Mentor meeting', attendees: speakers.join(', '), source: path, lines, items: [] };
  P().meetings.push(m);
  changed();
  toast(`Imported ${plural(lines.length, 'line')}${speakers.length ? ' from ' + speakers.join(', ') : ''}`);
  location.hash = '#meeting/' + m.id;
}

    P().meetings.splice(P().meetings.indexOf(m), 1);

    location.hash = '#meetings';
  });
  const keep = () => { const t = $('#transcript'); const y = t ? t.scrollTop : 0; return () => { const t2 = $('#transcript'); if (t2) t2.scrollTop = y; }; };
  const rerender = () => { const restore = keep(); const wy = window.scrollY; render().then(() => { restore(); window.scrollTo(0, wy); }); };
  const tag = (n, kind) => {
    const line = m.lines[n];
    const existing = m.items.find((i) => i.line === n);
    if (!kind || line.tag === kind) {
      line.tag = '';
      if (existing) m.items.splice(m.items.indexOf(existing), 1);
    } else {
      line.tag = kind;
      if (existing) existing.kind = kind;
      else m.items.push({ id: uid(), kind, text: line.text, who: line.speaker, time: line.time, line: n, sub: '', due: '', status: 'open', evidence: '' });

    on('.it-kind', 'change', (el) => { it.kind = el.value; if (it.line !== null && m.lines[it.line]) m.lines[it.line].tag = el.value; rerender(); });
    const del = $('.it-del', card);

      if (it.line !== null && m.lines[it.line]) m.lines[it.line].tag = '';
      m.items.splice(m.items.indexOf(it), 1);

document.addEventListener('keydown', (e) => {
  const { name, arg } = parseHash();
  if (name !== 'meeting' || !canEdit() || (e.target.closest && e.target.closest('input, textarea, select')) || e.ctrlKey || e.metaKey || e.altKey) return;
  const m = P().meetings.find((x) => x.id === arg);

  const k = e.key.toLowerCase();

});

async function writeMeetingNotes(m) {
  const by = (k) => m.items.filter((i) => i.kind === k && i.text.trim());
  const line = (i) => `${i.text.trim()}${i.who ? ` (${i.who})` : ''}${i.sub ? ` [${i.sub}]` : ''}${i.evidence ? ` – evidence ${i.evidence}` : ''}`;
  const blocks = [
    { type: 'title', text: `Meeting notes – ${m.title}` },
    { type: 'small', text: `${fmtDate(m.date)}${m.attendees ? ' · ' + m.attendees : ''}` },
    { type: 'h1', text: 'Completed' },
    ...(by('done').length ? by('done').map((i) => ({ type: 'p', text: '• ' + line(i) })) : [{ type: 'p', text: 'Nothing recorded.' }]),
    { type: 'h1', text: 'To do and new tasks' },
    by('todo').length ? { type: 'table', rows: [['Task', 'Sub-attribute', 'Due', 'Status'], ...by('todo').map((i) => [i.text.trim() + (i.who ? ` (${i.who})` : ''), i.sub || '', i.due ? fmtDate(i.due) : '', i.status === 'done' ? 'Done' : 'Open'])], widths: [5600, 1300, 1300, 1000] } : { type: 'p', text: 'Nothing recorded.' },
    { type: 'h1', text: 'Teaching from my mentor' },
    ...(by('teaching').length ? by('teaching').map((i) => ({ type: 'p', text: '• ' + line(i) })) : [{ type: 'p', text: 'Nothing recorded.' }]),
  ];
  const safe = `${m.date} ${m.title}`.replace(/[\\/:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 100);
  const path = `${FOLDERS.meetings}/${safe} - notes.docx`;
  await writeFile(S.own, path, makeDocx(blocks));
  return path;
}

// CPD, following ICE's CPD guidance: a Development Action Plan (objectives with reference codes, after a
// review of learning needs) and a Personal Development Record (activities with effective learning time and
// an evaluation). Exports to Word in the layout of ICE's Appendix A and B templates.

const CPD_TYPES = ['Learning on the job', 'Peer guidance and discussion', 'Employer training or presentation', 'Course', 'Conference, seminar or workshop',
  'ICE or regional event', 'Structured reading', 'Self-study (textbooks, study packs)', 'Online learning or webinar', 'Podcast or video', 'Work shadowing',
  'Site visit', 'Secondment', 'Writing reports or for publication', 'Giving a presentation or lecture', 'Coaching or mentoring others',
  'STEM outreach (schools, careers events)', 'ICE volunteering (reviewer, committee)', 'Research', 'Trade exhibition', 'Qualification (not your academic base)', 'Other'];
const OBJ_STATUS = { active: 'Active', complete: 'Complete', archived: 'Archived' };

const cpd = () => P().cpd;
const objectiveOf = (a) => cpd().objectives.find((o) => o.id === a.objective);
const themes = () => (P().settings.themes || []).map((t) => ({ name: t.replace(/^\*\s*/, '').trim(), mandatory: /^\*/.test(t) })).filter((t) => t.name);

function cpdYears() {
  const ys = new Set(cpd().activities.map((a) => cpdYear(a.dateFrom)).filter((y) => y !== null));
  ys.add(cpdYear(today()));
  return [...ys].sort((a, b) => b - a);
}

VIEWS.cpd = async (arg, q) => {
  const [page, id] = (arg || 'overview').split('/');
  const tabs = [['overview', 'Overview'], ['plan', 'Development plan'], ['record', 'Development record'], ['export', 'Export']];
  const head = `<div class="row spread"><h1>CPD</h1>${canEdit() ? `<div class="row"><button id="addAct" class="primary">+ Record an activity</button></div>` : ''}</div>
    <div class="sub-tabs">${tabs.map(([k, v]) => `<a href="#cpd/${k}" class="${page === k || (page === 'activity' && k === 'record') || (page === 'objective' && k === 'plan') ? 'active' : ''}">${v}</a>`).join('')}</div>`;
  const body = { overview: cpdOverview, plan: cpdPlan, record: cpdRecord, activity: cpdActivity, objective: cpdObjective, export: cpdExport }[page] || cpdOverview;
  return head + body(id, q);
};
VIEWS.cpd.after = (arg, q) => {
  const [page, id] = (arg || 'overview').split('/');
  if ($('#addAct')) $('#addAct').addEventListener('click', () => {
    const a = { id: uid(), ref: '', objective: (cpd().objectives.find((o) => o.ref === 'UNP') || {}).id || '', details: '', theme: '', type: '', dateFrom: today(), dateTo: today(), hours: '',
      learning: '', benefits: '', helped: '', future: '', dap: '', documents: [], subs: [] };
    cpd().activities.push(a);
    changed();
    location.hash = '#cpd/activity/' + a.id;
  });
  ({ activity: afterActivity, objective: afterObjective, plan: afterPlan, export: afterExport, record: afterRecord }[page] || (() => {}))(id, q);
};

function cpdOverview() {
  const years = cpdYears();
  const target = +P().settings.cpdTarget || 30;
  const yr = years[0];
  const acts = cpd().activities.filter((a) => cpdYear(a.dateFrom) === yr);
  const hours = acts.reduce((n, a) => n + (+a.hours || 0), 0);
  const sum = (list, key) => { const out = {}; for (const a of list) { const k = key(a) || '(none)'; out[k] = (out[k] || 0) + (+a.hours || 0); } return Object.entries(out).sort((x, y) => y[1] - x[1]); };
  const warnings = cpd().activities.map((a) => ({ a, w: cpdWarnings(a) })).filter((x) => x.w.length);
  const recent = years.slice(0, 3);
  const mandatory = themes().filter((t) => t.mandatory);
  const covered = (t) => cpd().activities.some((a) => a.theme === t.name && recent.includes(cpdYear(a.dateFrom)));
  const table = (rows) => rows.length ? `<table><tbody>${rows.map(([k, h]) => `<tr><td>${esc(k)}</td><td class="right nowrap">${h} h</td></tr>`).join('')}</tbody></table>` : '<p class="muted">Nothing yet.</p>';
  return `<div class="kpis">${years.slice(0, 4).map((y) => {
      const h = cpd().activities.filter((a) => cpdYear(a.dateFrom) === y).reduce((n, a) => n + (+a.hours || 0), 0);
      return `<div class="kpi"><div class="label">CPD year ${cpdYearLabel(y)}</div><div class="big-number">${h}<small style="font-size:1rem"> / ${target} h</small></div>${meter(h / target, h >= target ? 'good' : '')}</div>`;
    }).join('')}
    <div class="kpi"><div class="label">Objectives</div><div class="big-number">${cpd().objectives.filter((o) => o.status === 'active').length}</div><div class="small muted">active · ${cpd().objectives.filter((o) => o.status === 'complete').length} complete</div></div></div>
    <p class="small muted">ICE asks for at least ${target} hours of effective learning a year up to the Professional Review. Effective learning time is the time you actually learned for, not how long the activity lasted: no more than 6 hours for a day and 30 hours for one activity.</p>
    <div class="grid">
      <div class="card"><h2>${cpdYearLabel(yr)} by objective</h2>${table(sum(acts, (a) => { const o = objectiveOf(a); return o ? `${o.ref} ${o.title || o.area}` : ''; }))}</div>
      <div class="card"><h2>${cpdYearLabel(yr)} by type</h2>${table(sum(acts, (a) => a.type))}</div>
      <div class="card"><h2>${cpdYearLabel(yr)} by CPD Framework theme</h2>${table(sum(acts.filter((a) => a.theme), (a) => a.theme))}
        ${mandatory.length ? `<h3>Mandatory themes, last 3 years</h3>${mandatory.map((t) => `<div>${covered(t) ? '<span class="good">✓</span>' : '<span class="bad">✕</span>'} ${esc(t.name)}</div>`).join('')}` : `<p class="small muted">Add ICE's CPD Framework themes in <a href="#settings">Settings</a> to track them (mark the mandatory ones with *).</p>`}</div>
      <div class="card"><h2>To tidy up</h2>${warnings.length ? `<ul class="list-plain">${warnings.slice(0, 15).map(({ a, w }) => `<li><a href="#cpd/activity/${a.id}">${esc(a.details || '(no details)')}</a><div class="small part">${w.map(esc).join(' · ')}</div></li>`).join('')}</ul>` : '<p class="good">All activities are complete.</p>'}</div>
    </div>`;
}

function cpdRecord(id, q) {
  const year = q.get('year') || String(cpdYears()[0]);
  const list = cpd().activities.filter((a) => year === 'all' || String(cpdYear(a.dateFrom)) === year).sort((a, b) => (b.dateFrom || '').localeCompare(a.dateFrom || ''));
  const total = list.reduce((n, a) => n + (+a.hours || 0), 0);
  return `<div class="row" style="margin-bottom:8px"><label style="margin:0">CPD year</label><select id="cpdYear">${cpdYears().map((y) => `<option value="${y}" ${String(y) === year ? 'selected' : ''}>${cpdYearLabel(y)}</option>`).join('')}<option value="all" ${year === 'all' ? 'selected' : ''}>All years</option></select>
      <span class="muted">${plural(list.length, 'activity', 'activities')} · ${total} hours</span></div>
    ${list.length ? `<div class="card table-wrap"><table><thead><tr><th>Dates</th><th>Activity</th><th>Type</th><th>Hours</th><th>Plan ref.</th><th>Theme</th><th></th></tr></thead><tbody>
      ${list.map((a) => { const o = objectiveOf(a); const w = cpdWarnings(a); return `<tr class="click" data-href="#cpd/activity/${a.id}"><td class="nowrap small">${fmtDate(a.dateFrom)}${a.dateTo && a.dateTo !== a.dateFrom ? ' – ' + fmtDate(a.dateTo) : ''}</td>
        <td>${esc(a.details || '(no details)')}${a.documents && a.documents.length ? ' 📎' : ''}</td><td class="small">${esc(a.type)}</td><td class="right">${esc(a.hours)}</td><td>${o ? esc(o.ref) : ''}</td><td class="small">${esc(a.theme)}</td>
        <td>${w.length ? `<span class="part" title="${esc(w.join('\n'))}">!</span>` : ''}</td></tr>`; }).join('')}</tbody></table></div>`
      : '<div class="empty">No activities recorded for this year.</div>'}`;
}
function afterRecord(id, q) {
  $$('tr[data-href]').forEach((tr) => tr.addEventListener('click', () => { location.hash = tr.dataset.href; }));
  $('#cpdYear').addEventListener('change', (e) => { location.hash = '#cpd/record?year=' + e.target.value; });
}

function cpdActivity(id) {
  const a = cpd().activities.find((x) => x.id === id);
  if (!a) return '<div class="empty">Activity not found.</div>';
  const ed = canEdit();
  const area = (field, labelText, help) => `<div class="full"><label>${labelText}${help ? ` <span class="small">– ${help}</span>` : ''}</label><textarea data-field="${field}"${dis(ed)}>${esc(a[field] || '')}</textarea></div>`;
  return `<a href="#cpd/record">← Development record</a>
    <div class="cols wide-left" style="margin-top:8px"><div>
      <div class="card"><h2>Development activity</h2><div class="form-grid">
        <div class="full"><label>Details of CPD activity</label><input data-field="details" value="${esc(a.details)}" placeholder="e.g. ICE webinar: Eurocode 7 changes"${dis(ed)}></div>
        <div><label>Type</label><select data-field="type"${dis(ed)}><option value="">–</option>${CPD_TYPES.map((t) => `<option ${a.type === t ? 'selected' : ''}>${t}</option>`).join('')}</select></div>
        <div><label>ICE CPD Framework theme (if any)</label><input data-field="theme" value="${esc(a.theme || '')}" list="themeList"${dis(ed)}><datalist id="themeList">${themes().map((t) => `<option>${esc(t.name)}</option>`).join('')}</datalist></div>
        <div><label>From</label><input type="date" data-field="dateFrom" value="${esc(a.dateFrom || '')}"${dis(ed)}></div>
        <div><label>To</label><input type="date" data-field="dateTo" value="${esc(a.dateTo || '')}"${dis(ed)}></div>
        <div><label>Effective learning time (hours)</label><input type="number" min="0" step="0.25" data-field="hours" value="${esc(a.hours)}"${dis(ed)}></div>
        <div><label>Development plan ref.</label><select data-field="objective"${dis(ed)}><option value="">–</option>${cpd().objectives.map((o) => `<option value="${o.id}" ${a.objective === o.id ? 'selected' : ''}>${esc(o.ref)} – ${esc(o.title || o.area)}</option>`).join('')}</select></div>
      </div></div>
      <div class="card"><h2>Evaluation</h2><div class="form-grid">
        ${area('learning', 'Key learning points')}
        ${area('benefits', 'Key benefits / value added')}
        ${area('helped', 'How has this learning activity helped you?')}
        ${area('future', 'How will the learning be used in the future?')}
        ${area('dap', 'How will this influence my development plan next year?')}
      </div></div>
    </div><div>
      <div class="card"><h2>Checks</h2><div id="actWarn"></div></div>
      <div class="card"><h2>Supporting documents</h2><p class="small muted">Certificates, handouts, notes. They are copied into <code>${FOLDERS.cpd}</code>. ICE does not ask for them, but they are handy.</p>
        <ul class="list-plain">${(a.documents || []).map((p, i) => `<li>${fileLink(p)} ${ed ? `<button class="small danger doc-del" data-i="${i}" title="Remove from this activity (the file stays)">✕</button>` : ''}</li>`).join('') || '<li class="muted">None.</li>'}</ul>
        ${ed ? '<label class="btn small" style="margin-top:.5rem;color:var(--ink)">Attach a file…<input type="file" id="attach" hidden multiple></label>' : ''}</div>
      ${P().mode !== 'cpd' ? `<div class="card"><h2>ICE sub-attributes</h2><p class="small muted">Optional: which sub-attributes this learning supports (as Knowledge). To count it as evidence, save the certificate into the Evidence folder and map it there.</p>
        <div>${SUBS.map((s) => `<label style="display:inline;margin:0 .5rem 0 0;color:var(--ink)" title="${esc(s.text)}"><input type="checkbox" class="act-sub" value="${s.id}" ${(a.subs || []).includes(s.id) ? 'checked' : ''}${dis(ed)}> ${s.id}</label>`).join('')}</div></div>` : ''}
      ${ed ? '<button class="danger" id="delAct">Delete this activity</button>' : ''}
    </div></div>`;
}
function afterActivity(id) {
  const a = cpd().activities.find((x) => x.id === id);
  if (!a) return;
  const warn = () => { const w = cpdWarnings(a); $('#actWarn').innerHTML = w.length ? w.map((x) => `<div class="issue warn">${esc(x)}</div>`).join('') : '<p class="good">Complete.</p>'; };
  warn();
  if (!canEdit()) return;
  // A one-day activity keeps To equal to From when From changes.
  let lastFrom = a.dateFrom;
  bindFields($('#main'), a, (key) => {
    if (key === 'dateFrom') {
      if (!a.dateTo || a.dateTo === lastFrom || a.dateTo < a.dateFrom) { a.dateTo = a.dateFrom; $('[data-field=dateTo]').value = a.dateTo; changed(); }
      lastFrom = a.dateFrom;
    }
    warn();
  });
  $$('.act-sub').forEach((b) => b.addEventListener('change', () => { a.subs = $$('.act-sub:checked').map((x) => x.value); changed(); }));
  $$('.doc-del').forEach((b) => b.addEventListener('click', () => { a.documents.splice(+b.dataset.i, 1); changed(); render(); }));
  $('#attach').addEventListener('change', async (e) => {
    const y = cpdYear(a.dateFrom) || new Date().getFullYear();
    for (const file of e.target.files) {
      let path = `${FOLDERS.cpd}/${cpdYearLabel(y).replace('/', '-')}/${file.name}`;
      if (await exists(S.own, path)) path = path.replace(/(\.[^.]+)?$/, ` (${uid().slice(-4)})$1`);
      await writeFile(S.own, path, file);
      a.documents = [...(a.documents || []), path];
    }
    changed();
    toast(`Attached ${plural(e.target.files.length, 'file')}`);
    render();
  });
  $('#delAct').addEventListener('click', async () => {
    if (!(await ask('Delete this activity? Attached files stay in the CPD folder.', 'Delete'))) return;
    cpd().activities.splice(cpd().activities.indexOf(a), 1);
    changed();
    location.hash = '#cpd/record';
  });
}

function cpdPlan() {
  const ed = canEdit();
  const reviews = cpd().reviews.slice().sort((a, b) => (b.date || '').localeCompare(a.date || ''));
  const hoursFor = (o) => cpd().activities.filter((a) => a.objective === o.id).reduce((n, a) => n + (+a.hours || 0), 0);
  return `<div class="cols wide-left"><div>
      <div class="card"><div class="row spread"><h2 style="margin:0">Development Action Plan</h2>${ed ? '<button id="addObj">+ Add objective</button>' : ''}</div>
        <p class="small muted">Each objective gets a reference code (e.g. TECH1); activities in your record point to it. Keep an “Unplanned” objective for learning you did not plan.</p>
        ${['active', 'complete', 'archived'].map((st) => { const list = cpd().objectives.filter((o) => (o.status || 'active') === st); return list.length ? `<h3>${OBJ_STATUS[st]}</h3><table><thead><tr><th>Ref</th><th>Objective</th><th>Deadline</th><th>Activities</th></tr></thead><tbody>
          ${list.map((o) => `<tr class="click" data-href="#cpd/objective/${o.id}"><td><b>${esc(o.ref)}</b></td><td>${esc(o.title || o.area)}</td><td class="nowrap small">${fmtDate(o.deadline)}</td>
            <td class="nowrap">${cpd().activities.filter((a) => a.objective === o.id).length} · ${hoursFor(o)} h</td></tr>`).join('')}</tbody></table>` : ''; }).join('')}</div>
    </div><div>
      <div class="card"><div class="row spread"><h2 style="margin:0">Review of learning needs</h2>${ed ? '<button id="addReview">+ New review</button>' : ''}</div>
        <p class="small muted">At least once a year: look at your recent performance, what your employer and ICE expect, and your goals. A SWOT is a good way to do it.</p>
        ${reviews.map((r) => `<div class="mitem" data-id="${r.id}"><div class="row spread"><input type="date" class="rv" data-k="date" value="${esc(r.date)}"${dis(ed)}>${ed ? '<button class="small danger rv-del">✕</button>' : ''}</div>
          ${['strengths', 'weaknesses', 'opportunities', 'threats'].map((k) => `<label>${k[0].toUpperCase() + k.slice(1)}</label><textarea class="rv" data-k="${k}"${dis(ed)}>${esc(r[k] || '')}</textarea>`).join('')}
          <label>Conclusions: what I need to develop</label><textarea class="rv" data-k="notes"${dis(ed)}>${esc(r.notes || '')}</textarea></div>`).join('') || '<p class="muted">No review yet.</p>'}</div>
    </div></div>`;
}
function afterPlan() {
  $$('tr[data-href]').forEach((tr) => tr.addEventListener('click', () => { location.hash = tr.dataset.href; }));
  if (!canEdit()) return;
  $('#addObj').addEventListener('click', () => {
    const n = cpd().objectives.length;
    const o = { id: uid(), ref: 'OBJ' + n, title: '', date: today(), status: 'active', area: '', learn: '', action: '', resources: '', evaluate: '', deadline: '', notes: '' };
    cpd().objectives.push(o);
    changed();
    location.hash = '#cpd/objective/' + o.id;
  });
  $('#addReview').addEventListener('click', () => { cpd().reviews.push({ id: uid(), date: today(), strengths: '', weaknesses: '', opportunities: '', threats: '', notes: '' }); changed(); render(); });
  $$('.mitem[data-id]').forEach((card) => {
    const r = cpd().reviews.find((x) => x.id === card.dataset.id);
    $$('.rv', card).forEach((el) => el.addEventListener(el.type === 'date' ? 'change' : 'input', () => { r[el.dataset.k] = el.value; changed(); }));
    const del = $('.rv-del', card);
    if (del) del.addEventListener('click', async () => { if (await ask('Delete this review?', 'Delete')) { cpd().reviews.splice(cpd().reviews.indexOf(r), 1); changed(); render(); } });
  });
}

function cpdObjective(id) {
  const o = cpd().objectives.find((x) => x.id === id);
  if (!o) return '<div class="empty">Objective not found.</div>';
  const ed = canEdit();
  const acts = cpd().activities.filter((a) => a.objective === o.id);
  const area = (field, labelText) => `<div class="full"><label>${labelText}</label><textarea data-field="${field}"${dis(ed)}>${esc(o[field] || '')}</textarea></div>`;
  return `<a href="#cpd/plan">← Development plan</a>
    <div class="cols wide-left" style="margin-top:8px"><div class="card"><div class="form-grid">
      <div><label>Reference</label><input data-field="ref" value="${esc(o.ref)}"${dis(ed)}></div>
      <div><label>Date</label><input type="date" data-field="date" value="${esc(o.date)}"${dis(ed)}></div>
      <div><label>Status</label><select data-field="status"${dis(ed)}>${Object.entries(OBJ_STATUS).map(([k, v]) => `<option value="${k}" ${o.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      <div class="full"><label>Short title</label><input data-field="title" value="${esc(o.title || '')}"${dis(ed)}></div>
      ${area('area', 'In what area do I need to improve my performance?')}
      ${area('learn', 'What do I need to learn in order to achieve this?')}
      ${area('action', 'What will I do to achieve this?')}
      ${area('resources', 'What are the likely resources and support that I will need?')}
      ${area('evaluate', 'How will I evaluate a successful outcome?')}
      <div><label>Deadline</label><input type="date" data-field="deadline" value="${esc(o.deadline || '')}"${dis(ed)}></div>
    </div></div>
    <div><div class="card"><h2>Activities (${acts.reduce((n, a) => n + (+a.hours || 0), 0)} h)</h2>${acts.length ? `<ul class="list-plain">${acts.map((a) => `<li><a href="#cpd/activity/${a.id}">${esc(a.details || '(no details)')}</a> <span class="small muted">${fmtDate(a.dateFrom)} · ${esc(a.hours)} h</span></li>`).join('')}</ul>` : '<p class="muted">None yet.</p>'}</div>
      ${ed ? `<button class="danger" id="delObj">Delete objective</button>` : ''}</div></div>`;
}
function afterObjective(id) {
  const o = cpd().objectives.find((x) => x.id === id);
  if (!o || !canEdit()) return;
  bindFields($('#main'), o);
  $('#delObj').addEventListener('click', async () => {
    const n = cpd().activities.filter((a) => a.objective === o.id).length;
    if (!(await ask(`Delete objective ${esc(o.ref)}?${n ? ` Its ${plural(n, 'activity', 'activities')} stay, without a plan reference.` : ''}`, 'Delete'))) return;
    for (const a of cpd().activities) if (a.objective === o.id) a.objective = '';
    cpd().objectives.splice(cpd().objectives.indexOf(o), 1);
    changed();
    location.hash = '#cpd/plan';
  });
}

function cpdExport() {
  const pr = P().profile;
  const ed = canEdit();
  return `<div class="cols"><div class="card"><h2>About you (printed at the top)</h2><div class="form-grid">
      <div class="full"><label>Job role</label><input id="pfRole" value="${esc(pr.jobRole)}"${dis(ed)}></div>
      <div class="full"><label>Responsibilities</label><textarea id="pfResp"${dis(ed)}>${esc(pr.responsibilities)}</textarea></div>
      <div class="full"><label>Engineering sector</label><input id="pfSector" value="${esc(pr.sector)}"${dis(ed)}></div></div></div>
    <div class="card"><h2>Export</h2><p class="small muted">Word files in the layout of ICE's CPD templates (Appendix A: development action plan, Appendix B: personal development record), saved in <code>${FOLDERS.exports}</code>. ICE accepts these for the Professional Review and the annual audit.</p>
      <label>CPD year</label><select id="exYear">${cpdYears().map((y) => `<option value="${y}">${cpdYearLabel(y)}</option>`).join('')}<option value="all">All years</option></select>
      <div class="row" style="margin-top:1rem"><button class="primary" id="exWord">Export to Word</button><button id="exXlsx">Export to Excel</button></div></div></div>`;
}
function afterExport() {
  if (canEdit()) {
    const pr = P().profile;
    $('#pfRole').addEventListener('input', (e) => { pr.jobRole = e.target.value; changed(); });
    $('#pfResp').addEventListener('input', (e) => { pr.responsibilities = e.target.value; changed(); });
    $('#pfSector').addEventListener('input', (e) => { pr.sector = e.target.value; changed(); });
  }
  $('#exWord').addEventListener('click', (e) => act(e.currentTarget, () => exportCpdWord($('#exYear').value), (p) => 'Saved ' + p));
  $('#exXlsx').addEventListener('click', (e) => act(e.currentTarget, () => exportCpdExcel($('#exYear').value), (p) => 'Saved ' + p));
}

function cpdSelection(year) {
  const acts = cpd().activities.filter((a) => year === 'all' || String(cpdYear(a.dateFrom)) === year).sort((a, b) => (a.dateFrom || '').localeCompare(b.dateFrom || ''));
  const used = new Set(acts.map((a) => a.objective));
  const objs = cpd().objectives.filter((o) => used.has(o.id) || o.status === 'active');
  return { acts, objs, label: year === 'all' ? 'all years' : cpdYearLabel(+year) };
}

async function exportCpdWord(year) {
  const { acts, objs, label } = cpdSelection(year);
  const pr = P().profile;
  const who = [{ type: 'p', text: `Name: ${P().name}` }, { type: 'p', text: `Job role, responsibilities, and engineering sector: ${[pr.jobRole, pr.responsibilities, pr.sector].filter(Boolean).join('; ')}` }];
  const reviews = cpd().reviews.filter((r) => year === 'all' || String(cpdYear(r.date)) === year);
  const blocks = [
    { type: 'title', text: `CPD development action plan (${label})` }, ...who,
    { type: 'h1', text: 'Review of learning needs' },
    ...(reviews.length ? reviews.flatMap((r) => [{ type: 'small', text: fmtDate(r.date) }, ...['strengths', 'weaknesses', 'opportunities', 'threats', 'notes'].filter((k) => r[k]).map((k) => ({ type: 'p', text: `${k === 'notes' ? 'Conclusions' : k[0].toUpperCase() + k.slice(1)}: ${r[k]}` }))]) : [{ type: 'p', text: '' }]),
    { type: 'h1', text: 'Development plan' },
    { type: 'table', widths: [1300, 1100, 2050, 2050, 2050, 2050, 2050, 1400], rows: [['Date', 'Ref', 'In what area do I need to improve my performance?', 'What do I need to learn in order to achieve this?', 'What will I do to achieve this?', 'What are the likely resources and support that I will need?', 'How will I evaluate a successful outcome?', 'What are my deadlines for meeting this target?'],
      ...objs.map((o) => [fmtDate(o.date), o.ref, o.area || o.title, o.learn, o.action, o.resources, o.evaluate, fmtDate(o.deadline)])] },
    { type: 'title', text: `CPD personal development record (${label})` }, ...who,
    { type: 'table', widths: [2400, 1500, 1100, 900, 1700, 1700, 1700, 1700, 1700], rows: [['Details of CPD activity (and ICE CPD Framework theme)', 'Dates', 'Effective learning time', 'Dev. plan ref.', 'Key learning points', 'Key benefits / value added', 'How has this learning activity helped you?', 'How will the learning be used in the future?', 'How will this influence my DAP next year?'],
      ...acts.map((a) => [a.details + (a.theme ? `\nTheme: ${a.theme}` : '') + (a.type ? `\n(${a.type})` : ''), fmtDate(a.dateFrom) + (a.dateTo && a.dateTo !== a.dateFrom ? ' – ' + fmtDate(a.dateTo) : ''), a.hours ? a.hours + ' h' : '', (objectiveOf(a) || {}).ref || '', a.learning, a.benefits, a.helped, a.future, a.dap])] },

// ---------- Excel matrix ----------
async function exportMatrix() {
  await scanEvidence();
  await loadReports();
  const items = evidenceItems().filter((i) => !i.missing).sort((a, b) => natural(a.code || 'zz' + a.title, b.code || 'zz' + b.title));
  const cov = coverage();
  const prr = prrBySub();
  const fb = feedbackItems();
  const levelCell = (it, sub) => { const ls = ((it.rec && it.rec.maps) || []).filter((m) => m.sub === sub).map((m) => LEVEL_SHORT[m.level]); return ls.length ? { v: ls.sort().join(''), s: 'good' } : ''; };
  const g = goal();
  const status = (n) => ({ v: `${n}/${g}`, s: n >= g ? 'good' : n ? 'part' : 'none' });
  const sheets = [
    { name: 'Evidence Matrix', freeze: { rows: 1, cols: 2 }, filter: true, widths: [9, 40, 22, 11, ...SUBS.map(() => 5), 18, 40],
      rows: [['Code', 'Title', 'Project', 'Date', ...SUBS.map((a) => a.id), 'KSBs', 'File'],
        ...items.map((it) => [it.code, it.title, (it.rec && it.rec.project) || '', (it.rec && it.rec.date) || '', ...SUBS.map((a) => levelCell(it, a.id)),
          [...new Set(((it.rec && it.rec.maps) || []).flatMap((m) => m.ksbs || []))].sort(natural).join(', '), it.path])] },
    { name: 'Summary', freeze: { rows: 1 }, filter: true, widths: [6, 30, 6, 60, ...LEVELS.map(() => 7), 10, 12, 10, 14, 40],
      rows: [['Attr.', 'Attribute', 'Sub', 'Sub-attribute', ...LEVELS.map((l) => LEVEL_SHORT[l]), 'Slots', 'PRR', 'Open comments', 'Mentor', 'Evidence'],
        ...SUBS.map((a) => [a.group, a.group_title, a.id, { v: a.text, s: 'wrap' }, ...LEVELS.map((l) => status(cov[a.id][l].length)),
          `${slots(cov[a.id])}/${slotMax(cov[a.id])}`, prr[a.id].state, fb.filter((f) => f.sub === a.id && f.status === 'open').length, M() ? MENTOR_STATUS[(M().subs[a.id] || {}).status || ''] : '',
          [...new Set(LEVELS.flatMap((l) => cov[a.id][l].map(label)))].sort(natural).join(', ')])] },
    { name: 'KSBs', freeze: { rows: 1 }, widths: [6, 80, 16, 30], rows: [['KSB', 'Description', 'Sub-attributes', 'Evidence (ticked)'],
      ...KSBS.map((k) => { const c = ksbCoverage()[k.id]; return [k.id, { v: k.text, s: 'wrap' }, k.attributes.join(', '), [...c.direct].map(label).join(', ')]; })] },
    { name: 'Mentor feedback', freeze: { rows: 1 }, filter: true, widths: [6, 16, 12, 60, 60, 12, 30], rows: [['Sub', 'From', 'Date', 'Comment', 'Response', 'Status', 'File'],
      ...fb.map((f) => [f.sub, f.author, (f.date || '').slice(0, 10), { v: f.text, s: 'wrap' }, { v: f.response, s: 'wrap' }, FB_STATUS[f.status], f.file])] },
    { name: 'Actions', freeze: { rows: 1 }, filter: true, widths: [12, 30, 70, 6, 12, 8], rows: [['Meeting', 'Title', 'Action', 'Sub', 'Due', 'Status'],
      ...allActions().map((a) => [a.meeting.date, a.meeting.title, { v: a.text, s: 'wrap' }, a.sub, a.due, a.status === 'done' ? 'Done' : 'Open'])] },
    ...cpdSheets('all'),
  ];
  const path = `${FOLDERS.matrix}/ICE evidence matrix ${today()}.xlsx`;
  await writeFile(S.own, path, makeXlsx(sheets));
  return path;
}

          <div><label>Tab name for the standards (leave the list empty to hide the tab)</label><input id="fwLabelKsb" value="${esc(LABEL.ksb)}"${dd}></div></div>
        <label>Start from</label><div class="row"><select id="fwPreset"${dd}><option value="">Choose…</option>${Object.entries(PRESETS).map(([k, p]) => `<option value="${k}">${esc(p.name)}</option>`).join('')}</select><span class="small muted">replaces everything in the boxes below (nothing is saved until you press Save)</span></div></div>
      <div class="card"><h2>Levels</h2><p class="small muted">Letters | Name | What it means. Each requirement needs the goal number of evidence items at every level (set in Settings). One level is fine.</p>
        <textarea id="fwLevels"${rows(4)}${dd}>${esc(toLevelText(fw))}</textarea></div>
      <div class="card"><h2>Groups</h2><p class="small muted">Group id | Title. Groups collect requirements, for example one per attribute, unit or competence area.</p>
        <textarea id="fwGroups"${rows(8)}${dd}>${esc(toGroupText(fw))}</textarea></div>
      <div class="card"><h2>Folders</h2><p class="small muted">Folder names inside your portfolio folder. New names are created when you save; existing folders are not renamed or moved.</p>
        <div class="form-grid">${Object.keys(DEFAULT_FOLDERS).map((k) => `<div><label>${FOLDER_LABELS[k]}</label><input data-folder="${k}" value="${esc(fw.folders[k] || DEFAULT_FOLDERS[k])}"${dd}></div>`).join('')}</div>
        <label>Kinds of evidence (folders inside the evidence folder, one per line; end with " - " and 2 or 3 letters for the code, e.g. <code>4 - Calculations - CA</code>)</label>
        <textarea id="fwEvFolders"${rows(9)}${dd}>${esc((fw.evidenceFolders || []).join('\n'))}</textarea></div>
    </div>
    <div class="card"><h2>Requirements</h2><p class="small muted">Id | Group id | Text, then optionally <code>| needs: K</code> to say the requirement is met by evidence at that level or above (otherwise every level needs evidence). The id is what you write in report headings, for example <code>2b – Contribute to…</code>.</p>
      <textarea id="fwAttrs"${rows(14)}${dd}>${esc(toAttrText(fw))}</textarea></div>
    <div class="card"><h2>Standards (optional, such as KSBs)</h2><p class="small muted">Id | Type | Text | Requirement ids it relates to (comma separated). Leave empty if your scheme has none.</p>
      <textarea id="fwKsbs"${rows(10)}${dd}>${esc(toKsbText(fw))}</textarea></div>
    ${ed ? '<div class="row"><button class="primary" id="fwSave">Save framework</button><span class="small muted">The tool checks the lines first and tells you which one is wrong.</span></div>' : ''}`;
};
VIEWS.framework.after = () => {
  const val = (id) => $(id).value;
  const fill = (fw) => {
    $('#fwName').value = fw.name; $('#fwLabelAttr').value = (fw.labels || {}).attr || 'Attributes'; $('#fwLabelKsb').value = (fw.labels || {}).ksb || 'KSBs';
    $('#fwLevels').value = toLevelText(fw); $('#fwGroups').value = toGroupText(fw); $('#fwAttrs').value = toAttrText(fw); $('#fwKsbs').value = toKsbText(fw);
    $('#fwEvFolders').value = (fw.evidenceFolders || []).join('\n');
    for (const i of $$('[data-folder]')) i.value = (fw.folders || {})[i.dataset.folder] || DEFAULT_FOLDERS[i.dataset.folder];
  };
  const read = () => {
    const folders = {};
    for (const i of $$('[data-folder]')) folders[i.dataset.folder] = i.value;
    return buildFramework({ name: val('#fwName'), labelAttr: val('#fwLabelAttr'), labelKsb: val('#fwLabelKsb'), levels: val('#fwLevels'), groups: val('#fwGroups'), attributes: val('#fwAttrs'), ksbs: val('#fwKsbs'), evidenceFolders: val('#fwEvFolders'), folders }, FRAMEWORK);
  };
  $('#fwPreset').addEventListener('change', (e) => { if (e.target.value) { fill(PRESETS[e.target.value].fw); e.target.value = ''; toast('Filled in: press Save to use it'); } });
  $('#fwExport').addEventListener('click', () => {
    let fw;
    try { fw = canEdit() ? read() : FRAMEWORK; } catch (err) { return toast(err.message, 'error'); }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([JSON.stringify({ format: 'ice-tool/framework-1', ...fw }, null, 1)], { type: 'application/json' }));
    a.download = `${slug(fw.name) || 'framework'}.json`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
  if ($('#fwImport')) {
    $('#fwImport').addEventListener('click', () => $('#fwFile').click());
    $('#fwFile').addEventListener('change', async (e) => {
      try {
        const fw = JSON.parse(await e.target.files[0].text());
        if (!fw || !Array.isArray(fw.levels) || !Array.isArray(fw.attributes)) throw new Error('That file is not a framework exported from this tool');
        fill({ labels: {}, groups: [], ksbs: [], folders: {}, evidenceFolders: [], ...fw });
        toast('Loaded: check it, then press Save');
      } catch (err) { toast(err.message, 'error'); }
      e.target.value = '';
    });
  }
  if ($('#fwSave')) $('#fwSave').addEventListener('click', (e) => act(e.currentTarget, async () => {
    const fw = read();
    P().framework = fw;
    applyFramework(fw);
    await ensureFolders(S.own, P().mode);
    changed();
    await save();
    await scanEvidence();
    await loadReports();
    await render();
  }, 'Framework saved'));
};

</script>

</body>
</html>
