<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">

<title>Pathway Pro</title>
<!-- Pathway Pro 2026-11-05: a tracker for a professional review portfolio and CPD. One file, no install, no internet,
     no AI. Open in Microsoft Edge or Google Chrome. Source and licence notes: see "How to use Pathway Pro". -->
<style>
:root {
  --bg: #f5f6f8; --panel: #ffffff; --ink: #1d2330; --muted: #5f6b7a; --line: #dde1e7; --soft: #eef1f5;
  --accent: #1f5fae; --accent-ink: #ffffff; --accent-soft: #e3edf9;
  --good: #1e7b45; --good-soft: #def3e6; --part: #946200; --part-soft: #fff1cc; --bad: #b42323; --bad-soft: #fde2e2;
  --info: #4a5a70; --mark: #fff3a3;
  --radius: 8px; --shadow: 0 1px 2px rgba(20, 30, 50, .06), 0 2px 8px rgba(20, 30, 50, .05);
  font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; font-size: 14.5px; color: var(--ink);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15181d; --panel: #1d2128; --ink: #e5e8ec; --muted: #9aa4b2; --line: #313844; --soft: #252a33;
    --accent: #6ea8f0; --accent-ink: #0d1520; --accent-soft: #1f3048;
    --good: #5fcf8c; --good-soft: #193a28; --part: #e6b94c; --part-soft: #3d3215; --bad: #f08080; --bad-soft: #452222;
    --info: #b5c0cf; --mark: #5a5220; --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); line-height: 1.45; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
h1 { font-size: 1.45rem; margin: 0 0 .6rem; font-weight: 600; }
h2 { font-size: 1.15rem; margin: 1.3rem 0 .5rem; font-weight: 600; }
h3 { font-size: 1rem; margin: 1rem 0 .4rem; font-weight: 600; }
p { margin: .4rem 0; }
code, kbd { font-family: Consolas, "Cascadia Mono", monospace; font-size: .9em; }
kbd { border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 .3em; background: var(--panel); }
.muted { color: var(--muted); }
.small { font-size: .88rem; }
.good { color: var(--good); } .bad { color: var(--bad); } .part { color: var(--part); }
.nowrap { white-space: nowrap; }
.right { text-align: right; }
.hidden { display: none !important; }

/* ---------- top bar ---------- */
header.top { position: sticky; top: 0; z-index: 20; background: var(--panel); border-bottom: 1px solid var(--line); box-shadow: var(--shadow); }
header.top .bar { display: flex; align-items: center; gap: .25rem; padding: 0 24px; min-height: 48px; flex-wrap: wrap; }
header.top .brand { font-weight: 700; margin-right: .8rem; color: var(--ink); white-space: nowrap; }
header.top .brand small { font-weight: 400; color: var(--muted); margin-left: .4rem; }
nav.tabs { display: flex; gap: 2px; flex-wrap: wrap; }
nav.tabs a { padding: .75rem .7rem .65rem; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs a:hover { color: var(--ink); text-decoration: none; background: var(--soft); }
nav.tabs a.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
nav.tabs a .count { display: inline-block; min-width: 1.4em; padding: 0 .35em; margin-left: .25em; border-radius: 999px; background: var(--bad-soft); color: var(--bad); font-size: .78rem; text-align: center; }
.top-right { margin-left: auto; display: flex; align-items: center; gap: .6rem; }
.save-state { font-size: .82rem; color: var(--muted); white-space: nowrap; }
.save-state.bad { color: var(--bad); font-weight: 600; }
#search { width: 15rem; max-width: 40vw; }
.search-wrap { position: relative; }
#searchResults { position: absolute; right: 0; top: 2.4rem; width: min(34rem, 92vw); max-height: 70vh; overflow: auto; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: 0 8px 30px rgba(0,0,0,.18); z-index: 40; }
#searchResults a { display: block; padding: .45rem .7rem; color: var(--ink); border-bottom: 1px solid var(--soft); }
#searchResults a:hover, #searchResults a.sel { background: var(--accent-soft); text-decoration: none; }
#searchResults .kind { display: inline-block; width: 5.5rem; color: var(--muted); font-size: .8rem; }

main { padding: 24px 24px 60px; max-width: 2600px; margin: 0 auto; }
.banner { padding: .6rem .9rem; border-radius: var(--radius); margin-bottom: .8rem; background: var(--part-soft); color: var(--ink); border: 1px solid var(--line); }
.banner.bad { background: var(--bad-soft); }
.banner.info { background: var(--accent-soft); }

/* ---------- building blocks ---------- */
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow); margin-bottom: 14px; }
.card > h2:first-child, .card > h3:first-child { margin-top: 0; }
.grid { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(330px, 100%), 1fr)); align-items: start; }
.cols { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
.cols.wide-left { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
@media (max-width: 1000px) { .cols, .cols.wide-left { grid-template-columns: 1fr; } }
.row { display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
.row.spread { justify-content: space-between; }
.stack > * + * { margin-top: .5rem; }

button, .btn { font: inherit; padding: .42rem .85rem; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: .35rem; white-space: nowrap; transition: background .12s, transform .05s; }
button:hover, .btn:hover { background: var(--soft); text-decoration: none; }
button:active, .btn:active { transform: translateY(1px); }
button.primary, .btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.primary:hover { filter: brightness(1.08); }
button.danger { color: var(--bad); }
button.small, .btn.small { padding: .2rem .55rem; font-size: .85rem; }
button:disabled { opacity: .55; cursor: default; }
button.busy { position: relative; color: transparent !important; }
button.busy::after { content: ""; position: absolute; left: calc(50% - .5em); top: calc(50% - .5em); width: 1em; height: 1em; border: 2px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
button.done { outline: 2px solid var(--good); }
button.failed { outline: 2px solid var(--bad); }
@keyframes spin { to { transform: rotate(360deg); } }
button.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

input, select, textarea { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: .38rem .55rem; max-width: 100%; }
input:focus, select:focus, textarea:focus, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
textarea { width: 100%; min-height: 4.2rem; resize: vertical; }
input:disabled, select:disabled, textarea:disabled { background: var(--soft); color: var(--muted); }
label { display: block; font-size: .85rem; color: var(--muted); margin: .55rem 0 .15rem; }
.form-grid { display: grid; gap: 0 14px; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.form-grid .full { grid-column: 1 / -1; }
.form-grid input, .form-grid select { width: 100%; }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: .6rem .8rem; border-bottom: 1px solid var(--soft); vertical-align: top; }
th { font-size: .82rem; color: var(--muted); font-weight: 600; background: var(--panel); white-space: nowrap; }
/* Sticky headers only where nothing scrolls sideways and the top bar stays one line; elsewhere they overlapped the first row. */
@media (min-width: 1200px) { table:not(.table-wrap table) th { position: sticky; top: 49px; z-index: 1; } }
table.attr td:nth-child(2) { min-width: 18rem; }
table.attr td:nth-child(3) { white-space: nowrap; }
table.attr td:nth-child(4) { min-width: 8rem; overflow-wrap: anywhere; }
table.attr td, table.attr th { padding-top: .7rem; padding-bottom: .7rem; }
td.nowrap + td { padding-left: 1rem; }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--accent-soft); }
.table-wrap { overflow-x: auto; }

.chip { display: inline-block; padding: .05rem .45rem; border-radius: 999px; font-size: .8rem; background: var(--soft); color: var(--ink); margin: 1px 2px 1px 0; white-space: nowrap; border: 1px solid transparent; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.part { background: var(--part-soft); color: var(--part); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.outline { background: transparent; border-color: var(--line); }

.bar-meter { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; min-width: 60px; }
.bar-meter > span { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.bar-meter.good > span { background: var(--good); }
.big-number { font-size: 2rem; font-weight: 700; line-height: 1.1; }
.kpis { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin-bottom: 14px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; box-shadow: var(--shadow); }
.kpi .label { color: var(--muted); font-size: .85rem; }

/* K/E/A slots */
.slots { display: inline-flex; gap: 3px; vertical-align: middle; }
.slots .lvl { display: inline-flex; gap: 2px; padding-right: 4px; }
.slots i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; background: var(--soft); border: 1px solid var(--line); }
.slots i.on { background: var(--good); border-color: var(--good); }
.slots b { font-size: .7rem; color: var(--muted); margin-right: 1px; }

/* Mapping grid on an evidence page */
.map-grid { display: grid; gap: 4px 12px; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); }
.map-row { display: flex; align-items: center; gap: 4px; padding: 2px 0; }
.map-row .sid { width: 2.3rem; font-weight: 600; }
.map-row .stext { flex: 1; font-size: .82rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.map-row button { padding: .1rem .45rem; font-size: .8rem; min-width: 1.9rem; justify-content: center; }
.group-title { grid-column: 1 / -1; font-weight: 600; margin-top: .5rem; border-bottom: 1px solid var(--line); padding-bottom: 2px; }

.issue { font-size: .85rem; padding: .15rem 0; }
.issue::before { display: inline-block; width: 1.2rem; font-weight: 700; }
.issue.error { color: var(--bad); } .issue.error::before { content: "✕"; }
.issue.warn { color: var(--part); } .issue.warn::before { content: "!"; }
.issue.info { color: var(--info); } .issue.info::before { content: "i"; }

.quote { border-left: 3px solid var(--line); padding: .2rem .6rem; color: var(--muted); margin: .3rem 0; font-size: .9rem; }
.fb { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; margin-bottom: 10px; background: var(--panel); }
.fb.done { opacity: .72; }
.fb .meta { font-size: .82rem; color: var(--muted); }
.fb .text { margin: .35rem 0; white-space: pre-wrap; }
.reply { margin: .3rem 0 0 1rem; font-size: .9rem; }

/* transcript tagging */
.transcript { max-height: calc(100vh - 210px); overflow: auto; border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); }
.tline { display: grid; grid-template-columns: 3.6rem 8rem 1fr auto; gap: 8px; padding: 5px 10px; border-bottom: 1px solid var(--soft); align-items: start; }
.tline.sel { background: var(--accent-soft); }
.tline .who { font-weight: 600; font-size: .85rem; overflow: hidden; text-overflow: ellipsis; }
.tline .when { color: var(--muted); font-size: .8rem; }
.tline .tags { display: flex; gap: 2px; }
.tline .tags button { padding: .05rem .4rem; font-size: .78rem; }
.tline.t-done { border-left: 4px solid var(--good); }
.tline.t-todo { border-left: 4px solid var(--part); }
.tline.t-teaching { border-left: 4px solid var(--accent); }
.item-kind-done { border-left: 4px solid var(--good); }
.item-kind-todo { border-left: 4px solid var(--part); }
.item-kind-teaching { border-left: 4px solid var(--accent); }
.mitem { padding: 6px 8px; margin-bottom: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
.mitem textarea { min-height: 2.6rem; }

/* preview drawer */
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(46vw, 900px); min-width: 320px; background: var(--panel); border-left: 1px solid var(--line); box-shadow: -6px 0 24px rgba(0,0,0,.18); z-index: 50; display: flex; flex-direction: column; }
#drawer header { display: flex; gap: .5rem; align-items: flex-start; padding: 10px 12px; border-bottom: 1px solid var(--line); }
#drawer header > div { flex: 1; min-width: 0; overflow-wrap: anywhere; }
#drawerBody { flex: 1; overflow: auto; }
.drawer-grip { position: absolute; left: -4px; top: 0; bottom: 0; width: 8px; cursor: ew-resize; }
iframe.preview, img.preview { width: 100%; height: 100%; border: 0; display: block; background: #fff; }
img.preview { object-fit: contain; height: auto; max-height: 100%; }
.preview-inline { position: sticky; top: 60px; height: calc(100vh - 80px); min-height: 400px; border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; background: var(--panel); }
.docx-view { padding: 18px 24px; max-width: 60rem; }
.docx-view h1 { font-size: 1.4rem; } .docx-view h2 { font-size: 1.15rem; } .docx-view h3 { font-size: 1rem; }
.docx-view mark { background: var(--mark); color: inherit; }
.doc-comment { margin: .2rem 0 .6rem 1rem; padding: .3rem .6rem; border-left: 3px solid var(--part); background: var(--part-soft); font-size: .9rem; }
pre.text-view { white-space: pre-wrap; padding: 16px; margin: 0; font-size: .9rem; }

/* dialogs and toasts */
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); padding: 18px 20px; max-width: min(640px, 94vw); box-shadow: 0 12px 40px rgba(0,0,0,.25); }
dialog::backdrop { background: rgba(10, 15, 25, .45); }
#toasts { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 100; align-items: center; }
.toast { background: var(--ink); color: var(--bg); padding: .55rem 1rem; border-radius: 8px; box-shadow: 0 6px 20px rgba(0,0,0,.25); transition: opacity .4s; max-width: 90vw; }
.toast.error { background: var(--bad); color: #fff; }
.toast.warn { background: var(--part); color: #fff; }
.toast.gone { opacity: 0; }

/* welcome */
.welcome { max-width: 920px; margin: 30px auto; }
.welcome .choices { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); margin: 18px 0; }
.welcome .choice { text-align: left; display: block; padding: 16px; white-space: normal; height: 100%; }
.welcome .choice b { display: block; font-size: 1.05rem; margin-bottom: .3rem; }

.sub-tabs { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
.sub-tabs a { padding: .35rem .8rem; border-radius: 999px; border: 1px solid var(--line); color: var(--ink); background: var(--panel); }
.sub-tabs a.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.sub-tabs a:hover { text-decoration: none; }
.list-plain { list-style: none; padding: 0; margin: 0; }
.list-plain li { padding: .3rem 0; border-bottom: 1px solid var(--soft); }
.empty { padding: 1.4rem; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: var(--radius); }

@media print {
  header.top, #drawer, #toasts, button, .no-print { display: none !important; }
  body { background: #fff; } .card { box-shadow: none; break-inside: avoid; }
  th { position: static; }
}
@media (max-width: 700px) {
  main { padding: 14px 12px 50px; }
  .card { padding: 14px 14px; }
  header.top .bar { padding: 0 12px; }
  th, td { padding: .5rem .55rem; }
  .tline { grid-template-columns: 1fr; }
  #search { width: 9rem; }
}

</style>
</head>

erate an innovative design for products, systems, components or processes, that meets defined needs (eg user, business & customer) and takes into account applicable health and safety, diversity, inclusion, cultural, societal, environmental and commercial matters, codes of practice and industry standards."],["4.1","4","Evaluate the environmental and societal impact of sustainable solutions to complex problems (to include the entire lifecycle of a product or process) and minimise adverse impacts."],["4.2","4","Identify and analyse ethical concerns and make reasoned ethical choices informed by professional codes of conduct."],["5.1","5","Apply a thorough understanding of current engineering technologies, practice and processes (including workshop & laboratory skills) and their limitations when solving complex problems. Maintain awareness of likely new developments."],["5.2","5","Apply an extensive knowledge and understanding engineering materials and components."],["5.3","5","Apply engineering techniques, taking account of industrial constraints, including the role of quality management and commercial aspects such as legal matters and intellectual property rights."],["5.4","5","Communicate effectively on complex engineering matters with technical and non-technical audiences."],["6.1","6","Apply an extensive knowledge and understanding of engineering management, including project and change management as well as business practices, and their limitations, and how these may be applied appropriately."],["6.2","6","Adopt an inclusive approach to engineering practice and recognise the responsibilities, benefits and importance of supporting equality, diversity and inclusion (EDI) and promote EDI in your work."],["6.3","6","Understand the different roles within a team. Function effectively whether leading, as a member or as an individual."],["6.4","6","Evaluate effectiveness of own and team performance."],["6.5","6","Develop, monitor and update, on an on-going basis, a plan, t const IPD_DATA = {"cm":[{"num":"1","title":"PROFESSIONAL STANDARDS AND ENGINEERING RESPONSIBILITY","level":"Knowledge","intro":"This objective is intended to demonstrate knowledge of professional conduct, a commitment to continuous professional development and engagement with the Institution and wider industry.","must":["the structure and purpose of the Institution of Structural Engineers, together with an awareness of the Institution’s Code of Conduct","an involvement in Institution affairs appropriate to their individual circumstances and location","the limits of their technical competency in recognising complexity in problems and solution methods","the importance of sharing knowledge and data across the industry","the importance of CPD, the Institution requirements for CPD and a record of appropriate training","their need to plan for an ongoing commitment to CPD","being supportive of the needs and concerns of others, especially where this relates to diversity and inclusion","the ethical issues that could arise in their role and how they should carry out their responsibilities in an ethical manner"]},{"num":"2","title":"COMMUNICATION","level":"Ability","intro":"This objective is intended to demonstrate candidates have an ability to communicate effectively in a variety of situations and demonstrate appropriate interpersonal skills.","must":["produce appropriate drawings, sketches, or models (physical or digital) to communicate ideas","produce formal reports","produce both formal and informal communications appropriately","communicate verbally and demonstrate effective inter -personal skills","prepare and deliver presentations","produce documents suitable for a variety of appropriate audiences","create, maintain, and enhance productive working relationships, and resolve conflicts.","evaluate and provide positive critical feedback on the work of others","exchanging information and providing advice to technical and non -technical colleagues"]},{"num":"3","title":"CONC  vibration)","Analysis: understanding the limitations of the model and its outputs (approximations, simplifications, etc)","Analysis: verifying results through hand checks, simple approximation, and engineering judgement","Analysis: validation and verification of analysis or design methods","Analysis: identification of limitations in analysis and/or design methods either in terms of accuracy or capability","Sizing and detailing: sizing structures to minimise material usage within the agreed design criteria (e.g., strength, stiffness, durability/maintenance, buildability, etc.)","Sizing and detailing: designing structural details such as connections and reinforcement to the appropriate level of detail at each stage of design","Sizing and detailing: determining and utilising the capacity of existing structures and components through collection and analysis of appropriate information or data where relevant","Sizing and detailing: using appropriate standards, codes of practice, specifications, Institution publications, technical agency publications, bulletins, reports, commercial and relevant publications from other professional institutions etc., and applying the requirements or re commendations of these documents within specification or design criteria"]},{"num":"5","title":"MATERIALS","level":"Ability","intro":"This objective is intended to demonstrate an in -depth understanding of the structural materials used in the candidate’s work, along with an ability to specify and coordinate the use of such materials.","must":["the behaviour and structural properties (including strength, stiffness, ductility, and directionality) for different materials and their common grades/subgrades, and how these impact design and detailing requirements","the effects on carbon emissions related to production methods, material sourcing and supply chains","durability requirements","detailing requirements, including an appreciation of how these affect end -of-life disassembly and reuse","movement behaviour including creep, drying, and thermal movement Whilst candidates often choose to specialise in one or two materials (and thus will have developed an ability in determining their behaviour) they must still have some knowledge of the carbon credentials, availability, behaviour, cost, manufacture, princip al engineering properties and potential applications of a wider range of construction materials."]},{"num":"6","title":"SUSTAINABILITY","level":"Experience","intro":"This objective is intended to demonstrate experience in applying structural engineering in a way that minimises (and ultimately, reverses) negative environmental impacts whilst maximising societal benefit.","must":["communicating the environmental impact of a structural design to the design and client team","questioning the brief to reduce negative impacts whilst achieving the client’s desired outcomes","advocating for reuse and ‘build less’ design approaches","considering wider sustainability aspects within their work"]},{"num":"7","title":"CONSTRUCTION","level":"Experience","intro":"This objective is intended to demonstrate a candidate’s experience of the practical process to convert design work into completed structures and should demonstrate that they are able to contribute to this in a meaningful way. Practical experience of site c onditions and working practices is essential to the safe design and specification of projects.","must":["construction techniques, construction plant and machinery","designing, specifying, or reviewing temporary systems","reviewing construction programmes and construction sequencing","reviewing or producing fabrication or shop drawings","erection methodologies","identification and correction of potential errors","how their observations of construction/fabrication have informed their approach to design/buildability"]},{"num":"8","title":"HEALTH, SAFETY AND RISK MANAGEMENT","level":"Experience","intro":"This objective is intended to demonstrate a candidate’s experience in meeting health and safety requirements and legislation.","must":["using appropriate health and safety standards","engagement with CROSS (Collaborative Reporting for Safer Structures) https://www.cross -safety.org/uk","reviewing and applying learning from CROSS publications","producing risk and hazard assessments","designing out risk","safety on construction sites"]},{"num":"9","title":"MANAGEMENT","level":"Experience","intro":"This objective is intended to demonstrate a candidate’s experience of management skills for programming and control.","must":["management of individuals, teams, and data/information","leadership","programming and project control","interdisciplinary/inter team liaison and interface management","working within a quality management system","contributing to and working within a quality plan"]},{"num":"10","title":"COMMERCIAL AND LEGAL","level":"Knowledge","intro":"This objective is intended to demonstrate a candidate’s knowledge of commercial, financial, contractual, and legal matters relevant to the country and industry in which they work.","must":["commercial pressures within the construction industry including the effects of national and international current affairs on costs","the methods of calculating construction costs including estimating and monitoring the cost of design work","sensitivity of cost variations in construction techniques","relevant forms of contract used in projects for which they are involved, for both design and construction","the procurement routes relevant to the work in which they are involved and appropriate procurement issues including dispute resolution","statutory legislation, negligence/liability laws, health, and safety legislation","decarbonisation and sustainability legislation","contract law"]}],"im":[{"num":"1","title":"PROFESSIONAL STANDARDS AND ENGINEERING RESPONSIBILITY","level":"Knowledge","intro":"This objective is intended to demonstrate knowledge of professional conduct, a commitment to cont ution’s Code of Conduct","an involvement in Institution affairs appropriate to their individual circumstances and location","the limits of their technical competency in recognising complexity in problems and solution methods","the importance of sharing knowledge and data across the industry","the importance of CPD, the Institution requirements for CPD and a record of appropriate training","their need to plan for an ongoing commitment to CPD","being supportive of the needs and concerns of others, especially where this relates to diversity and inclusion","the ethical issues that may arise in their role and how they should carry out their responsibilities in an ethical manner"]},{"num":"2","title":"COMMUNICATION","level":"Ability","intro":"This objective is intended to demonstrate candidates have an ability to communicate effectively in a variety of situations and demonstrate appropriate interpersonal skills.","must":["produce appropriate drawings, sketches, or 3D models (physical or digital) to communicate ideas","contribute to the production of formal reports","produce both formal and informal communications appropriately","communicate verbally and demonstrate effective inter -personal skills","prepare and deliver presentations","produce documents suitable for a variety of appropriate audiences","create, maintain and enhance productive working relationships, and resolve conflicts","evaluate and provide positive critical feedback on the work of others","exchang e information and provid e advice to technical and non -technical colleagues"]},{"num":"3","title":"CONCEPT CREATION AND DESIGN","level":"Appreciation","intro":"This objective is intended to demonstrate an appreciation of the process of concept creation and design. This would include designing for safety, carbon, durability, reuse aesthetics and cost .","must":["the assessment of the brief to identify possible solutions","determining appropriate loading and design criteria","establishing load paths and stability systems","considering robustness and accidental actions, including fire","the process to estimate embodied carbon","the way construction issues impact on design choices","collaboration and coordination with other disciplines"]},{"num":"4","title":"DESIGN AND ANALYSIS","level":"Knowledge","intro":"This objective is intended to demonstrate knowledge of the processes involved in the analysis and design of structures .","must":["the processes involved with the design of individual components in at least one primary structural material (i.e. derivation of forces/stresses/deflections and maintaining equilibrium)","the application of appropriate loading criteria","the use of appropriate design standards, codes of practice etc","the elements within a structure which determine overall stability, robustness and structural integrity","limits of the structural model and its outputs (approximations, simplifications etc)","the verification of analysis using hand checks, simple approximation and engineering judgment"]},{"num":"5","title":"MATERIALS","level":"Knowledge","intro":"This objective is intended to demonstrate knowledge of how materials are specified and incorporated into the structure.","must":["the behaviour and structural properties (including strength, stiffness, ductility, and directionality) for different materials and their common grades/subgrades; and how these impact design and detailing requirements","the effects on carbon emissions related to production methods, material sourcing and supply chains","durability requirements","detailing requirements, including an appreciation of how these affect end -of-life disassembly and reuse","movement behaviour including creep, drying, and thermal movement. Whilst candidates often choose to specialise in one or two materials (and thus will have developed knowledge in determining their behaviour) they must still have some appreciation of the carbon credentials, availability, behaviour, cost, manufacture, princ ipal enginee ate health and safety standards","reviewing CROSS (Collaborative Reporting for Safer Structures) publications","communicating risk and hazard assessments","designing out risk","safety on construction/fabrication sites"]},{"num":"9","title":"MANAGEMENT","level":"Knowledge","intro":"This objective is intended to demonstrate a candidate’s knowledge of management skills and responsibility.","must":["contributing to the management of individuals/self and/or teams and data/information","cooperation with team leadership and management","programming and project control.","interdisciplinary/inter team liaison and interface management."]},{"num":"10","title":"COMMERCIAL","level":"Appreciation","intro":"This objective is intended to demonstrate a candidate’s appreciation of commercial, financial, and contractual matters relevant to the country and industry in which they work.","must":["commercial pressures within the construction industry, including the effects of national and international current affairs on the costs.","the methods of calculating construction costs, including estimating and monitoring the cost of design work.","sensitivity of cost variations in construction techniques.","relevant forms of contract used in projects for which they are involved, for both design and construction.","the procurement routes relevant to the work in which they are involved and the impact on their scope of work","the role of the expert witness In preparing their Summary Report Forms the candidate should be prepared to discuss their understanding of commercial matters and how they have affected the projects they have worked on."]},{"num":"11","title":"TECHNOLOGY, DOCUMENTATION & PROCESS","level":"Ability","intro":"This objective is intended to demonstrate ability in the production, control and management of engineering documentation and systems.","must":["the production of general arrangement drawings","the creation of detail drawings showing the interface between components and materials","the coordination of details and information received from other parts of the design team with the structural information","the control and documentation of information received from and issued to third parties","the use of standard procedures and drawing standards, either company specific or based on industry standards","the production of appropriate schedules (such as bar bending schedules, lintel schedules, beams schedules, pile schedules, material take offs for use in pricing or embodied carbon calculations)","the communication of risks and hazards","the implementation of and compliance with Project Quality Plans"]}]};

const REF = {"attributes":[{"id":"1a","group":1,"group_title":"Knowledge and Understanding of Engineering","text":"Maintain and extend knowledge of engineering theory and practice, and how technology assists its application."},{"id":"1b","group":1,"group_title":"Knowledge and Understanding of Engineering","text":"Solve engineering problems using a sound theoretical approach, based on evidence, and contribute to continuous improvement."},{"id":"2a","group":2,"group_title":"Technical and practical application of engineering","text":"Identify, review and select techniques, procedures and methods to undertake engineering tasks."},{"id":"2b","group":2,"group_title":"Technical and practical application of engineering","text":"Contribute to the design and development of engineering solutions"},{"id":"2c","group":2,"group_title":"Technical and practical application of engineering","text":"Implement engineering solutions, and evaluate their effectiveness in the context of the whole project life cycle."},{"id":"3a","group":3,"group_title":"Management and leadership","text":"Plan the work and resources needed to enable effective implementation of engineering tasks and projects."},{"id":"3b","group":3,"group_title":"Management and leadership","text":"Manage the planning and organisation of tasks and resources."},{"id":"3c","group":3,"group_title":"Management and leadership","text":"Assist others to meet changing technical and managerial needs."},{"id":"3d","group":3,"group_title":"Management and leadership","text":"Manage teams or technical specialisms."},{"id":"3e","group":3,"group_title":"Management and leadership","text":"Manage quality processes and contribute to quality improvements."},{"id":"4a","group":4,"group_title":"Independent judgement and responsibility","text":"Identify the limits of personal knowledge and skills."},{"id":"4b","group":4,"group_title":"Independent judgement and responsibility","text":"Exercise sound independent engineering judgement and take responsibility."},{"id":"5a","group":5,"group_title":"Commercial ability","text":"Manage, prepare and control costs/budgets of engineering tasks or projects."},{"id":"5b","group":5,"group_title":"Commercial ability","text":"Use sound knowledge of statutory and commercial frameworks within their own area of responsibility and have an appreciation of other commercial arrangements."},{"id":"6a","group":6,"group_title":"Health, safety and welfare","text":"Demonstrate a sound knowledge of legislation, hazards and safe systems of work."},{"id":"6b","group":6,"group_title":"Health, safety and welfare","text":"Manage risks"},{"id":"6c","group":6,"group_title":"Health, safety and welfare","text":"Manage health, safety and welfare within their own area of responsibility. Contribute to improvements in health, safety and welfare."},{"id":"7a","group":7,"group_title":"Sustainable development","text":"Understand the principles of sustainable development and apply them in work."},{"id":"7b","group":7,"group_title":"Sustainable development","text":"Manage engineering activities that contribute to sustainable development and the United Nations’ Sustainable Development Goals (UNSDGs)."},{"id":"8a","group":8,"group_title":"Interpersonal skills and communication","text":"Communicate well with others at all levels including effective use of English, orally and in writing."},{"id":"8b","group":8,"group_title":"Interpersonal skills and communication","text":"Discuss ideas and plans competently and with confidence."},{"id":"8c","group":8,"group_title":"Interpersonal skills and communication","text":"Demonstrate effective personal and social skills."},{"id":"8d","group":8,"group_title":"Interpersonal skills and communication","text":"Demonstrate awareness of diversity and inclusion."},{"id":"9a","group":9,"group_title":"Professional commitment","text":"Understand and comply with the ICE Code of Conduct."},{"id":"9b","group":9,"group_title":"Professional commitment","text":"Plan, carry out and rec const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function toast(message, kind = 'ok') {
  let box = $('#toasts');
  if (!box) { box = document.createElement('div'); box.id = 'toasts'; box.setAttribute('aria-live', 'polite'); document.body.append(box); }
  const t = document.createElement('div');
  t.className = 'toast ' + kind;
  t.textContent = message;
  box.append(t);
  setTimeout(() => t.classList.add('gone'), kind === 'error' ? 8000 : 3500);
  setTimeout(() => t.remove(), kind === 'error' ? 8500 : 4000);
}

// Run an action from a button: busy state while it runs, then a tick or a cross, and a message.
async function act(btn, fn, okMessage) {
  if (btn) { btn.classList.add('busy'); btn.disabled = true; }
  try {
    const result = await fn();
    if (btn) flash(btn, 'done');
    if (okMessage) toast(typeof okMessage === 'function' ? okMessage(result) : okMessage);
    return result;
  } catch (err) {
    console.error(err);
    if (btn) flash(btn, 'failed');
    toast('That did not work: ' + (err.message || err), 'error');
  } finally {
    if (btn) { btn.classList.remove('busy'); btn.disabled = false; }
  }
}

function flash(el, cls) {
  el.classList.add(cls);
  setTimeout(() => el.classList.remove(cls), 1600);
}

async function sha1(text) {
  const buf = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].slice(0, 8).map((b) => b.toString(16).padStart(2, '0')).join('');
}

function download(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

// "CA-00 to CA-18, CO-14" -> ['CA-00', ..., 'CA-18', 'CO-14']
const CODE_RE = /\b([A-Z]{2,3})-(\d{2,3})\b/g;
function expandCodes(text) {
  const out = [];
  const re = /\b([A-Z]{2,3})-(\d{2,3})\b(?:\s*(?:to|–|—|-)\s*(?:([A-Z]{2,3})-)?(\d{2,3})\b)?/g;
  let m;
  while ((m = re.exec(text))) {
    const [, prefix, from, prefix2, to] = m;
    if (to !== undefined && (!prefix2 || prefix2 === prefix) && +to >= +from && +to - +from < 200) {
      for (let n = +from; n <= +to; n++) out.push(`${prefix}-${String(n).padStart(from.length, '0')}`);
    } else {
      out.push(`${prefix}-${from}`);
    }
  }
  return [...new Set(out)];
}

// Natural sort: "CO-2" before "CO-10", "2b" before "10a".
const collator = new Intl.Collator('en', { numeric: true, sensitivity: 'base' });
const natural = (a, b) => collator.compare(a, b);

function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}

// Zip reading and writing with no library: Word and Excel files are zip packages of XML.
// Reading inflates with the browser's own DecompressionStream; writing stores files uncompressed,
// which Word and Excel open normally.

async function readZip(buffer) {
  const bytes = new Uint8Array(buffer);
  const view = new DataView(buffer);
  let eocd = -1;
  for (let i = bytes.length - 22; i >= Math.max(0, bytes.length - 65557); i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('not a zip file (is it an old .doc rather than .docx?)');
  const count = view.getUint16(eocd + 10, true);
  let p = view.getUint32(eocd + 16, true);
  const entries = {};
  const dec = new TextDecoder();
  for (let n = 0; n < count; n++) {
    if (view.getUint32(p, true) !== 0x02014b50) break;
    const method = view.getUint16(p + 10, true);
    const size = view.getUint32(p + 20, true);
    const nameLen = view.getUint16(p + 28, true);
    const extraLen = view.getUint16(p + 30, true);
    const commentLen = view.getUint16(p + 32, true);
    const local = view.getUint32(p + 42, true);
    const name = dec.decode(bytes.subarray(p + 46, p + 46 + nameLen));
    entries[name] = { method, size, local };
    p += 46 + nameLen + extraLen + commentLen;
  }
  const data = async (name) => {
    const e = entries[name];
    if (!e) return null;
    const start = e.local + 30 + view.getUint16(e.local + 26, true) + view.getUint16(e.local + 28, true);
    const raw = bytes.subarray(start, start + e.size);
    if (e.method === 0) return raw;
    if (e.method !== 8) throw new Error('unsupported zip compression in ' + name);
    const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  };
  return {
    names: Object.keys(entries),
    has: (name) => name in entries,
    bytes: data,
    text: async (name) => { const b = await data(name); return b ? dec.decode(b) : null; },
  };
}

const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
    t[n] = c >>> 0;
  }
  return t;
})();

function crc32(bytes) {
  let c = 0xffffffff;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xff] ^ (c >>> 8);
  return (c ^ 0xffffffff) >>> 0;
}

// files: {path: string | Uint8Array} -> Blob
function writeZip(files, type = 'application/zip') {
  const enc = new TextEncoder();
  const parts = [];
  const central = [];
  let offset = 0;
  const d = new Date();
  const time = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1);
  const date = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  for (const [path, content] of Object.entries(files)) {
    const name = enc.encode(path);
    const body = typeof content === 'string' ? enc.encode(content) : content;
    const crc = crc32(body);
    const head = new DataView(new ArrayBuffer(30));
    head.setUint32(0, 0x04034b50, true);
    head.setUint16(4, 20, true);
    head.setUint16(6, 0x0800, true); // UTF-8 names
    head.setUint16(8, 0, true);
    head.setUint16(10, time, true);
    head.setUint16(12, date, true);
    head.setUint32(14, crc, true);
    head.setUint32(18, body.length, true);
    head.setUint32(22, body.length, true);
    head.setUint16(26, name.length, true);
    parts.push(head, name, body);
    const cd = new DataView(new ArrayBuffer(46));
    cd.setUint32(0, 0x02014b50, true);
    cd.setUint16(4, 20, true);
    cd.setUint16(6, 20, true);
    cd.setUint16(8, 0x0800, true);
    cd.setUint16(12, time, true);
    cd.setUint16(14, date, true);
    cd.setUint32(16, crc, true);
    cd.setUint32(20, body.length, true);
    cd.setUint32(24, body.length, true);
    cd.setUint16(28, name.length, true);
    cd.setUint32(42, offset, true);
    central.push(cd, name);
    offset += 30 + name.length + body.length;
  }
  const cdSize = central.reduce((n, x) => n + (x.byteLength ?? x.length), 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, Object.keys(files).length, true);
  end.setUint16(10, Object.keys(files).length, true);
  end.setUint32(12, cdSize, true);
  end.setUint32(16, offset, true);
  return new Blob([...parts, ...central, end], { type });
}

// Word and Excel, with no library: read .docx (text, headings, comments, tracked changes) and write
// simple .docx and .xlsx files.

const xmlDoc = (text) => new DOMParser().parseFromString(text, 'application/xml');
const xmlEsc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
  .replace(/[\u0000-\u0008\u000b\u000c\u000e-\u001f]/g, '');
const attr = (el, name) => el.getAttribute('w:' + name);
const kids = (el, local) => [...el.children].filter((c) => c.localName === local);

// ---------- reading Word ----------
// -> { paragraphs: [{style, text, ins: [{author, date, text}], del: [...]}],
//      comments: [{id, author, date, text, anchor, para, parent, done}] }
async function parseDocx(buffer) {
  const zip = await readZip(buffer);
  const docXml = await zip.text('word/document.xml');
  if (!docXml) throw new Error('no word/document.xml: not a Word file');
  const styles = {};
  const stylesXml = await zip.text('word/styles.xml');
  if (stylesXml) {
    for (const s of xmlDoc(stylesXml).getElementsByTagName('w:style')) {
      const name = s.getElementsByTagName('w:name')[0];
      styles[attr(s, 'styleId')] = name ? attr(name, 'val') : attr(s, 'styleId');
    }
  }
  const paragraphs = [];
  const anchors = {};   // comment id -> {text, para}
  const open = new Set();
  let para = null;
  const change = [];    // stack of {kind, author, date}

  const add = (text, deleted) => {
    if (!para) return;
    const c = change[change.length - 1];
    if (!deleted) para.text += text;
    if (c) {
      const list = deleted || c.kind === 'del' ? para.del : para.ins;
      const last = list[list.length - 1];
      if (last && last.author === c.author) last.text += text; else list.push({ author: c.author, date: c.date, text });
    }
    if (!deleted) for (const id of open) anchors[id].text += text;
  };

  const walk = (node) => {
    for (const el of node.children) {
      switch (el.localName) {
        case 'p': {
          if (para) { walk(el); break; } // a paragraph inside a paragraph (text box): fold into the outer one
          const pStyle = el.getElementsByTagName('w:pStyle')[0];
          para = { style: pStyle ? (styles[attr(pStyle, 'val')] || attr(pStyle, 'val')) : '', text: '', ins: [], del: [] };
          walk(el);
          para.text = para.text.replace(/[ \t]+/g, ' ').trim();
          paragraphs.push(para);
          para = null;
          break;
        }
        case 'pPr': case 'rPr': case 'sectPr': case 'instrText': case 'fldChar': case 'drawing': case 'pict': case 'object':
          break;
        case 't': add(el.textContent); break;
        case 'delText': add(el.textContent, true); break;
        case 'tab': add('\t'); break;
        case 'br': case 'cr': add(' '); break;
        case 'noBreakHyphen': add('-'); break;
        case 'ins': case 'moveTo': case 'del': case 'moveFrom':
          change.push({ kind: el.localName === 'ins' || el.localName === 'moveTo' ? 'ins' : 'del', author: attr(el, 'author') || '', date: attr(el, 'date') || '' });
          walk(el);
          change.pop();
          break;
        case 'commentRangeStart': {
          const id = attr(el, 'id');
          anchors[id] = { text: '', para: paragraphs.length };
          open.add(id);
          break;
        }
        case 'commentRangeEnd': open.delete(attr(el, 'id')); break;
        case 'commentReference': {
          const id = attr(el, 'id');
          if (!anchors[id]) anchors[id] = { text: '', para: paragraphs.length };
          break;
        }
        case 'tc': walk(el); add('\t'); break;
        default: walk(el);
      }
    }
  };
  const body = xmlDoc(docXml).getElementsByTagName('w:body')[0];
  walk(body);

  const comments = [];
  const commentsXml = await zip.text('word/comments.xml');
  if (commentsXml) {
    const extended = {};
    const extXml = await zip.text('word/commentsExtended.xml');
    if (extXml) {
      for (const e of xmlDoc(extXml).getElementsByTagName('w15:commentEx')) {
        extended[e.getAttribute('w15:paraId')] = { parent: e.getAttribute('w15:paraIdParent'), done: e.getAttribute('w15:done') === '1' };
      }
    }
    const byPara = {};
    for (const c of xmlDoc(commentsXml).getElementsByTagName('w:comment')) {
      const ps = [...c.getElementsByTagName('w:p')];
      const text = ps.map((p) => [...p.getElementsByTagName('w:t')].map((t) => t.textContent).join('')).join('\n').trim();
      const paraId = ps.length ? ps[ps.length - 1].getAttribute('w14:paraId') : null;
      const id = attr(c, 'id');
      const item = {
        id, author: attr(c, 'author') || '', date: attr(c, 'date') || '', text,
        anchor: anchors[id] ? anchors[id].text.replace(/\s+/g, ' ').trim() : '',
        para: anchors[id] ? Math.min(anchors[id].para, paragraphs.length - 1) : null,
        paraId, parent: null, done: false,
      };
      if (paraId && extended[paraId]) item.done = extended[paraId].done;
      if (paraId) byPara[paraId] = item;
      comments.push(item);
    }
    for (const c of comments) {
      const parentPara = c.paraId && extended[c.paraId] && extended[c.paraId].parent;
      if (parentPara && byPara[parentPara]) {
        c.parent = byPara[parentPara].id;
        if (c.para === null) c.para = byPara[parentPara].para;
      }
    }
  }
  return { paragraphs, comments };
}

// Text of a Word file as simple HTML, for the preview panel.
async function docxPreviewHtml(buffer) {
  const { paragraphs, comments } = await parseDocx(buffer);
  const notes = {};
  for (const c of comments) if (c.para !== null && !c.parent) (notes[c.para] = notes[c.para] || []).push(c);
  return paragraphs.map((p, i) => {
    const s = p.style.toLowerCase();
    const tag = s === 'title' ? 'h1' : s.startsWith('heading 1') ? 'h2' : s.startsWith('heading') ? 'h3' : 'p';
    const text = esc(p.text).replace(/\{\s*([A-Z]{2,3}-\d{2,3})\s*\}/g, '<mark>{$1}</mark>');
    const cmt = (notes[i] || []).map((c) => `<div class="doc-comment"><b>${esc(c.author)}:</b> ${esc(c.text)}</div>`).join('');
    return p.text || cmt ? `<${tag}>${text}</${tag}>${cmt}` : '';
  }).join('');
}

// ---------- writing Word ----------
// blocks: [{type: 'title'|'h1'|'h2'|'p'|'small'|'table', text, rows: [[cell]], widths: [twips]}]
function makeDocx(blocks, opts = {}) {
  const run = (text, props = '') => String(text ?? '').split('\n').map((line, i) =>
    `${i ? '<w:r><w:br/></w:r>' : ''}<w:r>${props ? `<w:rPr>${props}</w:rPr>` : ''}<w:t xml:space="preserve">${xmlEsc(line)}</w:t></w:r>`).join('');
  const para = (text, style, props) => `<w:p>${style ? `<w:pPr><w:pStyle w:val="${style}"/></w:pPr>` : ''}${run(text, props)}</w:p>`;
  const body = blocks.map((b) => {
    if (b.type === 'title') return para(b.text, 'Title');
    if (b.type === 'h1') return para(b.text, 'Heading1');
    if (b.type === 'h2') return para(b.text, 'Heading2');
    if (b.type === 'small') return para(b.text, null, '<w:color w:val="666666"/><w:sz w:val="18"/>');
    if (b.type === 'table') {
      const widths = b.widths || b.rows[0].map(() => Math.floor((opts.landscape ? 14500 : 9600) / b.rows[0].length));
      const grid = widths.map((w) => `<w:gridCol w:w="${w}"/>`).join('');
      const rows = b.rows.map((row, r) => `<w:tr>${r === 0 ? '<w:trPr><w:tblHeader/></w:trPr>' : ''}${row.map((cell, c) =>
        `<w:tc><w:tcPr><w:tcW w:w="${widths[c]}" w:type="dxa"/>${r === 0 ? '<w:shd w:val="clear" w:color="auto" w:fill="DCE6F2"/>' : ''}</w:tcPr>${
          para(cell, null, r === 0 ? '<w:b/>' : '')}</w:tc>`).join('')}</w:tr>`).join('');
      return `<w:tbl><w:tblPr><w:tblStyle w:val="TableGrid"/><w:tblW w:w="0" w:type="auto"/></w:tblPr><w:tblGrid>${grid}</w:tblGrid>${rows}</w:tbl><w:p/>`;
    }
    return para(b.text);
  }).join('');
  const W = 'xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"';
  const files = {
    '[Content_Types].xml': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/></Types>`,

// ---------- writing Excel ----------
// sheets: [{name, rows: [[value | {v, s}]], widths: [chars], freeze: {rows, cols}, filter: true}]
// Styles s: 'head', 'bold', 'good', 'part', 'none', 'wrap'.
const XLSX_STYLES = { plain: 0, head: 1, bold: 2, good: 3, part: 4, none: 5, wrap: 6 };
function makeXlsx(sheets) {
  const colName = (n) => { let s = ''; for (n++; n; n = Math.floor((n - 1) / 26)) s = String.fromCharCode(65 + ((n - 1) % 26)) + s; return s; };
  const safeName = (name, i) => (String(name).replace(/[\[\]:*?\/\\]/g, ' ').slice(0, 31) || 'Sheet' + (i + 1));
  const files = {};
  sheets.forEach((sheet, i) => {
    const rows = sheet.rows.map((row, r) => `<row r="${r + 1}">${row.map((cell, c) => {
      const v = cell !== null && typeof cell === 'object' ? cell.v : cell;
      const s = cell !== null && typeof cell === 'object' && cell.s ? ` s="${XLSX_STYLES[cell.s] || 0}"` : (r === 0 && sheet.header !== false ? ' s="1"' : '');
      const ref = colName(c) + (r + 1);
      if (v === null || v === undefined || v === '') return s ? `<c r="${ref}"${s}/>` : '';
      if (typeof v === 'number') return `<c r="${ref}"${s}><v>${v}</v></c>`;
      return `<c r="${ref}"${s} t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
    }).join('')}</row>`).join('');
    const cols = sheet.widths ? `<cols>${sheet.widths.map((w, c) => `<col min="${c + 1}" max="${c + 1}" width="${w}" customWidth="1"/>`).join('')}</cols>` : '';
    const f = sheet.freeze;
    const pane = f ? `<sheetViews><sheetView workbookViewId="0"><pane${f.cols ? ` xSplit="${f.cols}"` : ''}${f.rows ? ` ySplit="${f.rows}"` : ''} topLeftCell="${colName(f.cols || 0)}${(f.rows || 0) + 1}" activePane="bottomRight" state="frozen"/></sheetView></sheetViews>` : '';
    const lastCol = colName(Math.max(1, ...sheet.rows.map((r) => r.length)) - 1);
    const filter = sheet.filter && sheet.rows.length > 1 ? `<autoFilter ref="A1:${lastCol}${sheet.rows.length}"/>` : '';
    files[`xl/worksheets/sheet${i + 1}.xml`] = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">${pane}${cols}<sheetData>${rows}</sheetData>${filter}</worksheet>`;
  });
  const names = sheets.map((s, i) => safeName(s.name, i));
  files['[Content_Types].xml'] = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${
    sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`;
  files['_rels/.rels'] = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`;
  files['xl/workbook.xml'] = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${
    names.map((n, i) => `<sheet name="${xmlEsc(n)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`;
  files['xl/_rels/workbook.xml.rels'] = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${
    sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')
  }<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`;
  const fill = (rgb) => `<fill><patternFill patternType="solid"><fgColor rgb="FF${rgb}"/><bgColor indexed="64"/></patternFill></fill>`;
  files['xl/styles.xml'] = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">`
    + `<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts>`
    + `<fills count="6"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill>${fill('DCE6F2')}${fill('C6EFCE')}${fill('FFEB9C')}${fill('FFC7CE')}</fills>`
    + `<borders count="2"><border/><border><left style="thin"><color rgb="FFBFBFBF"/></left><right style="thin"><color rgb="FFBFBFBF"/></right><top style="thin"><color rgb="FFBFBFBF"/></top><bottom style="thin"><color rgb="FFBFBFBF"/></bottom></border></borders>`
    + `<cellStyleXfs count="1"><xf/></cellStyleXfs><cellXfs count="7">`
    + `<xf/>`
    + `<xf fontId="1" fillId="2" borderId="1" applyFont="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf>`
    + `<xf fontId="1" applyFont="1"/>`
    + `<xf fillId="3" borderId="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center"/></xf>`
    + `<xf fillId="4" borderId="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center"/></xf>`
    + `<xf fillId="5" borderId="1" applyFill="1" applyBorder="1" applyAlignment="1"><alignment horizontal="center"/></xf>`
    + `<xf applyAlignment="1"><alignment wrapText="1" vertical="top"/></xf>`
    + `</cellXfs></styleSheet>`;
  return writeZip(files, 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet');
}

// ---------- remembering folders (IndexedDB) ----------
// If the browser's database never answers (seen in some locked-down set-ups), carry on without it:
// the tool then just asks for the folder each time.
function idb() {
  return new Promise((resolve, reject) => {
    setTimeout(() => reject(new Error('browser storage did not answer')), 3000);
    const req = indexedDB.open('ice-tool', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function remember(key, value) {
  let db;
  try { db = await idb(); } catch (_) { return; }
  await new Promise((resolve, reject) => {
    const tx = db.transaction('handles', 'readwrite');
    if (value === null) tx.objectStore('handles').delete(key); else tx.objectStore('handles').put(value, key);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}
async function recall(key) {
  let db;
  try { db = await idb(); } catch (_) { return null; }
  return new Promise((resolve) => {
    const req = db.transaction('handles').objectStore('handles').get(key);
    req.onsuccess = () => resolve(req.result || null);
    req.onerror = () => resolve(null);
  });
}

const supported = () => 'showDirectoryPicker' in window;

async function permission(handle, mode, ask) {
  if (!handle) return false;
  const opts = { mode };
  if ((await handle.queryPermission(opts)) === 'granted') return true;
  return ask ? (await handle.requestPermission(opts)) === 'granted' : false;
}

// ---------- reading and writing files ----------
async function subDir(dir, path, create = false) {
  for (const part of path.split('/').filter(Boolean)) dir = await dir.getDirectoryHandle(part, { create });
  return dir;
}
async function fileHandle(dir, path, create = false) {
  const parts = path.split('/');
  const name = parts.pop();
  return (await subDir(dir, parts.join('/'), create)).getFileHandle(name, { create });
}
async function exists(dir, path) {
  try { await fileHandle(dir, path); return true; } catch (_) { return false; }
}
async function readJson(dir, path) {
  const file = await (await fileHandle(dir, path)).getFile();
  return { json: JSON.parse(await file.text()), stamp: file.lastModified };
}
async function writeFile(dir, path, content) {
  const h = await fileHandle(dir, path, true);
  const w = await h.createWritable();
  await w.write(content);
  await w.close();
  return (await h.getFile()).lastModified;
}
// Every file under a folder, depth first: [{path, name, size, mtime, handle}]
async function listFiles(dir, prefix = '') {
  const out = [];
  for await (const [name, h] of dir.entries()) {
    if (IGNORE.test(name)) continue;
    const path = prefix ? `${prefix}/${name}` : name;
    if (h.kind === 'directory') out.push(...await listFiles(h, path));
    else {
      try {
        const f = await h.getFile();
        out.push({ path, name, size: f.size, mtime: f.lastModified, handle: h });
      } catch (_) { out.push({ path, name, size: 0, mtime: 0, handle: h }); }
    }
  }
  return out;
}
async function listDir(dir, path) {
  try { return await listFiles(await subDir(dir, path)); } catch (_) { return []; }
}

// A file from a path such as "Evidence/1 - Knowledge/CO-14 Site visit.pdf" in my folder or, failing
// that, in the other person's folder (so a mentor can open the apprentice's evidence).
async function getFile(path, where) {
  const roots = where === 'own' ? [S.own] : where === 'other' ? [S.other] : [S.own, S.other];
  for (const root of roots.filter(Boolean)) {
    try { return await (await fileHandle(root, path)).getFile(); } catch (_) { /* try the next */ }
  }
  throw new Error('file not found: ' + path);
}

// Fill in anything an older file lacks, so new features never meet undefined.
function upgrade(d) {
  if (d.role === 'mentor') {
    d.subs = d.subs || {}; d.evidence = d.evidence || {}; d.actions = d.actions || [];
    return d;
  }
  d.mode = d.mode || 'ice';
  d.framework = d.framework || null;   // null = the built-in ICE IEng framework
  d.profile = { jobRole: '', responsibilities: '', sector: '', ...(d.profile || {}) };
  d.settings = { goal: 3, cpdTarget: 30, cpdYearStart: 1, themes: [], ...(d.settings || {}) };
  d.evidence = d.evidence || {}; d.comments = d.comments || {}; d.meetings = d.meetings || [];
  d.cpd = d.cpd || { objectives: [], activities: [], reviews: [] };
  d.cpd.reviews = d.cpd.reviews || [];
  return d;
}

async function loadOwn() {
  for (const r of ['apprentice', 'mentor']) {
    if (await exists(S.own, `${DATA_DIR}/${FILES[r]}`)) {

  return false;
}

async function loadOther() {

  const name = isMentor() ? FILES.apprentice : FILES.mentor;

    S.otherData = upgrade((await readJson(S.other, `${DATA_DIR}/${name}`)).json);

// OneDrive makes "portfolio-LAPTOP.json" when two devices change the file while offline.
async function conflictCopies() {
  const out = [];
  try {
    const dir = await subDir(S.own, DATA_DIR);
    for await (const [name, h] of dir.entries()) {
      if (h.kind === 'file' && /\.json$/i.test(name) && !Object.values(FILES).includes(name)) out.push(name);
    }
  } catch (_) { /* no data folder yet */ }
  return out;
}

const saveSoon = debounce(() => save(), 700);
function changed() {
  S.dirty = true;
  setSaveState('Saving…');
  saveSoon();
}

async function save(force = false) {
  if (!S.data || S.saving) { if (S.saving) saveSoon(); return; }
  S.saving = true;
  try {
    const path = myDataPath();
    if (!force && S.loadedStamp) {
      let current = 0;
      try { current = (await (await fileHandle(S.own, path)).getFile()).lastModified; } catch (_) { /* new file */ }
      if (current && current > S.loadedStamp + 1000) {
        setSaveState('Not saved', 'bad');
        showConflict();
        return;
      }
    }
    S.data.saved = nowIso();
    const text = JSON.stringify(S.data, null, 1);
    S.loadedStamp = await writeFile(S.own, path, text);
    S.dirty = false;
    setSaveState('Saved');
    await dailyBackup(text);
  } catch (err) {
    setSaveState('Not saved', 'bad');
    toast('Could not save: ' + err.message, 'error');
  } finally {
    S.saving = false;
  }
}

// One copy a day in ice-data/backups, the newest 30 kept.
async function dailyBackup(text) {
  const base = isMentor() ? 'mentor' : 'portfolio';
  const path = `${DATA_DIR}/backups/${base}-${today()}.json`;
  if (await exists(S.own, path)) return;
  await writeFile(S.own, path, text);
  const dir = await subDir(S.own, `${DATA_DIR}/backups`);
  const names = [];
  for await (const [name] of dir.entries()) if (name.startsWith(base + '-')) names.push(name);
  names.sort();
  for (const old of names.slice(0, Math.max(0, names.length - 30))) await dir.removeEntry(old);
}

// One item per line, columns separated by " | " or a tab (so a table pasted from Excel or Word works).
const splitLine = (line) => line.split(/\t|\s*\|\s*/).map((s) => s.trim());
const lines = (text) => String(text || '').split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
const toLevelText = (fw) => fw.levels.map((l) => [l.short, l.name, l.help].join(' | ')).join('\n');

const toAttrText = (fw) => fw.attributes.map((a) => { const lv = a.min && fw.levels.find((l) => l.id === a.min); return [a.id, a.group, a.text, ...(lv ? ['needs: ' + lv.short] : [])].join(' | '); }).join('\n');
const toKsbText = (fw) => (fw.ksbs || []).map((k) => [k.id, k.kind, k.text, (k.attributes || []).join(', ')].join(' | ')).join('\n');

// Turns the form text into a framework, or throws a message saying what is wrong.
function buildFramework(f, previous) {
  const levels = lines(f.levels).map((l) => {
    const [short, name, ...help] = splitLine(l);
    if (!short || !name) throw new Error(`Level line "${l}": write it as  K | Knowledge | what this level means`);
    const old = previous.levels.find((x) => x.short === short);
    return { id: old ? old.id : slug(name) || slug(short), short, name, help: help.join(' | ') };
  });
  if (!levels.length) throw new Error('Add at least one level.');
  if (new Set(levels.map((l) => l.id)).size !== levels.length || new Set(levels.map((l) => l.short)).size !== levels.length) throw new Error('Each level needs its own letters and name.');
  const groups = lines(f.groups).map((l) => {
    const [id, ...title] = splitLine(l);
    if (!id) throw new Error(`Group line "${l}": write it as  1 | Title of the group`);
    return { id, title: title.join(' | ') || id };
  });
  const attributes = lines(f.attributes).map((l) => {
    const parts = splitLine(l);
    const need = /^needs:\s*(.+)$/i.exec(parts[parts.length - 1] || '');
    if (need) parts.pop();
    const [id, group, ...text] = parts;
    if (!id || !group || !text.length) throw new Error(`Requirement line "${l}": write it as  2b | 2 | The text of the requirement`);
    let min = '';
    if (need) {
      const lv = levels.find((x) => x.short.toLowerCase() === need[1].trim().toLowerCase() || x.name.toLowerCase() === need[1].trim().toLowerCase());
      if (!lv) throw new Error(`Requirement ${id}: "needs: ${need[1]}" is not one of your levels`);
      min = lv.id;
    }
    return { id, group, text: text.join(' | '), min };
  });
  if (!attributes.length) throw new Error('Add at least one requirement.');
  const ids = attributes.map((a) => a.id);
  if (new Set(ids.map((x) => x.toLowerCase())).size !== ids.length) throw new Error('Two requirements have the same id.');
  for (const a of attributes) if (!groups.some((g) => String(g.id) === a.group)) groups.push({ id: a.group, title: a.group });
  const ksbs = lines(f.ksbs).map((l) => {
    const [id, kind, text, links] = splitLine(l);
    if (!id || !text) throw new Error(`Standard line "${l}": write it as  K1 | Knowledge | The text | 2a, 2b`);
    return { id, kind: kind || '', text, attributes: (links || '').split(/[,;\s]+/).filter((x) => ids.includes(x)) };
  });
  if (new Set(ksbs.map((k) => k.id)).size !== ksbs.length) throw new Error('Two standards have the same id.');
  const folders = {};
  for (const k of Object.keys(DEFAULT_FOLDERS)) {
    const v = String(f.folders[k] || '').trim().replace(/[\\/:*?"<>|]+/g, ' ').trim();
    folders[k] = v || DEFAULT_FOLDERS[k];
  }
  if (new Set(Object.values(folders)).size !== Object.keys(folders).length) throw new Error('Each folder needs a different name.');
  const evidenceFolders = lines(f.evidenceFolders).map((x) => x.replace(/[\\/:*?"<>|]+/g, ' ').trim()).filter(Boolean);
  return { name: f.name.trim() || 'My framework', goal: previous.goal, source: previous.source, labels: { attr: f.labelAttr.trim() || 'Attributes', ksb: f.labelKsb.trim() || 'KSBs' }, levels, groups, attributes, ksbs, folders, evidenceFolders };
}


// What the views show, worked out from the data: evidence list, K/E/A coverage, PRR structure and checks,
